<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>文字化けメーカー</title>
<style>
@layer reset, base, components, utilities;

/* reset: 基本リセット */
@layer reset {
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input, textarea { font: inherit; }
}

/* base: 画面全体の基本デザイン */
@layer base {
  :root {
    --bg: #0e0f12;
    --panel: #17191f;
    --panel-2: #111318;
    --text: #f3f4f6;
    --muted: #a7abb4;
    --border: #2b2f39;
    --accent: #d7dae1;
    --accent-text: #101114;
    --danger: #ffb4b4;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    width: min(920px, calc(100% - 28px));
    margin: 0 auto;
    padding: 34px 0 48px;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 7vw, 48px);
    letter-spacing: .04em;
  }

  p { line-height: 1.7; }

  textarea {
    width: 100%;
    resize: vertical;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
  }

  textarea:focus, input:focus-visible, button:focus-visible {
    outline: 2px solid #8a8f9b;
    outline-offset: 2px;
  }
}

/* components: パネル・入力欄・候補・ボタン */
@layer components {
  .lead {
    margin: 8px 0 26px;
    color: var(--muted);
  }

  .panel {
    padding: 18px;
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
  }

  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .label {
    font-size: 14px;
    font-weight: 700;
  }

  .count {
    color: var(--muted);
    font-size: 12px;
  }

  .input {
    min-height: 150px;
    padding: 14px 15px;
  }

  .source-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  .source-actions .btn {
    width: 100%;
  }

  .output {
    min-height: 190px;
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 16px;
    line-height: 1.9;
    overflow-wrap: anywhere;
  }

  .range-wrap {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 14px;
  }

  .range {
    width: 100%;
    accent-color: var(--accent);
  }

  .level {
    min-width: 46px;
    padding: 7px 10px;
    text-align: center;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-weight: 800;
  }

  .scale {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    min-width: 0;
    min-height: 74px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    background: #20232b;
    text-align: left;
    cursor: pointer;
    transition: border-color .16s ease, background-color .16s ease, transform .16s ease;
  }

  .choice:hover {
    border-color: #737986;
    background: #272b34;
    transform: translateY(-1px);
  }

  .choice[aria-pressed="true"] {
    border-color: var(--accent);
    background: #30343d;
    box-shadow: 0 0 0 1px var(--accent) inset;
  }

  .choice-number {
    flex: 0 0 auto;
    min-width: 2.2em;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    line-height: 1.6;
  }

  .choice-text {
    min-width: 0;
    max-height: 7.8em;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    overflow: auto;
  }

  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 14px;
  }

  .btn {
    min-height: 46px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    background: #20232b;
    cursor: pointer;
  }

  .btn.primary {
    color: var(--accent-text);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 800;
  }

  .status {
    min-height: 1.5em;
    margin: 10px 2px 0;
    color: var(--muted);
    font-size: 12px;
  }

  .note {
    color: var(--muted);
    font-size: 12px;
  }
}

/* utilities: スマホ向け調整 */
@layer utilities {
  @media (max-width: 620px) {
    main { width: min(100% - 18px, 920px); padding-top: 22px; }
    .panel { padding: 14px; border-radius: 15px; }
    .choices { grid-template-columns: 1fr; }
    .actions { grid-template-columns: 1fr; }
  }
}
</style>
</head>
<body>
<main>
  <h1>文字化けメーカー</h1>
  <p class="lead">文章の文字間へ、Unicodeの文字化け風断片をランダムに挿入します。</p>

  <section class="panel">
    <div class="label-row">
      <div class="label">元の文章</div>
      <div class="count" id="inputCount">0文字</div>
    </div>
    <textarea id="source" class="input" placeholder="ここに文章を入力してください">※ホラー注意です。そこまで怖くありませんが、ホラーが苦手な方はご注意ください。</textarea>
    <div class="source-actions">
      <button id="clearSource" class="btn" type="button">元の文章をクリア</button>
    </div>
  </section>

  <section class="panel">
    <div class="label-row">
      <div class="label">埋め込み頻度</div>
      <div class="level" id="levelValue">3</div>
    </div>
    <div class="range-wrap">
      <input id="level" class="range" type="range" min="1" max="10" value="3" step="1" aria-label="埋め込み頻度">
      <span> / 10</span>
    </div>
    <div class="scale">
      <span>少なめ</span>
      <span>標準</span>
      <span>多め</span>
    </div>
    <p class="note">3は、原文の読みやすさを残しつつ、文字化け感も出しやすい初期値です。</p>
  </section>

  <section class="panel">
    <div class="label-row">
      <div class="label">候補から選択</div>
      <div class="count" id="candidateCount">20個</div>
    </div>
    <p class="note">20個の候補から選択できます。候補を再生成すると、すべての候補が作り直されます。</p>
    <div id="choices" class="choices" role="group" aria-label="生成候補"></div>
  </section>

  <section class="panel">
    <div class="label-row">
      <div class="label">生成結果</div>
      <div class="count" id="outputCount">0文字</div>
    </div>
    <textarea id="output" class="output" readonly></textarea>

    <div class="actions">
      <button id="regenerate" class="btn primary" type="button">候補を再生成</button>
      <button id="copy" class="btn" type="button">コピー</button>
      <button id="clear" class="btn" type="button">クリア</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </section>
</main>

<script>
(() => {
  const source = document.getElementById('source');
  const output = document.getElementById('output');
  const level = document.getElementById('level');
  const levelValue = document.getElementById('levelValue');
  const inputCount = document.getElementById('inputCount');
  const outputCount = document.getElementById('outputCount');
  const candidateCount = document.getElementById('candidateCount');
  const choices = document.getElementById('choices');
  const regenerate = document.getElementById('regenerate');
  const copy = document.getElementById('copy');
  const clear = document.getElementById('clear');
  const clearSource = document.getElementById('clearSource');
  const status = document.getElementById('status');

  const OPTION_COUNT = 20;
  let candidates = [];
  let selectedIndex = 0;

const glitchParts = [
  // 強い横線・斜線
  "\u0336", "\u0336", "\u0336", "\u0336", "\u0336", "\u0336",
  "\u0337", "\u0337", "\u0337", "\u0337", "\u0337", "\u0337",
  "\u0338", "\u0338", "\u0338", "\u0338", "\u0338", "\u0338",
  "\u0334", "\u0334", "\u0334", "\u0335", "\u0335", "\u0335",

  // 上下に現れる濁点・崩れ
  "\u0300", "\u0300", "\u0300",
  "\u0301", "\u0301", "\u0301", "\u0301",
  "\u0302", "\u0302", "\u0302",
  "\u0303", "\u0303", "\u0303", "\u0303",
  "\u0304", "\u0304", "\u0304",
  "\u0307", "\u0307", "\u0307", "\u0307",
  "\u0308", "\u0308", "\u0308",
  "\u030A", "\u030A", "\u030A",
  "\u030B", "\u030B", "\u030B",
  "\u030C", "\u030C", "\u030C",
  "\u0310", "\u0310", "\u0310",
  "\u0311", "\u0311", "\u0311",
  "\u0312", "\u0312", "\u0312",
  "\u0315", "\u0315", "\u0315",
  "\u0316", "\u0316", "\u0316",
  "\u0317", "\u0317", "\u0317",
  "\u0318", "\u0318", "\u0318",
  "\u0319", "\u0319", "\u0319",
  "\u031A", "\u031A", "\u031A",

  // 下方向の崩れ
  "\u031B", "\u031B", "\u031B",
  "\u0320", "\u0320", "\u0320",
  "\u0321", "\u0321", "\u0321",
  "\u0322", "\u0322", "\u0322",
  "\u0323", "\u0323", "\u0323", "\u0323",
  "\u0324", "\u0324", "\u0324",
  "\u0325", "\u0325", "\u0325",
  "\u0326", "\u0326", "\u0326",
  "\u0327", "\u0327", "\u0327",
  "\u0328", "\u0328", "\u0328",
  "\u0329", "\u0329", "\u0329",
  "\u032A", "\u032A", "\u032A",
  "\u032B", "\u032B", "\u032B",
  "\u032C", "\u032C", "\u032C",
  "\u032D", "\u032D", "\u032D",
  "\u032E", "\u032E", "\u032E",
  "\u032F", "\u032F", "\u032F",
  "\u0330", "\u0330", "\u0330",
  "\u0331", "\u0331", "\u0331",
  "\u0332", "\u0332", "\u0332", "\u0332",
  "\u0333", "\u0333", "\u0333",

  // 文字を囲む・侵食する記号
  "\u0346", "\u0346", "\u0346",
  "\u0347", "\u0347", "\u0347",
  "\u0348", "\u0348", "\u0348",
  "\u034D", "\u034D", "\u034D",
  "\u034E", "\u034E", "\u034E",
  "\u0350", "\u0350", "\u0350",
  "\u0351", "\u0351", "\u0351",
  "\u0352", "\u0352", "\u0352",
  "\u0353", "\u0353", "\u0353",
  "\u0354", "\u0354", "\u0354",
  "\u0355", "\u0355", "\u0355",
  "\u0356", "\u0356", "\u0356",
  "\u0357", "\u0357", "\u0357",
  "\u0358", "\u0358", "\u0358",
  "\u0359", "\u0359", "\u0359",
  "\u035A", "\u035A", "\u035A",
  "\u035B", "\u035B", "\u035B",
  "\u035C", "\u035C", "\u035C",
  "\u035D", "\u035D", "\u035D",
  "\u035E", "\u035E", "\u035E",
  "\u035F", "\u035F", "\u035F",
  "\u0360", "\u0360", "\u0360",
  "\u0361", "\u0361", "\u0361",
  "\u0362", "\u0362", "\u0362",

  // 特に不気味な記号
  "\u0488", "\u0488", "\u0488",
  "\u0489", "\u0489", "\u0489", "\u0489",
  "\u20E0", "\u20E0", "\u20E0",
  "\u20E2", "\u20E2", "\u20E2",
  "\u20E4", "\u20E4", "\u20E4",
  "\u20E5", "\u20E5", "\u20E5",
  "\u20E8", "\u20E8", "\u20E8",
  "\u20EA", "\u20EA", "\u20EA",
  "\u20EB", "\u20EB", "\u20EB",
  "\u20EC", "\u20EC", "\u20EC",
  "\u20ED", "\u20ED", "\u20ED",
  "\u20EE", "\u20EE", "\u20EE",
  "\u20EF", "\u20EF", "\u20EF",
  "\u20F0", "\u20F0", "\u20F0",

  // 見えるノイズ
  "█", "█", "█", "█",
  "▓", "▓", "▓",
  "▒", "▒", "▒",
  "░", "░", "░",
  "■", "■", "■",
  "▪", "▪", "▪",
  "◼", "◼",
  "◾", "◾",
  "▚", "▚",
  "▞", "▞",
  "†", "†",
  "‡",
  "⸸",
  "☠",
  "☣",
  "⛧",

  // まれに余白で欠落したように見せる
  " ", " ", " "
];

const combiningParts = new Set([
  "\u0300", "\u0301", "\u0302", "\u0303", "\u0304",
  "\u0305", "\u0306", "\u0307", "\u0308", "\u0309",
  "\u030A", "\u030B", "\u030C", "\u030D", "\u030E", "\u030F",
  "\u0310", "\u0311", "\u0312", "\u0313", "\u0314", "\u0315",
  "\u0316", "\u0317", "\u0318", "\u0319", "\u031A",
  "\u031B", "\u031C", "\u031D", "\u031E", "\u031F",
  "\u0320", "\u0321", "\u0322", "\u0323", "\u0324",
  "\u0325", "\u0326", "\u0327", "\u0328", "\u0329",
  "\u032A", "\u032B", "\u032C", "\u032D", "\u032E", "\u032F",
  "\u0330", "\u0331", "\u0332", "\u0333", "\u0334",
  "\u0335", "\u0336", "\u0337", "\u0338",
  "\u0346", "\u0347", "\u0348", "\u034D", "\u034E",
  "\u0350", "\u0351", "\u0352", "\u0353", "\u0354",
  "\u0355", "\u0356", "\u0357", "\u0358", "\u0359",
  "\u035A", "\u035B", "\u035C", "\u035D", "\u035E",
  "\u035F", "\u0360", "\u0361", "\u0362",
  "\u0488", "\u0489",
  "\u20E0", "\u20E2", "\u20E4", "\u20E5", "\u20E8",
  "\u20EA", "\u20EB", "\u20EC", "\u20ED", "\u20EE",
  "\u20EF", "\u20F0"
]);

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function makeChunk(currentLevel) {
    const min = Math.max(1, Math.floor(currentLevel / 3));
    const max = Math.max(2, Math.ceil(currentLevel * 0.9));
    const count = randInt(min, max);
    let chunk = '';

    for (let i = 0; i < count; i++) {
      let part = pick(glitchParts);

      if (i === 0 && combiningParts.has(part) && Math.random() < 0.3) {
        part = Math.random() < 0.5 ? '■' : '█';
      }

      chunk += part;
    }

    return chunk;
  }

  function probabilityFor(currentLevel) {
    const map = [0.10, 0.18, 0.28, 0.39, 0.52, 0.63, 0.73, 0.82, 0.90, 0.96];
    return map[currentLevel - 1];
  }

  function glitchText(text, currentLevel) {
    const chars = Array.from(text);
    if (!chars.length) return '';

    const probability = probabilityFor(currentLevel);
    let result = '';

    for (let i = 0; i < chars.length; i++) {
      const char = chars[i];
      result += char;

      const next = chars[i + 1];
      if (next === undefined) continue;
      if (char === '\n' || next === '\n') continue;

      if (Math.random() < probability) {
        result += makeChunk(currentLevel);
      }

      if (currentLevel >= 7 && Math.random() < (currentLevel - 6) * 0.06) {
        result += makeChunk(Math.max(2, currentLevel - 2));
      }
    }

    return result;
  }

  function updateCounts() {
    inputCount.textContent = `${Array.from(source.value).length}文字`;
    outputCount.textContent = `${Array.from(output.value).length}文字`;
    candidateCount.textContent = `${candidates.length}個`;
  }

  function updateChoiceState() {
    Array.from(choices.children).forEach((button, index) => {
      button.setAttribute('aria-pressed', index === selectedIndex ? 'true' : 'false');
    });
  }

  async function copyText(text, successMessage = 'コピーしました。') {
    if (!text) {
      status.textContent = 'コピーする文字列がありません。';
      return;
    }

    try {
      await navigator.clipboard.writeText(text);
      status.textContent = successMessage;
    } catch {
      output.focus();
      output.select();
      document.execCommand('copy');
      status.textContent = successMessage;
    }
  }

  async function selectCandidate(index) {
    selectedIndex = index;
    output.value = candidates[selectedIndex] || '';
    updateChoiceState();
    updateCounts();
    await copyText(output.value, `候補${selectedIndex + 1}を選択してコピーしました。`);
  }

  function renderCandidates() {
    choices.replaceChildren();

    candidates.forEach((candidate, index) => {
      const button = document.createElement('button');
      const number = document.createElement('span');
      const text = document.createElement('span');

      button.type = 'button';
      button.className = 'choice';
      button.setAttribute('aria-pressed', index === selectedIndex ? 'true' : 'false');
      button.setAttribute('aria-label', `候補${index + 1}を選択`);
      button.addEventListener('click', () => selectCandidate(index));

      number.className = 'choice-number';
      number.textContent = String(index + 1).padStart(2, '0');

      text.className = 'choice-text';
      text.textContent = candidate || '（空の候補）';

      button.append(number, text);
      choices.appendChild(button);
    });
  }

  function generate() {
    const currentLevel = Number(level.value);
    levelValue.textContent = currentLevel;
    candidates = Array.from({ length: OPTION_COUNT }, () => glitchText(source.value, currentLevel));
    selectedIndex = 0;
    renderCandidates();
    output.value = candidates[0] || '';
    status.textContent = '';
    updateCounts();
  }

  source.addEventListener('input', generate);
  level.addEventListener('input', generate);
  regenerate.addEventListener('click', generate);

  clearSource.addEventListener('click', () => {
    source.value = '';
    generate();
    source.focus();
  });

  clear.addEventListener('click', () => {
    output.value = '';
    status.textContent = '';
    updateCounts();
    output.focus();
  });

  copy.addEventListener('click', () => copyText(output.value));

  generate();
})();
</script>
</body>
</html>
