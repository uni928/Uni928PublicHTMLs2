<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>見出し画像メーカー</title>
<style>
@layer reset, base, components, utilities;

/* reset: ブラウザ既定差を抑える */
@layer reset {
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input, textarea { font: inherit; }
  button { cursor: pointer; }
}

/* base: 画面全体の基本設定 */
@layer base {
  :root {
    --bg: #f5f5f3;
    --panel: #ffffff;
    --text: #171717;
    --muted: #707070;
    --border: #d9d9d5;
    --accent: #161616;
    --accent-text: #ffffff;
    --radius: 18px;
    --shadow: 0 12px 35px rgba(0,0,0,.08);
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button, input, textarea {
    color: inherit;
  }
}

/* components: レイアウトと各UI部品 */
@layer components {
  .app {
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: 18px;
  }

  .header {
    padding: 18px 2px 14px;
  }

  .header h1 {
    margin: 0;
    font-size: clamp(24px, 5vw, 38px);
    letter-spacing: -.03em;
  }

  .header p {
    margin: 8px 0 0;
    color: var(--muted);
    line-height: 1.7;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);
    gap: 18px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .section-title {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 800;
  }

  .field {
    display: grid;
    gap: 8px;
    margin-bottom: 18px;
  }

  .field label {
    font-size: 14px;
    font-weight: 700;
  }

  .field small {
    color: var(--muted);
    line-height: 1.5;
  }

  #titleInput {
    width: 100%;
    min-height: 118px;
    resize: vertical;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: transparent;
    line-height: 1.65;
    outline: none;
  }

  #titleInput:focus {
    border-color: #777;
  }

  .backgrounds {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .background-more {
    margin-top: 10px;
  }

  .background-more summary {
    list-style: none;
    min-height: 42px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    user-select: none;
  }

  .background-more summary::-webkit-details-marker { display: none; }
  .background-more summary::after { content: " ＋"; }
  .background-more[open] summary::after { content: " −"; }
  .more-backgrounds { margin-top: 10px; }

  .bg-choice {
    position: relative;
    aspect-ratio: 1.55 / 1;
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 0;
    overflow: hidden;
    background: #ddd;
  }

  .bg-choice[data-selected="true"] {
    border-color: #111;
    box-shadow: 0 0 0 2px var(--panel) inset;
  }

  .bg-choice::after {
    content: attr(aria-label);
    position: absolute;
    left: 7px;
    bottom: 6px;
    max-width: calc(100% - 14px);
    padding: 3px 6px;
    border-radius: 7px;
    background: rgba(0,0,0,.52);
    color: #fff;
    font-size: 10px;
    line-height: 1.2;
  }

  .bg-minimal { background: linear-gradient(135deg,#f5f1e8,#dad7cf); }
  .bg-night { background: linear-gradient(135deg,#191d2d,#3d465f 52%,#11141e); }
  .bg-sky { background: linear-gradient(135deg,#b9ddf4,#f4f9fb 55%,#d9e9f5); }
  .bg-warm { background: linear-gradient(135deg,#f6d6bd,#ef9c76 52%,#7b4c47); }
  .bg-forest { background: linear-gradient(135deg,#dfe8d8,#718574 52%,#293d35); }
  .bg-purple { background: linear-gradient(135deg,#e2d9f4,#9586c7 55%,#4d456e); }
  .bg-paper {
    background:
      linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)),
      repeating-linear-gradient(0deg,#ddd8cf 0 1px,#f6f1e8 1px 7px);
  }
  .bg-grid {
    background:
      linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px),
      linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
      linear-gradient(135deg,#17202c,#2a3d50);
    background-size: 16px 16px,16px 16px,100% 100%;
  }
  .bg-pop {
    background:
      radial-gradient(circle at 20% 30%,#fff4a8 0 13%,transparent 14%),
      radial-gradient(circle at 80% 75%,#ffb8c4 0 14%,transparent 15%),
      linear-gradient(135deg,#f8efe8,#a8cfe7);
  }
  .bg-cream {
    background:
      radial-gradient(circle at 78% 25%,rgba(255,255,255,.9) 0 16%,transparent 17%),
      linear-gradient(135deg,#fbf4e8,#e6d8c3);
  }
  .bg-mint {
    background:
      radial-gradient(circle at 78% 30%,#f8fff9 0 17%,transparent 18%),
      linear-gradient(135deg,#e9f3ec,#a9cbbc);
  }
  .bg-peach {
    background:
      radial-gradient(circle at 80% 72%,#ffd8c8 0 17%,transparent 18%),
      linear-gradient(135deg,#fff3e9,#efb49f);
  }
  .bg-lavender {
    background:
      radial-gradient(circle at 77% 25%,#fff 0 12%,transparent 13%),
      linear-gradient(135deg,#f5f0fb,#c9bde0);
  }
  .bg-dots {
    background:
      radial-gradient(circle,rgba(85,77,67,.14) 0 2px,transparent 2.5px),
      linear-gradient(135deg,#faf6ee,#e9dfcf);
    background-size: 18px 18px,100% 100%;
  }
  .bg-arch {
    background:
      radial-gradient(ellipse at 82% 100%,#ddb5a5 0 27%,transparent 27.5%),
      radial-gradient(ellipse at 82% 100%,#f2d8c5 0 42%,transparent 42.5%),
      linear-gradient(135deg,#fbf5eb,#e7d8c5);
  }
  .bg-sage { background: linear-gradient(135deg,#eff4e9,#c7d4b9 55%,#8ea486); }
  .bg-lemon { background: radial-gradient(circle at 78% 28%,#fffbd1 0 19%,transparent 20%),linear-gradient(135deg,#fffbe9,#eadb91); }
  .bg-rose { background: radial-gradient(circle at 78% 70%,#f6bdc8 0 20%,transparent 21%),linear-gradient(135deg,#fff1f0,#dfa1ac); }
  .bg-aqua { background: linear-gradient(135deg,#edfafa,#b8dedd 55%,#74afb0); }
  .bg-denim { background: linear-gradient(135deg,#d8e6ef,#7398b1 55%,#314e68); }
  .bg-cocoa { background: linear-gradient(135deg,#f0dfcd,#b98e70 55%,#6e4b3d); }
  .bg-charcoal { background: linear-gradient(135deg,#4d5661,#242b35 58%,#13171d); }
  .bg-sunset { background: linear-gradient(135deg,#ffe6b8,#e58d87 54%,#735277); }
  .bg-ocean { background: linear-gradient(135deg,#b9edf0,#4c9fb1 54%,#203f66); }
  .bg-neon { background: radial-gradient(circle at 24% 30%,#fbff71 0 16%,transparent 17%),radial-gradient(circle at 78% 74%,#ff80bf 0 18%,transparent 19%),linear-gradient(135deg,#24204e,#4c3991); }
  .bg-geometry { background: linear-gradient(135deg,#ece5ff 0 33%,#c9b5ed 33% 66%,#9283c5 66%); }
  .bg-ribbons { background: linear-gradient(125deg,#f9efe5 0 28%,#d8b9a7 28% 38%,#f4d9c7 38% 63%,#b98686 63% 72%,#f7ebe2 72%); }
  .bg-confetti { background: radial-gradient(circle at 20% 25%,#f5a9b8 0 7%,transparent 8%),radial-gradient(circle at 74% 70%,#98d8c3 0 8%,transparent 9%),linear-gradient(135deg,#fff2d9,#e0c4e9); }
  .bg-waves { background: repeating-radial-gradient(ellipse at 100% 100%,transparent 0 17px,rgba(255,255,255,.26) 18px 20px),linear-gradient(135deg,#e9f0f4,#9db9c8); }
  .bg-mono { background: linear-gradient(135deg,#fafafa,#c6c6c6 55%,#777); }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }

  .option {
    display: grid;
    gap: 7px;
  }

  .option label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
  }

  select, input[type="color"] {
    width: 100%;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    padding: 0 10px;
  }

  input[type="color"] {
    padding: 4px;
  }

  .preview-wrap {
    position: sticky;
    top: 14px;
  }

  .canvas-shell {
    border-radius: 15px;
    overflow: hidden;
    background: #ddd;
    border: 1px solid var(--border);
    box-shadow: 0 16px 38px rgba(0,0,0,.13);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1280 / 670;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 14px;
  }

  .action-more {
    margin-top: 10px;
  }

  .action-more summary {
    list-style: none;
    min-height: 42px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    user-select: none;
  }

  .action-more summary::-webkit-details-marker { display: none; }

  .action-more summary::after {
    content: " ＋";
  }

  .action-more[open] summary::after {
    content: " −";
  }

  .more-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 10px;
  }

  .btn {
    flex: 1;
    min-height: 46px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: transparent;
    font-weight: 800;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .status {
    min-height: 1.5em;
    margin: 10px 2px 0;
    color: var(--muted);
    font-size: 12px;
  }
}

/* utilities: レスポンシブ調整 */
@layer utilities {
  @media (max-width: 820px) {
    .app { padding: 12px; }
    .layout { grid-template-columns: 1fr; }
    .preview-wrap { position: static; }
    .backgrounds { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 480px) {
    .backgrounds { grid-template-columns: repeat(2, 1fr); }
    .options { grid-template-columns: 1fr; }
    .actions, .more-actions { grid-template-columns: 1fr; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101113;
      --panel: #191a1e;
      --text: #f5f5f5;
      --muted: #aaaeb7;
      --border: #33353b;
      --accent: #f3f3f3;
      --accent-text: #111;
      --shadow: none;
    }

    .bg-choice[data-selected="true"] {
      border-color: #fff;
    }
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <h1>見出し画像メーカー</h1>
    <p>記事タイトルを入力して背景を選ぶだけで、1280×670pxの見出し画像を作成できます。</p>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="field">
        <label for="titleInput">記事タイトル</label>
        <textarea id="titleInput" maxlength="120" placeholder="例：ChatGPTで作ったHTMLを少しずつ改善してみた"></textarea>
        <small>文字数に合わせて自動で大きさを調整します。</small>
      </div>

      <h2 class="section-title">背景を選択</h2>
      <div id="backgrounds">
        <div class="backgrounds" id="primaryBackgrounds">
          <button class="bg-choice bg-minimal" type="button" data-bg="minimal" data-selected="true" aria-label="ミニマル"></button>
          <button class="bg-choice bg-paper" type="button" data-bg="paper" data-selected="false" aria-label="紙"></button>
          <button class="bg-choice bg-pop" type="button" data-bg="pop" data-selected="false" aria-label="ポップ"></button>
          <button class="bg-choice bg-cream" type="button" data-bg="cream" data-selected="false" aria-label="クリーム"></button>
          <button class="bg-choice bg-sky" type="button" data-bg="sky" data-selected="false" aria-label="空"></button>
          <button class="bg-choice bg-warm" type="button" data-bg="warm" data-selected="false" aria-label="暖色"></button>
        </div>
        <details class="background-more">
          <summary>もっと開く</summary>
          <div class="backgrounds more-backgrounds" id="moreBackgrounds">
            <button class="bg-choice bg-mint" type="button" data-bg="mint" data-selected="false" aria-label="ミント"></button>
            <button class="bg-choice bg-peach" type="button" data-bg="peach" data-selected="false" aria-label="桃色"></button>
            <button class="bg-choice bg-lavender" type="button" data-bg="lavender" data-selected="false" aria-label="薄紫"></button>
            <button class="bg-choice bg-dots" type="button" data-bg="dots" data-selected="false" aria-label="ドット紙"></button>
            <button class="bg-choice bg-arch" type="button" data-bg="arch" data-selected="false" aria-label="アーチ"></button>
            <button class="bg-choice bg-purple" type="button" data-bg="purple" data-selected="false" aria-label="紫"></button>
            <button class="bg-choice bg-forest" type="button" data-bg="forest" data-selected="false" aria-label="森林"></button>
            <button class="bg-choice bg-night" type="button" data-bg="night" data-selected="false" aria-label="ダーク"></button>
            <button class="bg-choice bg-grid" type="button" data-bg="grid" data-selected="false" aria-label="グリッド"></button>
            <button class="bg-choice bg-sage" type="button" data-bg="sage" data-selected="false" aria-label="セージ"></button>
            <button class="bg-choice bg-lemon" type="button" data-bg="lemon" data-selected="false" aria-label="レモン"></button>
            <button class="bg-choice bg-rose" type="button" data-bg="rose" data-selected="false" aria-label="ローズ"></button>
            <button class="bg-choice bg-aqua" type="button" data-bg="aqua" data-selected="false" aria-label="アクア"></button>
            <button class="bg-choice bg-denim" type="button" data-bg="denim" data-selected="false" aria-label="デニム"></button>
            <button class="bg-choice bg-cocoa" type="button" data-bg="cocoa" data-selected="false" aria-label="ココア"></button>
            <button class="bg-choice bg-charcoal" type="button" data-bg="charcoal" data-selected="false" aria-label="チャコール"></button>
            <button class="bg-choice bg-sunset" type="button" data-bg="sunset" data-selected="false" aria-label="夕焼け"></button>
            <button class="bg-choice bg-ocean" type="button" data-bg="ocean" data-selected="false" aria-label="海"></button>
            <button class="bg-choice bg-neon" type="button" data-bg="neon" data-selected="false" aria-label="ネオン"></button>
            <button class="bg-choice bg-geometry" type="button" data-bg="geometry" data-selected="false" aria-label="幾何学"></button>
            <button class="bg-choice bg-ribbons" type="button" data-bg="ribbons" data-selected="false" aria-label="リボン"></button>
            <button class="bg-choice bg-confetti" type="button" data-bg="confetti" data-selected="false" aria-label="紙吹雪"></button>
            <button class="bg-choice bg-waves" type="button" data-bg="waves" data-selected="false" aria-label="波"></button>
            <button class="bg-choice bg-mono" type="button" data-bg="mono" data-selected="false" aria-label="モノクロ"></button>
          </div>
        </details>
      </div>

      <div class="options">
        <div class="option">
          <label for="textColor">文字色</label>
          <input id="textColor" type="color" value="#181818">
        </div>
        <div class="option">
          <label for="align">文字位置</label>
          <select id="align">
            <option value="left">左寄せ</option>
            <option value="center">中央</option>
          </select>
        </div>
        <div class="option">
          <label for="weight">文字の太さ</label>
          <select id="weight">
            <option value="800">太字</option>
            <option value="700">やや太字</option>
            <option value="600">標準</option>
          </select>
        </div>
        <div class="option">
          <label for="overlay">背景の明るさ</label>
          <select id="overlay">
            <option value="0">そのまま</option>
            <option value="light">明るく</option>
            <option value="dark">暗く</option>
          </select>
        </div>
      </div>
    </section>

    <section class="panel preview-wrap">
      <h2 class="section-title">プレビュー</h2>
      <div class="canvas-shell">
        <canvas id="canvas" width="1280" height="670"></canvas>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="downloadBtn" type="button">PNGで保存</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>
  </div>
</main>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const titleInput = document.getElementById('titleInput');
  const textColor = document.getElementById('textColor');
  const align = document.getElementById('align');
  const weight = document.getElementById('weight');
  const overlay = document.getElementById('overlay');
  const backgrounds = document.getElementById('backgrounds');
  const status = document.getElementById('status');
  const W = canvas.width;
  const H = canvas.height;
  const ACTION_DB = 'heading-image-maker';
  const ACTION_STORE = 'preferences';
  const BACKGROUND_ORDER_KEY = 'background-order';
  const defaultBackgroundOrder = [
    'minimal','paper','pop','cream','sky','warm',
    'mint','peach','lavender','dots','arch','purple','forest','night','grid',
    'sage','lemon','rose','aqua','denim','cocoa','charcoal','sunset','ocean','neon',
    'geometry','ribbons','confetti','waves','mono'
  ];
  let backgroundOrder = [...defaultBackgroundOrder];
  let selectedBg = 'minimal';

  function setLinear(colors, angle = 135) {
    const rad = angle * Math.PI / 180;
    const x = Math.cos(rad), y = Math.sin(rad);
    const cx = W / 2, cy = H / 2;
    const len = Math.abs(W * x) + Math.abs(H * y);
    const g = ctx.createLinearGradient(
      cx - x * len / 2, cy - y * len / 2,
      cx + x * len / 2, cy + y * len / 2
    );
    colors.forEach(([stop, color]) => g.addColorStop(stop, color));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawSoftCircle(x, y, r, color, alpha = 1) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color.replace('ALPHA', String(alpha)));
    g.addColorStop(1, color.replace('ALPHA', '0'));
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function drawGrain(amount = 90, alpha = .045) {
    let seed = 928;
    const rand = () => {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    ctx.save();
    ctx.globalAlpha = alpha;
    for (let i = 0; i < amount; i++) {
      const x = rand() * W;
      const y = rand() * H;
      const r = .6 + rand() * 1.8;
      ctx.fillStyle = rand() > .5 ? '#ffffff' : '#000000';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBackground(type) {
    ctx.clearRect(0, 0, W, H);

    if (type === 'minimal') {
      setLinear([[0,'#f7f4ed'],[.55,'#ebe5d9'],[1,'#d4d0c8']], 125);
      drawSoftCircle(1065, 115, 360, 'rgba(255,255,255,ALPHA)', .62);
      ctx.fillStyle = 'rgba(43,38,31,.07)';
      ctx.beginPath(); ctx.arc(1115, 555, 290, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.38)';
      ctx.beginPath(); ctx.arc(1115, 555, 205, 0, Math.PI * 2); ctx.fill();
    }

    if (type === 'cream') {
      setLinear([[0,'#fcf7ee'],[.55,'#f1e7d7'],[1,'#ddcdb5']], 132);
      drawSoftCircle(1045, 115, 355, 'rgba(255,255,255,ALPHA)', .72);
      ctx.fillStyle = 'rgba(157,122,84,.09)';
      ctx.beginPath(); ctx.arc(1110, 545, 265, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(124,96,65,.11)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(1090, 160, 155, -.6, 2.35); ctx.stroke();
    }

    if (type === 'night') {
      setLinear([[0,'#0e1422'],[.5,'#26344d'],[1,'#0d111b']], 128);
      drawSoftCircle(1010, 90, 420, 'rgba(119,148,205,ALPHA)', .40);
      drawSoftCircle(1110, 570, 300, 'rgba(120,91,153,ALPHA)', .28);
      ctx.strokeStyle = 'rgba(255,255,255,.08)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(1080, 160, 190, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(1080, 160, 245, 0, Math.PI * 2); ctx.stroke();
    }

    if (type === 'sky') {
      setLinear([[0,'#b7dff7'],[.52,'#eff8fd'],[1,'#c9deec']], 145);
      drawSoftCircle(1090, 90, 310, 'rgba(255,255,255,ALPHA)', .75);
      ctx.fillStyle = 'rgba(255,255,255,.62)';
      [[850,170,175,55],[1010,135,210,66],[1160,205,190,58]].forEach(([x,y,rx,ry]) => {
        ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill();
      });
      ctx.fillStyle = 'rgba(88,135,168,.09)';
      ctx.beginPath(); ctx.ellipse(1080, 590, 370, 120, 0, 0, Math.PI * 2); ctx.fill();
    }

    if (type === 'mint') {
      setLinear([[0,'#edf6f0'],[.56,'#d5e8de'],[1,'#9dc5b3']], 132);

  function splitText(text, maxWidth, fontSize, fontWeight) {
    ctx.font = `${fontWeight} ${fontSize}px system-ui, sans-serif`;
    const source = text.trim() || '記事タイトルを入力してください';
    const lines = [];
    let line = '';

    for (const ch of source) {
      if (ch === '\n') {
        if (line) lines.push(line);
        line = '';
        continue;
      }
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function fitTitle(text) {
    const center = align.value === 'center';
    const maxWidth = center ? 1010 : 900;
    const maxHeight = 410;
    let size = text.trim().length <= 18 ? 104 : 94;

    while (size >= 46) {
      const lines = splitText(text, maxWidth, size, weight.value);
      const lineHeight = size * 1.18;
      if (lines.length <= 4 && lines.length * lineHeight <= maxHeight) {
        return { size, lines, lineHeight };
      }
      size -= 2;
    }

    const lines = splitText(text, maxWidth, 46, weight.value).slice(0,5);
    return { size: 46, lines, lineHeight: 56 };
  }

  function drawTitle() {
    const text = titleInput.value;
    const { size, lines, lineHeight } = fitTitle(text);
    const center = align.value === 'center';
    const x = center ? W / 2 : 110;
    const totalHeight = lines.length * lineHeight;
    const top = (H - totalHeight) / 2;
    let y = top + size * .86;

    // 小さなアクセント。タイトル本体より目立たせない
    ctx.save();
    ctx.fillStyle = textColor.value;
    ctx.globalAlpha = .78;
    if (center) {
      ctx.fillRect(W / 2 - 34, Math.max(78, top - 46), 68, 6);
    } else {
      ctx.fillRect(x, Math.max(78, top - 46), 78, 6);
      ctx.globalAlpha = .24;
      ctx.fillRect(x + 90, Math.max(78, top - 46), 28, 6);
    }
    ctx.restore();

    ctx.font = `${weight.value} ${size}px system-ui, sans-serif`;
    ctx.textAlign = center ? 'center' : 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = textColor.value;

    const darkText = textColor.value.toLowerCase() !== '#ffffff';
    ctx.shadowColor = darkText ? 'rgba(255,255,255,.34)' : 'rgba(0,0,0,.34)';
    ctx.shadowBlur = darkText ? 3 : 13;
    ctx.shadowOffsetY = darkText ? 1 : 4;

    lines.forEach((line, index) => {
      // 最終行が極端に短い場合はわずかに字間を広げて安定感を出す
      if (lines.length > 1 && index === lines.length - 1 && line.length <= 5 && !center) {
        let cursor = x;
        const spacing = 4;
        for (const ch of line) {
          ctx.fillText(ch, cursor, y);
          cursor += ctx.measureText(ch).width + spacing;
        }
      } else {
        ctx.fillText(line, x, y);
      }
      y += lineHeight;
    });

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
  }

  function render() {
    drawBackground(selectedBg);
    drawTitle();
  }

  function normalizeBackgroundOrder(saved) {
    return [
      ...(Array.isArray(saved) ? saved : []).filter(id => defaultBackgroundOrder.includes(id)),
      ...defaultBackgroundOrder.filter(id => !Array.isArray(saved) || !saved.includes(id))
    ];
  }

  function renderBackgroundChoices() {
    const primary = document.getElementById('primaryBackgrounds');
    const more = document.getElementById('moreBackgrounds');
    const buttons = new Map([...backgrounds.querySelectorAll('.bg-choice')].map(button => [button.dataset.bg, button]));
    const order = backgroundOrder.filter(id => buttons.has(id));
    primary.replaceChildren(...order.slice(0, 6).map(id => buttons.get(id)));
    more.replaceChildren(...order.slice(6).map(id => buttons.get(id)));
    backgrounds.querySelectorAll('.bg-choice').forEach(button => {
      button.dataset.selected = String(button.dataset.bg === selectedBg);
    });
  }

  async function loadBackgroundOrder() {
    try {
      const db = await openActionDb();
      const saved = await new Promise((resolve, reject) => {
        const request = db.transaction(ACTION_STORE, 'readonly').objectStore(ACTION_STORE).get(BACKGROUND_ORDER_KEY);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      db.close();
      backgroundOrder = normalizeBackgroundOrder(saved);
    } catch {
      backgroundOrder = [...defaultBackgroundOrder];
    }
    renderBackgroundChoices();
  }

  async function saveBackgroundOrder() {
    try {
      const db = await openActionDb();
      await new Promise((resolve, reject) => {
        const request = db.transaction(ACTION_STORE, 'readwrite').objectStore(ACTION_STORE).put(backgroundOrder, BACKGROUND_ORDER_KEY);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
      db.close();
    } catch {
      // IndexedDBを使えない環境でも、現在の並び順はそのまま利用する
    }
  }

  function promoteBackground(id) {
    backgroundOrder = [id, ...backgroundOrder.filter(item => item !== id)];
    renderBackgroundChoices();
    void saveBackgroundOrder();
  }

  function openActionDb() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(ACTION_DB, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(ACTION_STORE)) db.createObjectStore(ACTION_STORE);
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function canvasBlob(type, quality) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('encode failed')), type, quality);
    });
  }

  function safeFilename() {
    return (titleInput.value.trim() || 'heading-image')
      .replace(/[\\/:*?"<>|]/g,'')
      .slice(0,40);
  }

  async function downloadImage(type, extension, quality) {
    render();
    const blob = await canvasBlob(type, quality);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safeFilename()}.${extension}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    promoteBackground(selectedBg);
    status.textContent = `${extension.toUpperCase()}画像を保存しました。`;
  }

  backgrounds.addEventListener('click', e => {
    const btn = e.target.closest('.bg-choice');
    if (!btn) return;
    selectedBg = btn.dataset.bg;

    const darkTypes = new Set(['night','grid','charcoal','denim','ocean','neon']);
    textColor.value = darkTypes.has(selectedBg) ? '#ffffff' : '#181818';
    render();
  });

  [titleInput, textColor, align, weight, overlay].forEach(el => {
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  renderBackgroundChoices();
  loadBackgroundOrder();
  document.getElementById('downloadBtn').addEventListener('click', async event => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
      await downloadImage('image/png', 'png');
    } catch {
      status.textContent = 'PNG画像を保存できませんでした。';
    } finally {
      button.disabled = false;
    }
  });
  render();
})();
</script>
</body>
</html>
