<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フリー対戦 募集用紙メーカー</title>
<style>
@layer reset, base, layout, components, print;

/* reset: ブラウザ差を抑える */
@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input, textarea { font: inherit; }
  img { display: block; max-width: 100%; }
}

/* base: 全体の色・文字・基本要素 */
@layer base {
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --ink: #17191c;
    --muted: #6d737b;
    --line: #d7dce1;
    --soft: #f6f7f8;
    --accent: #2c333a;
    --paper-width: 210mm;
    --paper-height: 297mm;
  }

  body {
    min-height: 100vh;
    color: var(--ink);
    background: var(--bg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button {
    border: 0;
    cursor: pointer;
  }

  input, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    padding: 10px 12px;
    outline: none;
  }

  input:focus, textarea:focus {
    border-color: #929aa3;
    box-shadow: 0 0 0 3px rgba(40, 48, 56, .08);
  }

  textarea {
    min-height: 72px;
    resize: vertical;
  }
}

/* layout: 編集画面とプレビューの配置 */
@layer layout {
  .app {
    display: grid;
    grid-template-columns: minmax(300px, 390px) minmax(0, 1fr);
    min-height: 100vh;
  }

  .editor {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    overflow: auto;
    padding: 22px;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }

  .preview-wrap {
    min-width: 0;
    padding: 30px;
    overflow: auto;
  }

  .paper {
    width: var(--paper-width);
    min-height: var(--paper-height);
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 12px 42px rgba(0,0,0,.12);
  }

  @media (max-width: 980px) {
    .app { display: block; }
    .editor {
      position: static;
      height: auto;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .preview-wrap {
      padding: 16px 8px 34px;
      overflow-x: auto;
    }
    .paper {
      transform: none;
      transform-origin: top left;
    }
  }
}

/* components: 編集UIと用紙デザイン */
@layer components {
  .editor-head {
    margin-bottom: 20px;
  }

  .editor-head h1 {
    margin: 0 0 6px;
    font-size: 21px;
    letter-spacing: .02em;
  }

  .editor-head p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .field {
    margin-top: 15px;
  }

  .field label,
  .deck-editor-title {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 700;
  }

  .hint {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 18px;
  }

  .btn {
    min-height: 42px;
    border-radius: 10px;
    padding: 9px 12px;
    font-weight: 700;
  }

  .btn-primary {
    color: #fff;
    background: var(--accent);
  }

  .btn-secondary {
    color: var(--ink);
    background: var(--soft);
    border: 1px solid var(--line);
  }

  .deck-editor-list {
    display: grid;
    gap: 10px;
    margin-top: 10px;
  }

  .deck-editor {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--soft);
  }

  .deck-editor-top {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
  }

  .deck-editor-top strong {
    flex: 1;
    font-size: 13px;
  }

  .mini-btn {
    min-width: 31px;
    height: 31px;
    border-radius: 8px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink);
    font-weight: 700;
  }

  .deck-editor .field {
    margin-top: 9px;
  }

  .file-input {
    padding: 7px;
    font-size: 12px;
  }

  .sheet {
    min-height: var(--paper-height);
    padding: 15mm 14mm 13mm;
    display: flex;
    flex-direction: column;
  }

  .sheet-header {
    padding-bottom: 8mm;
    border-bottom: 2.2px solid #16191c;
    text-align: center;
  }

  .sheet-title {
    margin: 0;
    font-size: 29pt;
    line-height: 1.16;
    letter-spacing: .035em;
    font-weight: 850;
    overflow-wrap: anywhere;
  }

  .sheet-subtitle {
    margin: 3.2mm auto 0;
    max-width: 160mm;
    color: #4d5359;
    font-size: 12.5pt;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .sheet-user {
    display: inline-block;
    margin-top: 4mm;
    padding: 1.7mm 4mm;
    border: 1.2px solid #8f969d;
    border-radius: 99px;
    font-size: 11pt;
    font-weight: 700;
  }

  .section {
    margin-top: 8mm;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 3mm;
    margin-bottom: 3.5mm;
    font-size: 12pt;
    font-weight: 850;
  }

  .section-label::after {
    content: "";
    height: 1px;
    flex: 1;
    background: #cbd0d5;
  }

  .games {
    display: flex;
    flex-wrap: wrap;
    gap: 2.3mm;
  }

.game-chip {
  display: inline-block;
  position: relative;
  height: 10mm;
  padding: 0 4mm;
  border: 1.5px solid #202428;
  border-radius: 2.2mm;
  vertical-align: top;
  white-space: nowrap;
  font-size: 0;
}

.game-chip-text {
  display: block;
  position: relative;
  top: 50%;
  transform: translateY(-56%);
  font-size: 13pt;
  font-weight: 800;
  line-height: 1;
  white-space: nowrap;
}

  .empty-note {
    color: #9ba1a7;
    font-size: 11pt;
  }

  .deck-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4mm;
  }

  .deck-card {
    display: grid;
    grid-template-columns: 32mm minmax(0, 1fr);
    min-height: 42mm;
    border: 1.2px solid #b8bec4;
    border-radius: 3mm;
    overflow: hidden;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .deck-card.no-image {
    grid-template-columns: 1fr;
    min-height: 25mm;
  }

  .deck-image {
    width: 32mm;
    height: 100%;
    min-height: 42mm;
    object-fit: cover;
    background: #f0f2f3;
  }

  .deck-body {
    min-width: 0;
    padding: 4mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .deck-title {
    font-size: 13pt;
    line-height: 1.3;
    font-weight: 850;
    overflow-wrap: anywhere;
  }

  .deck-note {
    margin-top: 2mm;
    color: #565c62;
    font-size: 9.5pt;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .sheet-footer {
    margin-top: auto;
    padding-top: 7mm;
    text-align: center;
    color: #4e545a;
    font-size: 9.5pt;
    letter-spacing: .02em;
  }

  .hidden { display: none; }

  /* preview: 狭い画面でもA4実寸を維持し、必要なら横スクロールする */
  @media (max-width: 980px) {
    .paper {
      width: var(--paper-width);
      min-height: var(--paper-height);
    }
    .sheet {
      min-height: var(--paper-height);
    }
  }

  /* persistence: リアルタイム記憶・再編集用データ操作UI */
  .memory-panel {
    margin-top: 18px;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--soft);
  }

  .memory-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 40px;
    font-size: 13px;
    font-weight: 750;
    cursor: pointer;
  }

  .memory-toggle input {
    width: 18px;
    height: 18px;
    margin: 0;
    padding: 0;
    accent-color: var(--accent);
  }

  .memory-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .memory-actions .wide {
    grid-column: 1 / -1;
  }

  .memory-status {
    min-height: 1.4em;
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
  }

}

/* print: 印刷時はA4用紙だけを表示 */
@layer print {
  @page {
    size: A4 portrait;
    margin: 0;
  }

  @media print {
    html, body {
      width: 210mm;
      height: auto;
      background: #fff;
    }
    .editor {
      display: none;
    }

    .app {
      display: block;
    }

    .preview-wrap {
      padding: 0;
      overflow: visible;
    }

    .paper {
      width: 210mm;
      min-height: 297mm;
      margin: 0;
      box-shadow: none;
    }

    .sheet {
      min-height: 297mm;
    }
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="editor">
    <div class="editor-head">
      <h1>フリー対戦 募集用紙メーカー</h1>
      <p>入力内容が右の印刷プレビューへ即時反映されます。空欄の項目は用紙に表示されません。</p>
    </div>

    <div class="field">
      <label for="titleInput">タイトル</label>
      <input id="titleInput" value="フリー対戦対戦相手募集！">
    </div>

    <div class="field">
      <label for="subtitleInput">サブタイトル</label>
      <textarea id="subtitleInput" placeholder="例：お気軽にお声がけください！"></textarea>
    </div>

    <div class="field">
      <label for="userInput">ユーザー名</label>
      <input id="userInput" value="@XXXXXX">
      <div class="hint">「@XXXXXX」のままの場合は印刷用紙に表示しません。</div>
    </div>

    <div class="field">
      <label for="gamesInput">希望カードゲーム</label>
      <textarea id="gamesInput" placeholder="1行に1つ入力&#10;例：カードゲームA&#10;カードゲームB"></textarea>
      <div class="hint">改行ごとに別の項目として表示します。</div>
    </div>

    <div class="field">
      <div class="deck-editor-title">所持デッキ</div>
      <div id="deckEditorList" class="deck-editor-list"></div>
      <button id="addDeckBtn" class="btn btn-secondary" type="button" style="width:100%;margin-top:10px;">＋ デッキを追加</button>
    </div>

    <div class="memory-panel">
      <label class="memory-toggle" for="realtimeMemory">
        <input id="realtimeMemory" type="checkbox" checked>
        <span>リアルタイム記憶</span>
      </label>
      <div class="hint">ONの間は編集中の内容とデッキ画像をIndexedDBへ自動保存し、次回起動時に続きから再開します。</div>
      <div class="memory-actions">
        <button id="exportBtn" class="btn btn-secondary" type="button">データを書き出す</button>
        <button id="importBtn" class="btn btn-secondary" type="button">データを読み込む</button>
        <button id="saveEditableBtn" class="btn btn-secondary wide" type="button">再編集可能なサイトとして保存</button>
      </div>
      <input id="importFileInput" type="file" accept="application/json,.json" hidden>
      <div id="memoryStatus" class="memory-status" aria-live="polite"></div>
    </div>

    <div class="actions">
      <button id="resetBtn" class="btn btn-secondary" type="button">初期化</button>
      <button id="saveImageBtn" class="btn btn-secondary" type="button">画像保存</button>
      <button id="printBtn" class="btn btn-primary" type="button" style="grid-column:1 / -1;">印刷する</button>
    </div>
  </aside>

  <main class="preview-wrap">
    <div class="paper">
      <article class="sheet" id="sheet">
        <header class="sheet-header">
          <h1 class="sheet-title" id="sheetTitle"></h1>
          <div class="sheet-subtitle hidden" id="sheetSubtitle"></div>
          <div class="sheet-user hidden" id="sheetUser"></div>
        </header>

        <section class="section hidden" id="gamesSection">
          <div class="section-label">希望カードゲーム</div>
          <div class="games" id="gamesPreview"></div>
        </section>

        <section class="section hidden" id="decksSection">
          <div class="section-label">所持デッキ</div>
          <div class="deck-grid" id="decksPreview"></div>
        </section>

        <footer class="sheet-footer">フリー対戦歓迎です。お気軽にお声がけください。</footer>
      </article>
    </div>
  </main>
</div>

<script>
(() => {
  const DEFAULT_USER = "@XXXXXX";
  let decks = [];
  let deckSerial = 0;

  const $ = (id) => document.getElementById(id);
  const els = {
    title: $("titleInput"),
    subtitle: $("subtitleInput"),
    user: $("userInput"),
    games: $("gamesInput"),
    deckEditorList: $("deckEditorList"),
    addDeckBtn: $("addDeckBtn"),
    resetBtn: $("resetBtn"),
    saveImageBtn: $("saveImageBtn"),
    printBtn: $("printBtn"),
    realtimeMemory: $("realtimeMemory"),
    exportBtn: $("exportBtn"),
    importBtn: $("importBtn"),
    saveEditableBtn: $("saveEditableBtn"),
    importFileInput: $("importFileInput"),
    memoryStatus: $("memoryStatus"),
    sheetTitle: $("sheetTitle"),
    sheetSubtitle: $("sheetSubtitle"),
    sheetUser: $("sheetUser"),
    gamesSection: $("gamesSection"),
    gamesPreview: $("gamesPreview"),
    decksSection: $("decksSection"),
    decksPreview: $("decksPreview")
  };



  const DB_NAME = "freeMatchOpponentSheetMaker";
  const DB_VERSION = 1;
  const STORE_NAME = "settings";
  let memoryReady = false;
  let saveTimer = 0;

  function setMemoryStatus(message) {
    els.memoryStatus.textContent = message || "";
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) {
        reject(new Error("IndexedDBに対応していません"));
        return;
      }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("IndexedDBを開けませんでした"));
    });
  }

  async function dbGet(key) {
    const db = await openDatabase();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const request = tx.objectStore(STORE_NAME).get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    } finally {
      db.close();
    }
  }

  async function dbSet(key, value) {
    const db = await openDatabase();
    try {
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(value, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error("IndexedDBへの保存に失敗しました"));
      });
    } finally {
      db.close();
    }
  }

  function getCurrentState() {
    return {
      version: 1,
      title: els.title.value,
      subtitle: els.subtitle.value,
      user: els.user.value,
      games: els.games.value,
      decks: decks.map(deck => ({
        id: Number(deck.id),
        title: String(deck.title || ""),
        note: String(deck.note || ""),
        image: String(deck.image || "")
      })),
      deckSerial
    };
  }

  function normalizeImportedState(raw) {
    const state = raw && raw.state ? raw.state : raw;
    if (!state || typeof state !== "object") {
      throw new Error("編集データの形式が正しくありません");
    }
    const normalizedDecks = Array.isArray(state.decks) ? state.decks.slice(0, 100).map((deck, index) => ({
      id: Number.isFinite(Number(deck && deck.id)) ? Number(deck.id) : index + 1,
      title: typeof (deck && deck.title) === "string" ? deck.title : "",
      note: typeof (deck && deck.note) === "string" ? deck.note : "",
      image: typeof (deck && deck.image) === "string" ? deck.image : ""
    })) : [];
    const maxId = normalizedDecks.reduce((max, deck) => Math.max(max, deck.id), 0);
    return {
      version: 1,
      title: typeof state.title === "string" ? state.title : "フリー対戦対戦相手募集！",
      subtitle: typeof state.subtitle === "string" ? state.subtitle : "",
      user: typeof state.user === "string" ? state.user : DEFAULT_USER,
      games: typeof state.games === "string" ? state.games : "",
      decks: normalizedDecks,
      deckSerial: Math.max(Number(state.deckSerial) || 0, maxId)
    };
  }

  function applyState(raw) {
    const state = normalizeImportedState(raw);
    els.title.value = state.title;
    els.subtitle.value = state.subtitle;
    els.user.value = state.user;
    els.games.value = state.games;
    decks = state.decks;
    deckSerial = state.deckSerial;
    renderDeckEditors();
    render();
  }

  function scheduleRealtimeSave() {
    if (!memoryReady || !els.realtimeMemory.checked) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await dbSet("editorState", getCurrentState());
        setMemoryStatus("編集中の内容を保存しました");
      } catch (error) {
        console.error(error);
        setMemoryStatus("自動保存に失敗しました");
      }
    }, 250);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function makeTimestamp() {
    const now = new Date();
    return now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0") + "_" +
      String(now.getHours()).padStart(2, "0") +
      String(now.getMinutes()).padStart(2, "0");
  }

  function encodeBase64Utf8(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = "";
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function decodeBase64Utf8(base64) {
    const binary = atob(base64.trim());
    const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function getEmbeddedEditableData() {
    const node = document.getElementById("embeddedEditableState");
    if (!node || !node.textContent.trim()) return null;
    try {
      return JSON.parse(decodeBase64Utf8(node.textContent));
    } catch (error) {
      console.error("埋め込み編集データを読み込めませんでした", error);
      return null;
    }
  }

  function exportData() {
    const payload = {
      app: "free-match-opponent-sheet-maker",
      version: 1,
      exportedAt: new Date().toISOString(),
      state: getCurrentState()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
    downloadBlob(blob, `free-match-sheet_edit_${makeTimestamp()}.json`);
    setMemoryStatus("編集データを書き出しました");
  }

  async function importDataFile(file) {
    const text = await file.text();
    const payload = JSON.parse(text);
    applyState(payload);
    if (els.realtimeMemory.checked) {
      await dbSet("editorState", getCurrentState());
    }
    setMemoryStatus("編集データを読み込みました");
  }

  function saveEditableSite() {
    const payload = {
      app: "free-match-opponent-sheet-maker",
      version: 1,
      exportedAt: new Date().toISOString(),
      realtimeEnabled: els.realtimeMemory.checked,
      state: getCurrentState()
    };
    const clone = document.documentElement.cloneNode(true);
    const oldEmbedded = clone.querySelector("#embeddedEditableState");
    if (oldEmbedded) oldEmbedded.remove();
    const embedded = document.createElement("script");
    embedded.id = "embeddedEditableState";
    embedded.type = "application/octet-stream";
    embedded.textContent = encodeBase64Utf8(JSON.stringify(payload));
    const mainScript = Array.from(clone.querySelectorAll("body > script")).find(node => node.id !== "embeddedEditableState");
    if (mainScript) {
      clone.querySelector("body").insertBefore(embedded, mainScript);
    } else {
      clone.querySelector("body").appendChild(embedded);
    }
    const html = "<!doctype html>\n" + clone.outerHTML;
    downloadBlob(new Blob([html], { type: "text/html;charset=utf-8" }), `free-match-sheet_editable_${makeTimestamp()}.html`);
    setMemoryStatus("現在の内容を再編集可能なHTMLとして保存しました");
  }

  async function initializePersistence() {
    let realtimeEnabled = true;
    try {
      const storedEnabled = await dbGet("realtimeEnabled");
      if (typeof storedEnabled === "boolean") realtimeEnabled = storedEnabled;
    } catch (error) {
      console.warn("リアルタイム記憶の設定を読み込めませんでした", error);
    }

    const embedded = getEmbeddedEditableData();
    if (embedded) {
      realtimeEnabled = typeof embedded.realtimeEnabled === "boolean" ? embedded.realtimeEnabled : realtimeEnabled;
      els.realtimeMemory.checked = realtimeEnabled;
      applyState(embedded);
      setMemoryStatus("保存HTMLに埋め込まれた編集内容を読み込みました");
    } else {
      els.realtimeMemory.checked = realtimeEnabled;
      if (realtimeEnabled) {
        try {
          const saved = await dbGet("editorState");
          if (saved) {
            applyState(saved);
            setMemoryStatus("前回の編集内容を復元しました");
          }
        } catch (error) {
          console.warn("前回の編集内容を読み込めませんでした", error);
          setMemoryStatus("保存内容を読み込めませんでした");
        }
      }
    }

    memoryReady = true;
    if (els.realtimeMemory.checked && embedded) scheduleRealtimeSave();
  }

  const escapeHtml = (value) => String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  function addDeck(data = {}) {
    decks.push({
      id: ++deckSerial,
      title: data.title || "",
      note: data.note || "",
      image: data.image || ""
    });
    renderDeckEditors();
    render();
  }

  function removeDeck(id) {
    decks = decks.filter(deck => deck.id !== id);
    renderDeckEditors();
    render();
  }

  function moveDeck(id, direction) {
    const index = decks.findIndex(deck => deck.id === id);
    const next = index + direction;
    if (index < 0 || next < 0 || next >= decks.length) return;
    [decks[index], decks[next]] = [decks[next], decks[index]];
    renderDeckEditors();
    render();
  }

  function renderDeckEditors() {
    els.deckEditorList.innerHTML = decks.map((deck, index) => `
      <div class="deck-editor" data-id="${deck.id}">
        <div class="deck-editor-top">
          <strong>デッキ ${index + 1}</strong>
          <button class="mini-btn move-up" type="button" title="上へ">↑</button>
          <button class="mini-btn move-down" type="button" title="下へ">↓</button>
          <button class="mini-btn remove-deck" type="button" title="削除">×</button>
        </div>
        <div class="field">
          <label>タイトル</label>
          <input class="deck-title-input" value="${escapeHtml(deck.title)}" placeholder="例：デッキ名">
        </div>
        <div class="field">
          <label>補足</label>
          <textarea class="deck-note-input" placeholder="例：調整中 / カジュアル寄り">${escapeHtml(deck.note)}</textarea>
        </div>
        <div class="field">
          <label>画像</label>
          <input class="deck-image-input file-input" type="file" accept="image/*">
          ${deck.image ? '<div class="hint">画像設定済み。別画像を選ぶと置き換わります。</div>' : ''}
        </div>
      </div>
    `).join("");

    els.deckEditorList.querySelectorAll(".deck-editor").forEach(card => {
      const id = Number(card.dataset.id);
      const deck = decks.find(item => item.id === id);
      card.querySelector(".deck-title-input").addEventListener("input", e => {
        deck.title = e.target.value;
        render();
      });
      card.querySelector(".deck-note-input").addEventListener("input", e => {
        deck.note = e.target.value;
        render();
      });
      card.querySelector(".deck-image-input").addEventListener("change", e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          deck.image = reader.result;
          renderDeckEditors();
          render();
        };
        reader.readAsDataURL(file);
      });
      card.querySelector(".remove-deck").addEventListener("click", () => removeDeck(id));
      card.querySelector(".move-up").addEventListener("click", () => moveDeck(id, -1));
      card.querySelector(".move-down").addEventListener("click", () => moveDeck(id, 1));
    });
  }

  function render() {
    const title = els.title.value.trim() || "フリー対戦対戦相手募集！";
    const subtitle = els.subtitle.value.trim();
    const user = els.user.value.trim();
    const games = els.games.value
      .split(/\r?\n/)
      .map(v => v.trim())
      .filter(Boolean);

    els.sheetTitle.textContent = title;

    els.sheetSubtitle.textContent = subtitle;
    els.sheetSubtitle.classList.toggle("hidden", !subtitle);

    const showUser = Boolean(user) && user !== DEFAULT_USER;
    els.sheetUser.textContent = user;
    els.sheetUser.classList.toggle("hidden", !showUser);

    els.gamesSection.classList.toggle("hidden", games.length === 0);
    els.gamesPreview.innerHTML = games.map(game => `<div class="game-chip"><span class="game-chip-text">${escapeHtml(game)}</span></div>`).join("");

    const visibleDecks = decks.filter(deck => deck.title.trim() || deck.note.trim() || deck.image);
    els.decksSection.classList.toggle("hidden", visibleDecks.length === 0);
    els.decksPreview.innerHTML = visibleDecks.map(deck => {
      const hasImage = Boolean(deck.image);
      const titleText = deck.title.trim() || "デッキ";
      return `
        <div class="deck-card ${hasImage ? "" : "no-image"}">
          ${hasImage ? `<img class="deck-image" src="${deck.image}" alt="">` : ""}
          <div class="deck-body">
            <div class="deck-title">${escapeHtml(titleText)}</div>
            ${deck.note.trim() ? `<div class="deck-note">${escapeHtml(deck.note.trim())}</div>` : ""}
          </div>
        </div>
      `;
    }).join("");
    scheduleRealtimeSave();
  }


async function saveSheetAsImage() {
  try {
    const sheet = document.getElementById("sheet");

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    const module = await import("https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/+esm");

    const pixelRatio = 300 / 96;
    const dataUrl = await module.toPng(sheet, {
      cacheBust: true,
      backgroundColor: "#ffffff",
      pixelRatio,
      width: sheet.scrollWidth,
      height: sheet.scrollHeight,
      canvasWidth: Math.round(sheet.scrollWidth * pixelRatio),
      canvasHeight: Math.round(sheet.scrollHeight * pixelRatio),
      style: {
        margin: "0",
        transform: "none",
        boxShadow: "none"
      }
    });

    const response = await fetch(dataUrl);
    const blob = await response.blob();
    downloadBlob(blob, `free-match-sheet_${makeTimestamp()}.png`);
  } catch (error) {
    console.error(error);
    alert("画像の保存に失敗しました。");
  }
}

  function resetAll() {
    els.title.value = "フリー対戦対戦相手募集！";
    els.subtitle.value = "";
    els.user.value = DEFAULT_USER;
    els.games.value = "";
    decks = [];
    deckSerial = 0;
    renderDeckEditors();
    render();
  }

  [els.title, els.subtitle, els.user, els.games].forEach(el => {
    el.addEventListener("input", render);
  });

  els.addDeckBtn.addEventListener("click", () => addDeck());
  els.resetBtn.addEventListener("click", resetAll);
  els.saveImageBtn.addEventListener("click", saveSheetAsImage);
  els.printBtn.addEventListener("click", () => window.print());
  els.exportBtn.addEventListener("click", exportData);
  els.importBtn.addEventListener("click", () => els.importFileInput.click());
  els.importFileInput.addEventListener("change", async () => {
    const file = els.importFileInput.files && els.importFileInput.files[0];
    if (!file) return;
    try {
      await importDataFile(file);
    } catch (error) {
      console.error(error);
      alert("編集データの読み込みに失敗しました。");
    } finally {
      els.importFileInput.value = "";
    }
  });
  els.saveEditableBtn.addEventListener("click", saveEditableSite);
  els.realtimeMemory.addEventListener("change", async () => {
    try {
      await dbSet("realtimeEnabled", els.realtimeMemory.checked);
      if (els.realtimeMemory.checked) {
        await dbSet("editorState", getCurrentState());
        setMemoryStatus("リアルタイム記憶をONにし、現在の内容を保存しました");
      } else {
        clearTimeout(saveTimer);
        setMemoryStatus("リアルタイム記憶をOFFにしました");
      }
    } catch (error) {
      console.error(error);
      setMemoryStatus("記憶設定の保存に失敗しました");
    }
  });

  renderDeckEditors();
  render();
  initializePersistence();
})();
</script>
</body>
</html>
