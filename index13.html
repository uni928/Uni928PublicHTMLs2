<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTMLショートカット作成</title>
<style>
@layer base, layout, components, responsive;

@layer base{
  /* base: 全体の配色・文字・共通要素 */
  :root{
    color-scheme:light;
    --bg:#f5f7fb;
    --panel:#fff;
    --text:#1f2937;
    --muted:#667085;
    --line:#d9e0ea;
    --accent:#3157d5;
    --accent-dark:#2747b2;
    --ok:#137a4d;
    --error:#b42318;
  }
  *{box-sizing:border-box}
  html{font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  body{margin:0;min-height:100vh;background:var(--bg)}
  button,input{font:inherit}
}

@layer layout{
  /* layout: 中央寄せの1カラム構成 */
  .wrap{width:min(720px,calc(100% - 32px));margin:0 auto;padding:48px 0 64px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
}

@layer components{
  /* components: 見出し・入力欄・ボタン・補足表示 */
  h1{margin:0;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.25}
  .lead{margin:12px 0 22px;color:var(--muted);line-height:1.8}
  label{display:block;margin-bottom:8px;font-weight:700}
  .url-input{
    width:100%;
    min-height:48px;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--text);
    outline:none;
  }
  .url-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(49,87,213,.10)}
  .button{
    width:100%;
    margin-top:14px;
    min-height:52px;
    border:0;
    border-radius:12px;
    padding:12px 16px;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    cursor:pointer;
  }
  .button:hover{background:var(--accent-dark)}
  .note{margin:14px 0 0;color:var(--muted);font-size:.92rem;line-height:1.7}
  .status{min-height:1.6em;margin-top:12px;font-weight:700}
  .status.ok{color:var(--ok)}
  .status.error{color:var(--error)}
  code{font-family:Consolas,"Courier New",monospace}
}

@layer responsive{
  /* responsive: モバイルでは余白を縮小 */
  @media(max-width:600px){
    .wrap{width:min(100% - 18px,720px);padding-top:18px}
    .panel{padding:18px;border-radius:16px}
  }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="panel">
    <h1>HTMLショートカット作成</h1>
    <p class="lead">URLを入力すると、そのサイトへ移動するための小さなHTMLファイルを保存できます。保存したHTMLを開くたびにクエリパラメータを付けて、古いキャッシュが使われにくい形でアクセスします。</p>

    <label for="urlInput">アクセス先URL</label>
    <input id="urlInput" class="url-input" type="url" inputmode="url" placeholder="https://example.com/" autocomplete="url">

    <button id="downloadButton" class="button" type="button">開くと入力したURLのサイトにアクセスできるファイルをダウンロード</button>

    <div id="status" class="status" aria-live="polite"></div>

    <p class="note">生成されるHTMLでは、開いた瞬間に <code>Date.now()</code> を評価し、<code>?123456789...</code> のようなクエリを付けてから遷移します。入力URLに既存のクエリやフラグメントがある場合も維持します。</p>
  </section>
</main>

<script>
(() => {
  "use strict";

  const input = document.getElementById("urlInput");
  const button = document.getElementById("downloadButton");
  const status = document.getElementById("status");

  function showStatus(message, type){
    status.textContent = message;
    status.className = "status" + (type ? " " + type : "");
  }

  function buildShortcutHtml(targetUrl){
    const url = new URL(targetUrl);
    const base = url.origin + url.pathname;
    const existingQuery = url.search ? url.search.slice(1) + "&" : "";
    const hash = url.hash;

    return '<!doctype html><meta charset="utf-8"><script>location.replace('
      + JSON.stringify(base + "?" + existingQuery)
      + '+Date.now()+'
      + JSON.stringify(hash)
      + ')<\/script>';
  }

  button.addEventListener("click", () => {
    const value = input.value.trim();

    if(!value){
      showStatus("URLを入力してください。","error");
      input.focus();
      return;
    }

    let targetUrl;
    try{
      targetUrl = new URL(value);
      if(targetUrl.protocol !== "http:" && targetUrl.protocol !== "https:"){
        throw new Error();
      }
    }catch(error){
      showStatus("http:// または https:// から始まるURLを入力してください。","error");
      input.focus();
      return;
    }

    const shortcutHtml = buildShortcutHtml(targetUrl.href);
    const blob = new Blob([shortcutHtml], {type:"text/html;charset=utf-8"});
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = "site-link.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 0);

    showStatus("HTMLショートカットを保存しました。","ok");
  });
})();
</script>
</body>
</html>
