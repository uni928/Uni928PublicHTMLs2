<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ダイレクトアタック文字メーカー</title>
<style>
@layer base, components, states;

@layer base {
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #222;
  }
  button, input { font: inherit; }
}

@layer components {
  .card {
    width: min(100%, 480px);
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 8px 30px rgb(0 0 0 / 8%);
  }
  h1 {
    margin: 0 0 10px;
    font-size: 1.35rem;
  }
  p {
    margin: 0 0 22px;
    line-height: 1.7;
    color: #555;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 700;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #bbb;
    border-radius: 10px;
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 13px 16px;
    border: 0;
    border-radius: 10px;
    background: #222;
    color: #fff;
    cursor: pointer;
  }
  .status {
    min-height: 1.5em;
    margin-top: 10px;
    font-size: .92rem;
    text-align: center;
    color: #666;
  }
}

@layer states {
  button:active { transform: translateY(1px); }
  input:focus-visible,
  button:focus-visible {
    outline: 3px solid rgb(0 0 0 / 18%);
    outline-offset: 2px;
  }
}
</style>
</head>
<body>
<main class="card">
  <h1>ダイレクトアタック文字メーカー</h1>
  <p>重ねる文字の個数を指定して、掲示板用の文字列をクリップボードへコピーします。</p>

  <label for="count">重ねる個数</label>
  <input id="count" type="number" min="30" max="500" value="50" inputmode="numeric">

  <button id="copyButton" type="button">クリップボードにコピー</button>
  <div id="status" class="status" aria-live="polite"></div>
</main>

<script>
(() => {
  const countInput = document.getElementById("count");
  const copyButton = document.getElementById("copyButton");
  const status = document.getElementById("status");

  const makeText = () => {
    let count = Number(countInput.value);
    if (!Number.isFinite(count)) count = 40;
    count = Math.max(20, Math.min(500, Math.round(count)));
    countInput.value = count;
    return "つb" + "\u0352".repeat(count) + "ダイレクトアタックや！";
  };

  copyButton.addEventListener("click", async () => {
    const text = makeText();

    try {
      await navigator.clipboard.writeText(text);
      status.textContent = "コピーしました。";
    } catch {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      status.textContent = "コピーしました。";
    }
  });
})();
</script>
</body>
</html>
