<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HTML圧縮</title>
<style>
@layer base,layout,components,responsive;

/* base: 基本スタイル */
@layer base{
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:system-ui,sans-serif;
 background:#f3f4f6;
 color:#111827;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px
}
h1{margin:0 0 10px;font-size:26px}
}

/* layout: ページ配置 */
@layer layout{
.a{
 width:min(760px,100%);
 background:#fff;
 border-radius:18px;
 box-shadow:0 20px 60px #0002;
 padding:28px
}
.m{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin:0 0 18px
}
}

/* components: UI部品 */
@layer components{
.l{margin:0 0 20px;color:#4b5563;line-height:1.7}
.m label{
 border:2px solid #e5e7eb;
 border-radius:14px;
 padding:14px;
 cursor:pointer;
 background:#f9fafb
}
.m input{display:inline-block}
.m b{display:block;margin:0 0 4px}
.m span{display:block;color:#6b7280;font-size:13px;line-height:1.5}

#d{
 border:3px dashed #9ca3af;
 border-radius:16px;
 background:#f9fafb;
 padding:42px 20px;
 text-align:center;
 cursor:pointer;
 transition:.2s
}
#d.o{border-color:#2563eb;background:#eff6ff}

.t{font-size:20px;font-weight:700;margin-bottom:8px}
.s{color:#6b7280;line-height:1.6}
#f{display:none}

#r{
 margin-top:18px;
 padding:14px 16px;
 border-radius:12px;
 background:#f3f4f6;
 color:#374151;
 line-height:1.6;
 white-space:pre-wrap
}

.n{
 margin-top:18px;
 padding:14px 16px;
 border-left:4px solid #f59e0b;
 background:#fffbeb;
 color:#78350f;
 border-radius:10px;
 line-height:1.7;
 font-size:14px
}
}

/* responsive: スマートフォン表示 */
@layer responsive{
@media(max-width:640px){
 .m{grid-template-columns:1fr}
}
}
</style>
</head>

<body>
<main class="a">

<h1>HTML圧縮</h1>

<p class="l">
単一HTMLをドラッグ＆ドロップすると、
元HTMLを変更せず、利用可能な圧縮方式の中から
最も小さいものを自動選択して自己解凍HTMLを生成します。
</p>

<div class="m">

<label>
<input type="radio" name="mode" value="safe" checked>
<b>安全版</b>
<span>
HTML / CSS / JavaScriptには一切手を加えず、
圧縮方式だけを最適化します。
</span>
</label>

<label>
<input type="radio" name="mode" value="try">
<b>挑戦版</b>
<span>
圧縮前に連続空白・コメントなどを削除してから圧縮します。
</span>
</label>

</div>

<div id="d">
<div class="t">ここに .html をドロップ</div>
<div class="s">またはクリックして選択</div>
<input id="f" type="file" accept=".html,.htm,text/html">
</div>

<div id="r">待機中です。</div>

<div class="n">
安全版では元HTMLを一切変更しません。
Brotli / deflate-raw / gzip など、ブラウザが利用できる方式を実際に試し、
最終的に最も小さくなる方式を自動的に採用します。
</div>

</main>

<script>
const d=document.getElementById('d');
const f=document.getElementById('f');
const r=document.getElementById('r');

d.onclick=()=>f.click();

f.onchange=()=>{
 if(f.files[0])run(f.files[0]);
 f.value=''
};

for(const e of ['dragenter','dragover']){
 d.addEventListener(e,x=>{
  x.preventDefault();
  d.classList.add('o')
 })
}

for(const e of ['dragleave','drop']){
 d.addEventListener(e,x=>{
  x.preventDefault();
  d.classList.remove('o')
 })
}

d.ondrop=e=>{
 const x=e.dataTransfer.files[0];
 if(x)run(x)
};

async function run(file){
 if(!/\.html?$/i.test(file.name)){
  msg('HTMLファイルを指定してください。');
  return
 }

 try{
  if(!window.CompressionStream||!window.DecompressionStream){
   throw Error('このブラウザは圧縮・解凍APIに対応していません。')
  }

  const mode=
   document.querySelector('input[name="mode"]:checked').value;

  msg(
   (mode==='safe'?'安全版':'挑戦版')+
   'で処理中です...'
  );

  const src=await file.text();

  /*
   安全版ではsrcをそのまま使用。
   HTML/CSS/JSの変更は一切しない。
  */
  const body=
   mode==='try'
    ?tryMinify(src)
    :src;

  const srcBytes=new TextEncoder().encode(src);
  const bodyBytes=new TextEncoder().encode(body);

  msg('利用可能な圧縮方式を比較しています...');

  const best=await findBestCompression(bodyBytes);

  const b64=bytesToBase64(best.bytes);

  const out=makePackedHtml(
   b64,
   best.format
  );

  const outBytes=
   new TextEncoder().encode(out).length;

  const name=
   file.name.replace(/\.html?$/i,'')+
   '.'+mode+
   '.packed.html';

  download(name,out);

  const reduction=
   (100-outBytes/srcBytes.length*100);

  msg(
   '完了しました。\n'+
   'モード: '+
   (mode==='safe'?'安全版':'挑戦版')+'\n'+
   '採用方式: '+best.format+'\n'+
   '元サイズ: '+fmt(srcBytes.length)+'\n'+
   '圧縮前データ: '+fmt(bodyBytes.length)+'\n'+
   '圧縮データ: '+fmt(best.bytes.length)+'\n'+
   '最終HTML: '+fmt(outBytes)+'\n'+
   '元サイズ比: '+
   reduction.toFixed(2)+'% 削減\n'+
   '出力: '+name
  );

 }catch(e){
  msg('エラー: '+e.message)
 }
}

/*
 利用できる圧縮形式を実際にすべて試し、
 最小サイズを採用する。
*/
async function findBestCompression(bytes){

 const formats=[
  'brotli',
  'deflate-raw',
  'gzip'
 ];

 const results=[];

 for(const format of formats){
  try{
   /*
    圧縮側だけでなく解凍側も利用可能か確認。
   */
   new DecompressionStream(format);

   const compressed=
    await compress(bytes,format);

   /*
    念のため実際に解凍し、
    byte単位で元データと一致するか検証。
   */
   const restored=
    await decompress(compressed,format);

   if(!sameBytes(bytes,restored)){
    continue
   }

   results.push({
    format,
    bytes:compressed
   });

  }catch(e){
   /*
    未対応形式は無視。
   */
  }
 }

 if(!results.length){
  throw Error(
   '利用可能な圧縮方式がありません。'
  )
 }

 results.sort(
  (a,b)=>a.bytes.length-b.bytes.length
 );

 return results[0]
}

async function compress(bytes,format){
 const stream=
  new Blob([bytes])
  .stream()
  .pipeThrough(
   new CompressionStream(format)
  );

 return new Uint8Array(
  await new Response(stream).arrayBuffer()
 )
}

async function decompress(bytes,format){
 const stream=
  new Blob([bytes])
  .stream()
  .pipeThrough(
   new DecompressionStream(format)
  );

 return new Uint8Array(
  await new Response(stream).arrayBuffer()
 )
}

function sameBytes(a,b){
 if(a.length!==b.length)return false;

 for(let i=0;i<a.length;i++){
  if(a[i]!==b[i])return false
 }

 return true
}

function tryMinify(html){
 const blocks=[];

 html=html.replace(
  /<(script|style|textarea|pre)\b[^>]*>[\s\S]*?<\/\1>/gi,
  m=>'@@BLOCK'+(blocks.push(m)-1)+'@@'
 );

 html=html.replace(
  /<!--(?!\[if)[\s\S]*?-->/g,
  ''
 );

 html=html.replace(
  /[ \t\r\n\f]{2,}/g,
  ' '
 );

 html=html.replace(
  /> </g,
  '><'
 );

 html=html.replace(
  /@@BLOCK(\d+)@@/g,
  (_,i)=>blocks[i]
 );

 return html.trim()
}

function bytesToBase64(bytes){
 let s='';
 const n=32768;

 for(let i=0;i<bytes.length;i+=n){
  s+=String.fromCharCode.apply(
   null,
   bytes.subarray(i,i+n)
  )
 }

 return btoa(s)
}

function download(name,text){
 const url=URL.createObjectURL(
  new Blob(
   [text],
   {type:'text/html'}
  )
 );

 const a=document.createElement('a');

 a.href=url;
 a.download=name;

 document.body.appendChild(a);
 a.click();
 a.remove();

 URL.revokeObjectURL(url)
}

function fmt(b){
 return b<1024
  ?b+' B'
  :b<1048576
   ?(b/1024).toFixed(1)+' KB'
   :(b/1048576).toFixed(1)+' MB'
}

function msg(x){
 r.textContent=x
}

function makePackedHtml(b64,format){

 /*
  ここは生成物側のローダーなので、
  元HTMLとは無関係。
  小さくしてオーバーヘッドを抑える。
 */

 return '<!doctype html><meta charset=utf-8>'+
 '<script>'+
 'let b="'+b64+'",f="'+format+'";'+
 '(async()=>{try{'+
 'let x=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),'+
 's=new Blob([x]).stream().pipeThrough(new DecompressionStream(f));'+
 'document.open();'+
 'document.write(new TextDecoder().decode(await new Response(s).arrayBuffer()));'+
 'document.close()'+
 '}catch(e){document.body.textContent="解凍エラー: "+e.message}})()'+
 '<\/script>'
}
</script>

</body>
</html>
