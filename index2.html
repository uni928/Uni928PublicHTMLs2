<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HTML圧縮</title>
<style>
@layer base,layout,components,responsive;

/* base: 基本スタイル */
@layer base{
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:system-ui,sans-serif;
 background:#f3f4f6;
 color:#111827;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px
}
h1{margin:0 0 10px;font-size:26px}
}

/* layout: ページ配置 */
@layer layout{
.a{
 width:min(760px,100%);
 background:#fff;
 border-radius:18px;
 box-shadow:0 20px 60px #0002;
 padding:28px
}
.m{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin:0 0 18px
}
}

/* components: UI部品 */
@layer components{
.l{margin:0 0 20px;color:#4b5563;line-height:1.7}
.m label{
 border:2px solid #e5e7eb;
 border-radius:14px;
 padding:14px;
 cursor:pointer;
 background:#f9fafb
}
.m input{display:inline-block}
.m b{display:block;margin:0 0 4px}
.m span{display:block;color:#6b7280;font-size:13px;line-height:1.5}

#d{
 border:3px dashed #9ca3af;
 border-radius:16px;
 background:#f9fafb;
 padding:42px 20px;
 text-align:center;
 cursor:pointer;
 transition:.2s
}
#d.o{border-color:#2563eb;background:#eff6ff}

.t{font-size:20px;font-weight:700;margin-bottom:8px}
.s{color:#6b7280;line-height:1.6}
#f{display:none}

#r{
 margin-top:18px;
 padding:14px 16px;
 border-radius:12px;
 background:#f3f4f6;
 color:#374151;
 line-height:1.6;
 white-space:pre-wrap
}

.n{
 margin-top:18px;
 padding:14px 16px;
 border-left:4px solid #f59e0b;
 background:#fffbeb;
 color:#78350f;
 border-radius:10px;
 line-height:1.7;
 font-size:14px
}
}

/* responsive: スマートフォン表示 */
@layer responsive{
@media(max-width:640px){
 .m{grid-template-columns:1fr}
}
}
</style>
</head>

<body>
<main class="a">

<h1>HTML圧縮</h1>

<p class="l">
単一HTMLをドラッグ＆ドロップすると、
元HTMLを変更せず、利用可能な圧縮方式の中から
最も小さいものを自動選択して自己解凍HTMLを生成します。
</p>

<div class="m">

<label>
<input type="radio" name="mode" value="safe" checked>
<b>安全版</b>
<span>
HTML / CSS / JavaScriptには一切手を加えず、
圧縮方式だけを最適化します。
</span>
</label>

<label>
<input type="radio" name="mode" value="try">
<b>挑戦版</b>
<span>
圧縮前にHTML / CSS / JavaScriptを安全化済みアルゴリズムで整理してから圧縮します。
</span>
</label>

<label>
<input type="radio" name="mode" value="clean">
<b>整理のみ版</b>
<span>
挑戦版と同じ事前整理だけを行い、自己解凍圧縮はせず通常HTMLとして保存します。
</span>
</label>

</div>

<div id="d">
<div class="t">ここに .html をドロップ</div>
<div class="s">またはクリックして選択</div>
<input id="f" type="file" accept=".html,.htm,text/html">
</div>

<div id="r">待機中です。</div>

<div class="n">
安全版では元HTMLを一切変更しません。
挑戦版はHTML / CSS / JavaScriptを安全化済みアルゴリズムで整理してから圧縮します。
整理のみ版は挑戦版と同じ事前整理だけを行い、通常HTMLとして保存します。
JavaScriptの // 行コメントは後続コードと同一行に連結しないよう保護します。
</div>

</main>

<script>
const d=document.getElementById('d');
const f=document.getElementById('f');
const r=document.getElementById('r');
const VOID_HTML_TAGS=new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);

d.onclick=()=>f.click();

f.onchange=()=>{
 if(f.files[0])run(f.files[0]);
 f.value=''
};

for(const e of ['dragenter','dragover']){
 d.addEventListener(e,x=>{
  x.preventDefault();
  d.classList.add('o')
 })
}

for(const e of ['dragleave','drop']){
 d.addEventListener(e,x=>{
  x.preventDefault();
  d.classList.remove('o')
 })
}

d.ondrop=e=>{
 const x=e.dataTransfer.files[0];
 if(x)run(x)
};

async function run(file){
 if(!/\.html?$/i.test(file.name)){
  msg('HTMLファイルを指定してください。');
  return
 }

 try{
  const mode=document.querySelector('input[name="mode"]:checked').value;
  const modeLabel=mode==='safe'?'安全版':mode==='try'?'挑戦版':'整理のみ版';

  if(mode!=='clean'&&(!window.CompressionStream||!window.DecompressionStream)){
   throw Error('このブラウザは圧縮・解凍APIに対応していません。')
  }

  msg(modeLabel+'で処理中です...');
  const src=await file.text();
  const body=mode==='safe'?src:compactHtml(src);
  const srcBytes=new TextEncoder().encode(src);
  const bodyBytes=new TextEncoder().encode(body);

  if(mode==='clean'){
   const name=file.name.replace(/\.html?$/i,'')+'.clean.html';
   download(name,body);
   const reduction=100-bodyBytes.length/srcBytes.length*100;
   msg('完了しました。\n'+
    'モード: 整理のみ版\n'+
    '元サイズ: '+fmt(srcBytes.length)+'\n'+
    '整理後HTML: '+fmt(bodyBytes.length)+'\n'+
    '元サイズ比: '+reduction.toFixed(2)+'% 削減\n'+
    '自己解凍圧縮: なし\n'+
    '出力: '+name);
   return
  }

  msg('利用可能な圧縮方式を比較しています...');
  const best=await findBestCompression(bodyBytes);
  const b64=bytesToBase64(best.bytes);
  const out=makePackedHtml(b64,best.format);
  let restoreCheck='未実施';

  if(mode==='safe'){
   msg('安全版の復元チェックを実行しています...');
   const restoredText=await verifyPackedHtml(b64,best.format);
   if(restoredText!==src){
    throw Error('復元チェックに失敗しました。元HTMLと復元結果が一致しません。')
   }
   restoreCheck='成功（元HTMLと完全一致）';
  }

  const outBytes=new TextEncoder().encode(out).length;
  const name=file.name.replace(/\.html?$/i,'')+'.'+mode+'.packed.html';
  download(name,out);
  const reduction=100-outBytes/srcBytes.length*100;

  msg('完了しました。\n'+
   'モード: '+modeLabel+'\n'+
   '採用方式: '+best.format+'\n'+
   '元サイズ: '+fmt(srcBytes.length)+'\n'+
   '圧縮前データ: '+fmt(bodyBytes.length)+'\n'+
   '圧縮データ: '+fmt(best.bytes.length)+'\n'+
   '最終HTML: '+fmt(outBytes)+'\n'+
   (mode==='safe'?'復元チェック: '+restoreCheck+'\n':'')+
   '元サイズ比: '+reduction.toFixed(2)+'% 削減\n'+
   '出力: '+name);

 }catch(e){
  msg('エラー: '+e.message)
 }
}

/*
 利用できる圧縮形式を実際にすべて試し、
 最小サイズを採用する。
*/
async function findBestCompression(bytes){

 const formats=[
  'brotli',
  'deflate-raw',
  'gzip'
 ];

 const results=[];

 for(const format of formats){
  try{
   /*
    圧縮側だけでなく解凍側も利用可能か確認。
   */
   new DecompressionStream(format);

   const compressed=
    await compress(bytes,format);

   /*
    念のため実際に解凍し、
    byte単位で元データと一致するか検証。
   */
   const restored=
    await decompress(compressed,format);

   if(!sameBytes(bytes,restored)){
    continue
   }

   results.push({
    format,
    bytes:compressed
   });

  }catch(e){
   /*
    未対応形式は無視。
   */
  }
 }

 if(!results.length){
  throw Error(
   '利用可能な圧縮方式がありません。'
  )
 }

 results.sort(
  (a,b)=>a.bytes.length-b.bytes.length
 );

 return results[0]
}

async function compress(bytes,format){
 const stream=
  new Blob([bytes])
  .stream()
  .pipeThrough(
   new CompressionStream(format)
  );

 return new Uint8Array(
  await new Response(stream).arrayBuffer()
 )
}

async function decompress(bytes,format){
 const stream=
  new Blob([bytes])
  .stream()
  .pipeThrough(
   new DecompressionStream(format)
  );

 return new Uint8Array(
  await new Response(stream).arrayBuffer()
 )
}

function sameBytes(a,b){
 if(a.length!==b.length)return false;

 for(let i=0;i<a.length;i++){
  if(a[i]!==b[i])return false
 }

 return true
}

  function normalizeText(value) {
    return String(value || "").replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  }

  function trimLines(value, removeEmptyLines) {
    const lines = normalizeText(value).split("\n").map((line) => line.trim());
    return (removeEmptyLines ? lines.filter(Boolean) : lines).join("\n");
  }

  function compactCss(value, removeComments, compactWhitespace) {
    let compacted = trimLines(value, compactWhitespace);
    if (removeComments) compacted = compacted.replace(/\/\*[\s\S]*?\*\//g, "");
    if (compactWhitespace) {
      compacted = compacted.replace(/[ \t]+/g, " ").replace(/\s*([{}:;,])\s*/g, "$1").trim();
    }
    return compacted;
  }

  function compactCssOneRule(value) {
    const css = compactCss(value, true, true);
    if (!true || !css) return css;
    const containerAtRules = /^(?:@media|@supports|@layer|@container|@document|@scope|@keyframes|-webkit-keyframes|-moz-keyframes)\b/i;

    const findMatchingBrace = (source, openIndex) => {
      let depth = 0, quote = "", escaped = false;
      for (let index = openIndex; index < source.length; index += 1) {
        const character = source[index];
        if (quote) {
          if (escaped) escaped = false;
          else if (character === "\\") escaped = true;
          else if (character === quote) quote = "";
          continue;
        }
        if (character === "'" || character === '"') { quote = character; escaped = false; continue; }
        if (character === "{") depth += 1;
        else if (character === "}") { depth -= 1; if (depth === 0) return index; }
      }
      return -1;
    };

    const formatBlock = (source) => {
      const lines = [];
      let index = 0;
      while (index < source.length) {
        while (index < source.length && /\s/.test(source[index])) index += 1;
        if (index >= source.length) break;
        let quote = "", escaped = false, delimiterIndex = -1, delimiter = "";
        for (let cursor = index; cursor < source.length; cursor += 1) {
          const character = source[cursor];
          if (quote) {
            if (escaped) escaped = false;
            else if (character === "\\") escaped = true;
            else if (character === quote) quote = "";
            continue;
          }
          if (character === "'" || character === '"') { quote = character; escaped = false; continue; }
          if (character === "{" || character === ";") { delimiterIndex = cursor; delimiter = character; break; }
        }
        if (delimiterIndex < 0) { const tail = source.slice(index).trim(); if (tail) lines.push(tail); break; }
        if (delimiter === ";") { const statement = source.slice(index, delimiterIndex + 1).trim(); if (statement) lines.push(statement); index = delimiterIndex + 1; continue; }
        const header = source.slice(index, delimiterIndex).trim();
        const closeIndex = findMatchingBrace(source, delimiterIndex);
        if (closeIndex < 0) { const tail = source.slice(index).trim(); if (tail) lines.push(tail); break; }
        const body = source.slice(delimiterIndex + 1, closeIndex).trim();
        if (containerAtRules.test(header)) {
          lines.push(header + "{");
          const nested = formatBlock(body);
          if (nested) lines.push(nested);
          lines.push("}");
        } else {
          lines.push(header + "{" + body + "}");
        }
        index = closeIndex + 1;
      }
      return lines.join("\n");
    };
    return formatBlock(css);
  }

  function nestBraceCode(value, splitSemicolons = false) {
    const normalized = normalizeText(value).trim();
    if (!normalized) return "";
    const lines = [];
    let buffer = "", depth = 0, quote = "", escaped = false, lineComment = false, blockComment = false;
    const pushLine = (text, lineDepth = depth) => { const trimmed = text.trim(); if (trimmed) lines.push("  ".repeat(Math.max(0, lineDepth)) + trimmed); };
    const flush = () => { pushLine(buffer, depth); buffer = ""; };

    for (let index = 0; index < normalized.length; index += 1) {
      const character = normalized[index];
      const next = normalized[index + 1] || "";
      if (lineComment) {
        buffer += character;
        if (character === "\n") { lineComment = false; flush(); }
        continue;
      }
      if (blockComment) {
        buffer += character;
        if (character === "*" && next === "/") { buffer += "/"; index += 1; blockComment = false; }
        continue;
      }
      if (quote) {
        buffer += character;
        if (escaped) escaped = false;
        else if (character === "\\") escaped = true;
        else if (character === quote) quote = "";
        if (character === "\n" && quote !== "`") flush();
        continue;
      }
      if (character === "/" && next === "/") { buffer += "//"; index += 1; lineComment = true; continue; }
      if (character === "/" && next === "*") { buffer += "/*"; index += 1; blockComment = true; continue; }
      if (["'", '"', "`"].includes(character)) { quote = character; escaped = false; buffer += character; continue; }
      if (/^}[,;,)\]]*$/.test(buffer.trim()) && !/[\s;,)\]]/.test(character)) flush();
      if (character === "{") { pushLine(buffer + "{", depth); buffer = ""; depth += 1; continue; }
      if (character === "}") { flush(); depth = Math.max(0, depth - 1); buffer = "}"; continue; }
      if (splitSemicolons && character === ";") { pushLine(buffer + ";", depth); buffer = ""; continue; }
      if (character === "\n") { flush(); continue; }
      buffer += character;
    }
    flush();
    return lines.join("\n");
  }

  function compactFunctionCode(value) {
    const nested = nestBraceCode(value);
    const sourceLines = nested.split("\n").map((line) => line.trim()).filter(Boolean);
    if (!sourceLines.length) return "";
    const output = [];
    let current = "", inNamedFunction = false, functionDepth = 0, quote = "", escaped = false, blockComment = false;
    const append = (line) => { current += (current ? " " : "") + line; };
    const flush = () => { const trimmed = current.trim(); if (trimmed) output.push(trimmed); current = ""; };
    const startsNamedFunction = (line) => /^(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(/.test(line);
    const hasLineComment = (line) => {
      let localQuote = "", localEscaped = false, localBlock = false;
      for (let index = 0; index < line.length; index += 1) {
        const ch = line[index], next = line[index + 1] || "";
        if (localBlock) { if (ch === "*" && next === "/") { localBlock = false; index += 1; } continue; }
        if (localQuote) { if (localEscaped) localEscaped = false; else if (ch === "\\") localEscaped = true; else if (ch === localQuote) localQuote = ""; continue; }
        if (ch === "/" && next === "*") { localBlock = true; index += 1; continue; }
        if (ch === "/" && next === "/") return true;
        if (["'", '"', "`"].includes(ch)) localQuote = ch;
      }
      return false;
    };
    const braceDelta = (line) => {
      let delta = 0, lineComment = false;
      for (let index = 0; index < line.length; index += 1) {
        const character = line[index], next = line[index + 1] || "";
        if (lineComment) break;
        if (blockComment) { if (character === "*" && next === "/") { blockComment = false; index += 1; } continue; }
        if (quote) { if (escaped) escaped = false; else if (character === "\\") escaped = true; else if (character === quote) quote = ""; continue; }
        if (character === "/" && next === "/") { lineComment = true; break; }
        if (character === "/" && next === "*") { blockComment = true; index += 1; continue; }
        if (["'", '"', "`"].includes(character)) { quote = character; escaped = false; continue; }
        if (character === "{") delta += 1; else if (character === "}") delta -= 1;
      }
      return delta;
    };

    for (const line of sourceLines) {
      const namedFunctionStart = startsNamedFunction(line);
      if (namedFunctionStart && !inNamedFunction) { flush(); inNamedFunction = true; functionDepth = 0; }
      append(line);
      const delta = braceDelta(line);
      if (inNamedFunction) {
        functionDepth += delta;
        if (hasLineComment(line)) flush();
        if (functionDepth <= 0 && /}/.test(line)) { flush(); inNamedFunction = false; functionDepth = 0; }
      } else if (hasLineComment(line)) {
        flush();
      }
    }
    flush();
    return output.join("\n");
  }

  function nestMarkup(value) {
    let normalized = normalizeText(value).trim();
    if (!normalized) return "";
    const specialBlocks = [];
    normalized = normalized.replace(/<(script|style)\b([^>]*)>([\s\S]*?)<\/\1\s*>/gi, (all, tagName, attrs, body) => {
      const name = tagName.toLowerCase();
      const formattedBody = name === "script" ? compactFunctionCode(body) : compactCssOneRule(body);
      const marker = "\u0005" + specialBlocks.length + "\u0006";
      specialBlocks.push("<" + tagName + attrs + ">\n" + formattedBody + "\n</" + tagName + ">");
      return marker;
    });
    const tokens = [];
    let text = "";
    const pushText = () => { if (text) tokens.push({ type: "text", value: text }); text = ""; };
    for (let index = 0; index < normalized.length;) {
      if (normalized[index] !== "<") { text += normalized[index]; index += 1; continue; }
      const next = normalized[index + 1] || "";
      if (!/[A-Za-z/!?]/.test(next)) { text += "<"; index += 1; continue; }
      if (normalized.startsWith("<!--", index)) {
        const commentEnd = normalized.indexOf("-->", index + 4);
        if (commentEnd < 0) { text += normalized.slice(index); break; }
        pushText(); tokens.push({ type: "tag", value: normalized.slice(index, commentEnd + 3) }); index = commentEnd + 3; continue;
      }
      let quote = "", end = index + 1;
      for (; end < normalized.length; end += 1) {
        const character = normalized[end];
        if (quote) { if (character === quote && normalized[end - 1] !== "\\") quote = ""; }
        else if (["'", '"'].includes(character)) quote = character;
        else if (character === ">") break;
      }
      if (end >= normalized.length) { text += normalized.slice(index); break; }
      pushText(); tokens.push({ type: "tag", value: normalized.slice(index, end + 1) }); index = end + 1;
    }
    pushText();
    const lines = [];
    let depth = 0;
    const push = (value, lineDepth = depth) => { const trimmed = value.trim(); if (trimmed) lines.push("  ".repeat(Math.max(0, lineDepth)) + trimmed); };
    for (const token of tokens) {
      if (token.type === "text") { push(token.value.replace(/\s+/g, " "), depth); continue; }
      const tag = token.value.trim();
      const closing = /^<\//.test(tag), commentOrDeclaration = /^<!--|^<!|^<\?/.test(tag), selfClosing = /\/\s*>$/.test(tag);
      const nameMatch = /^<\/?([A-Za-z][\w:-]*)/.exec(tag);
      const tagName = nameMatch ? nameMatch[1].toLowerCase() : "";
      if (closing) depth = Math.max(0, depth - 1);
      push(tag, depth);
      if (!closing && !commentOrDeclaration && !selfClosing && !VOID_HTML_TAGS.has(tagName)) depth += 1;
    }
    return lines.join("\n").replace(/\u0005(\d+)\u0006/g, (_, index) => specialBlocks[Number(index)] || "");
  }

  function protectBlocks(value) {
    const protectedBlocks = [];
    const protectedText = value.replace(/<(pre|textarea|script|style)\b[^>]*>[\s\S]*?<\/\1>/gi, (block) => {
      const marker = "\u0001" + protectedBlocks.length + "\u0002";
      protectedBlocks.push(block);
      return marker;
    });
    return { protectedBlocks, protectedText };
  }

  function restoreBlocks(value, protectedBlocks) {
    return value.replace(/\u0001(\d+)\u0002/g, (_, index) => protectedBlocks[Number(index)] || "");
  }

  function compactMarkup(value, removeComments) {
    const blocks = protectBlocks(normalizeText(value));
    let compacted = blocks.protectedText.split("\n").map((line) => line.trim()).filter(Boolean).join("");
    if (removeComments) compacted = compacted.replace(/<!--[\s\S]*?-->/g, "");
    return restoreBlocks(compacted.replace(/>\s+</g, "><").replace(/[ \t]{2,}/g, " ").trim(), blocks.protectedBlocks);
  }

  function compactHtml(value) {
    const compacted = compactMarkup(value, true);
    return true ? nestMarkup(compacted) : compacted;
  }



async function verifyPackedHtml(b64,format){
 return new Promise((resolve,reject)=>{
  const token=
   'verify-'+Date.now()+'-'+Math.random().toString(36).slice(2);

  const frame=document.createElement('iframe');

  frame.setAttribute('sandbox','allow-scripts');
  frame.hidden=true;

  const timeout=setTimeout(()=>{
   cleanup();
   reject(Error('復元チェックがタイムアウトしました。'))
  },10000);

  function cleanup(){
   clearTimeout(timeout);
   window.removeEventListener('message',onMessage);
   frame.remove()
  }

  function onMessage(e){
   const data=e.data;

   if(!data||data.token!==token)return;

   cleanup();

   if(data.ok){
    resolve(data.html)
   }else{
    reject(Error('復元チェックエラー: '+data.error))
   }
  }

  window.addEventListener('message',onMessage);

  frame.srcdoc=makeVerifyHtml(b64,format,token);
  document.body.appendChild(frame)
 })
}

function makeVerifyHtml(b64,format,token){
 const q=s=>JSON.stringify(s);

 return '<!doctype html><meta charset=utf-8>'+ 
 '<script>'+ 
 '(async()=>{try{'+ 
 'let b='+q(b64)+',f='+q(format)+','+ 
 'x=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),'+ 
 's=new Blob([x]).stream().pipeThrough(new DecompressionStream(f)),'+ 
 'h=new TextDecoder().decode(await new Response(s).arrayBuffer());'+ 
 'parent.postMessage({token:'+q(token)+',ok:true,html:h},"*")'+ 
 '}catch(e){parent.postMessage({token:'+q(token)+',ok:false,error:e.message},"*")}})()'+ 
 '<\/script>'
}

function bytesToBase64(bytes){
 let s='';
 const n=32768;

 for(let i=0;i<bytes.length;i+=n){
  s+=String.fromCharCode.apply(
   null,
   bytes.subarray(i,i+n)
  )
 }

 return btoa(s)
}

function download(name,text){
 const url=URL.createObjectURL(
  new Blob(
   [text],
   {type:'text/html'}
  )
 );

 const a=document.createElement('a');

 a.href=url;
 a.download=name;

 document.body.appendChild(a);
 a.click();
 a.remove();

 URL.revokeObjectURL(url)
}

function fmt(b){
 return b<1024
  ?b+' B'
  :b<1048576
   ?(b/1024).toFixed(1)+' KB'
   :(b/1048576).toFixed(1)+' MB'
}

function msg(x){
 r.textContent=x
}

function makePackedHtml(b64,format){

 /*
  ここは生成物側のローダーなので、
  元HTMLとは無関係。
  小さくしてオーバーヘッドを抑える。
 */

 return '<!doctype html><meta charset=utf-8>'+
 '<script>'+
 'let b="'+b64+'",f="'+format+'";'+
 '(async()=>{try{'+
 'let x=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),'+
 's=new Blob([x]).stream().pipeThrough(new DecompressionStream(f));'+
 'document.open();'+
 'document.write(new TextDecoder().decode(await new Response(s).arrayBuffer()));'+
 'document.close()'+
 '}catch(e){document.body.textContent="解凍エラー: "+e.message}})()'+
 '<\/script>'
}
</script>

</body>
