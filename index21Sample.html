<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF・Word 資料プレビュー</title>
<style>
@layer base, layout, upload, controls, preview, states, print;

/* base: 全体の基礎表示 */
@layer base {
  * { box-sizing: border-box; }
  :root {
    color-scheme: light;
    --bg-a: #f7f7fb;
    --bg-b: #eef1f7;
    --paper: #fff;
    --text: #182033;
    --muted: #667085;
    --subtle: #98a2b3;
    --accent: #7567dc;
    --shadow: 0 18px 50px rgba(40,49,78,.10);
  }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    background:
      radial-gradient(circle at 8% 4%, rgba(117,103,220,.07), transparent 30%),
      radial-gradient(circle at 94% 8%, rgba(217,137,180,.08), transparent 28%),
      linear-gradient(180deg, var(--bg-a), var(--bg-b));
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
}

/* layout: 操作欄とプレビュー */
@layer layout {
  .app { width: min(1200px,100%); margin: 0 auto; padding: 18px 24px 44px; }
  .hero { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 14px; padding: 2px 0 4px; }
  .hero-copy { min-width: 0; max-width: 720px; }
  .eyebrow { margin: 0 0 4px; color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .10em; text-transform: uppercase; }
  .hero h1 { margin: 0; font-size: clamp(24px,2.8vw,32px); line-height: 1.16; letter-spacing: -.018em; }
  .hero p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  /* PC: 操作要素を上段2列、資料を下段いっぱいに表示 */
  .workspace { display: block; width: 100%; }
  .sidebar {
    position: static;
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    gap: 16px;
    width: 210mm;
    max-width: 100%;
    margin: 0 auto 26px;
  }
  .sidebar > section { min-width: 0; height: 100%; }
  .preview-shell {
    width: 100%;
    min-width: 0;
    overflow-x: visible;
    padding: 2px 0 34px;
  }
  .pages {
    display: grid;
    justify-items: center;
    width: 100%;
    min-width: 0;
    gap: 24px;
  }
  @media (min-width: 1200px) {
    .app { padding-inline: 28px; }
    .hero { padding-inline: 2px; }
  }
  @media (max-width: 899px) {
    .app { padding: 16px 14px 38px; }
    .hero { align-items: flex-start; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .hero h1 { font-size: clamp(23px,6vw,30px); }
    .hero p { font-size: 12px; }
    .sidebar { grid-template-columns: 1fr; margin-bottom: 20px; }
    .preview-shell { margin-inline: -14px; width: calc(100% + 28px); padding-inline: 8px; overflow-x: auto; }
    .pages { justify-items: start; width: max-content; min-width: 100%; }
  }
}

/* upload: PDF・Word専用のドラッグ＆ドロップ */
@layer upload {
  .uni-photo-dropbox { padding: 20px; background: rgba(255,255,255,.97); border: 1px solid rgba(255,255,255,.9); border-radius: 24px; box-shadow: 0 8px 24px rgba(41,50,75,.07); }
  .uni-photo-dropbox__zone { position: relative; display: grid; place-items: center; width: 100%; height: 220px; overflow: hidden; border: 1.5px dashed rgba(117,103,220,.28); border-radius: 22px; background: linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,247,253,.98)); cursor: pointer; transition: border-color .18s ease,transform .18s ease,box-shadow .18s ease; }
  .uni-photo-dropbox__zone:hover, .uni-photo-dropbox__zone.is-dragging { border-color: rgba(117,103,220,.58); box-shadow: 0 12px 28px rgba(117,103,220,.10); transform: translateY(-1px); }
  .uni-photo-dropbox__inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; text-align: center; pointer-events: none; }
  .uni-photo-dropbox__icon { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 19px; background: linear-gradient(135deg,rgba(117,103,220,.12),rgba(217,137,180,.16)); }
  .uni-photo-dropbox__icon svg { width: 27px; height: 27px; stroke: #6e65ad; }
  .uni-photo-dropbox__copy { display: grid; gap: 5px; text-align: center; }
  .uni-photo-dropbox__title { color: #182033; font-size: 16px; font-weight: 800; line-height: 1.35; }
  .uni-photo-dropbox__guide { color: #667085; font-size: 13px; font-weight: 600; line-height: 1.55; }
  .uni-photo-dropbox__meta { color: #98a2b3; font-size: 11px; font-weight: 500; line-height: 1.4; }
  .uni-photo-dropbox__input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .uni-photo-dropbox__selected { display: none; align-items: center; gap: 12px; padding: 14px; border: 1px solid rgba(110,145,210,.14); border-radius: 18px; background: linear-gradient(180deg,#fff,#fbfbfe); }
  .uni-photo-dropbox__selected.is-visible { display: flex; }
  .uni-photo-dropbox__selected-icon { display: grid; place-items: center; flex: 0 0 auto; width: 46px; height: 46px; border-radius: 15px; background: linear-gradient(135deg,rgba(117,103,220,.12),rgba(217,137,180,.14)); color: #655cb6; font-weight: 900; }
  .uni-photo-dropbox__selected-copy { min-width: 0; flex: 1; }
  .uni-photo-dropbox__selected-name { display: block; overflow: hidden; color: #182033; font-size: 13px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
  .uni-photo-dropbox__selected-meta { display: block; margin-top: 3px; color: #98a2b3; font-size: 11px; }
  .uni-photo-dropbox__change { flex: 0 0 auto; padding: 8px 11px; border: 1px solid rgba(117,103,220,.16); border-radius: 999px; background: rgba(117,103,220,.07); color: #655cb6; font-size: 11px; font-weight: 800; }
  @media (max-width: 540px) { .uni-photo-dropbox { padding: 16px; } .uni-photo-dropbox__zone { height: 190px; } }
}

/* controls: 操作ボタン */
@layer controls {
  .card { padding: 18px; border: 1px solid rgba(98,112,145,.12); border-radius: 22px; background: rgba(255,255,255,.92); box-shadow: 0 8px 24px rgba(41,50,75,.055); }
  .card h2 { margin: 0; font-size: 15px; }
  .card p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { min-height: 40px; padding: 9px 14px; border: 1px solid rgba(98,112,145,.16); border-radius: 12px; background: #fff; color: #344054; font-weight: 800; box-shadow: 0 3px 10px rgba(41,50,75,.04); }
  .btn:hover { transform: translateY(-1px); }
  .btn.primary { border-color: transparent; background: linear-gradient(135deg,#7567dc,#6156c8); color: #fff; box-shadow: 0 8px 18px rgba(117,103,220,.18); }
  .hint { margin-top: 9px; color: var(--subtle); font-size: 11px; line-height: 1.55; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
}

/* preview: A4縦（210mm × 297mm）をそのまま画面上の基準にする */
@layer preview {
  .paper-page {
    width: 210mm;
    height: 297mm;
    margin: 0 auto;
    padding: 5mm;
    overflow: hidden;
    background: var(--paper);
    border: 1px solid rgba(98,112,145,.10);
    box-shadow: var(--shadow);
  }
  .document-frame {
    width: 100%;
    height: 287mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(117,103,220,.16);
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 10px 24px rgba(41,50,75,.055);
  }
  .document-body {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 3mm;
    overflow: hidden;
    background: #fafbfc;
  }
  .page-footer { display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 16px; min-height: 10mm; padding: 1.5mm 6mm 2.5mm; color: #98a2b3; font-size: 10px; line-height: 1.5; }
  .created-at, .page-info { margin: 0; }
  .created-at { text-align: left; }
  .page-info { margin-left: auto; text-align: right; white-space: nowrap; }
  .pdf-canvas { display: block; width: 100%; height: auto; max-height: 258mm; object-fit: contain; border-radius: 10px; background: #fff; box-shadow: 0 4px 14px rgba(30,40,60,.06); }
  .word-page-host { width: 100%; min-width: 0; display: grid; place-items: start center; overflow: hidden; }
  .word-page-slice { position: relative; width: 100%; height: 264mm; overflow: hidden; }
  .word-page-scale-box { position: absolute; top: 0; left: 50%; flex: 0 0 auto; max-width: none; max-height: none; overflow: visible; transform: translateX(-50%); }
  .word-page-scale-box > section.docx { position: absolute !important; left: 0 !important; margin: 0 !important; box-shadow: none !important; transform-origin: top left !important; }
  .word-page-host .docx-wrapper { padding: 0 !important; background: transparent !important; }
  .empty-preview, .loading { display: grid; place-items: center; min-height: 230mm; padding: 34px; color: #98a2b3; text-align: center; }
  .empty-preview strong { display: block; margin-bottom: 7px; color: #667085; font-size: 14px; }
  .empty-preview span, .loading { font-size: 12px; line-height: 1.7; }
  .loading { font-weight: 700; }
  @media (max-width: 899px) {
    .paper-page { width: min(210mm,calc(100vw - 18px)); min-height: 0; padding: 14px; }
    .document-frame { min-height: 0; }
    .document-body { padding: 12px; }
    .page-footer { padding: 0 18px 18px; }
    .empty-preview, .loading { min-height: 360px; }
  }
}

/* states: 表示状態 */
@layer states { .is-hidden { display: none; } }

/* print: CSS上でもA4実寸を固定し、1パネルをA4 1ページにする */
@layer print {
  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { width: 210mm; margin: 0; padding: 0; background: #fff; }
    .hero, .sidebar { display: none; }
    .app { width: 210mm; max-width: none; margin: 0; padding: 0; }
    .workspace { display: block; width: 210mm; }
    .preview-shell { width: 210mm; margin: 0; padding: 0; overflow: visible; }
    .pages { display: block; width: 210mm; }
    .paper-page {
      display: block;
      width: 210mm;
      height: 297mm;
      margin: 0;
      padding: 5mm;
      overflow: hidden;
      border: 0;
      box-shadow: none;
      break-after: page;
      page-break-after: always;
    }
    .paper-page:last-child { break-after: auto; page-break-after: auto; }
    .document-frame { width: 200mm; height: 287mm; margin: 0; box-shadow: none; break-inside: avoid; page-break-inside: avoid; }
    .document-body { width: 100%; min-width: 0; padding: 3mm; }
  }
}
</style>
<!-- Word(.docx) 展開用。docx-previewより先にJSZipを読み込む -->
