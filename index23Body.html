    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME);
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function saveContent(database, content) {
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(STORE_NAME, 'readwrite');
        transaction.objectStore(STORE_NAME).put(content, CONTENT_KEY);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
    }

    function decodeBase64Utf8(base64) {
      const binary = atob(base64);
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    async function start() {
      const status = document.querySelector('#status');

      try {
        const database = await openDatabase();
        const content = {
          html: decodeBase64Utf8(SAMPLE_HTML_BASE64),
          version: 'v1',
          savedAt: new Date().toISOString()
        };

        await saveContent(database, content);
        database.close();
        status.textContent = '保存しました。index23.htmlへ移動します……';
        location.replace('./index23.html');
      } catch (error) {
        console.error(error);
        status.textContent = 'IndexedDBへの保存に失敗しました。HTTPサーバー経由で開いてください。';
      }
    }

    start();
  </script>
