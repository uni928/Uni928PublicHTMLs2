<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>サイト更新チェック</title>
<style>
@layer reset, tokens, base, components, responsive;

@layer reset {
  /* Reset layer: keep the page sizing predictable across browsers. */
  *, *::before, *::after { box-sizing: border-box; }
  html { min-width: 320px; }
  body, h1, h2, p { margin: 0; }
  button, input { font: inherit; }
  button { cursor: pointer; }
}

@layer tokens {
  /* Tokens layer: define the compact color and spacing system. */
  :root {
    color-scheme: light;
    --ink: #182230;
    --muted: #687587;
    --line: #dfe5ee;
    --surface: #ffffff;
    --canvas: #f4f6fa;
    --accent: #315fbd;
    --accent-dark: #234b9d;
    --green: #15945c;
    --danger: #b42318;
    --shadow: 0 12px 34px rgba(25, 40, 65, .08);
    --radius: 14px;
  }
}

@layer base {
  /* Base layer: establish the page background, type, and focus behavior. */
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top left, #eaf0ff 0, transparent 38rem), var(--canvas);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid rgba(49, 95, 189, .28);
    outline-offset: 2px;
  }
}

@layer components {
  /* Components layer: style the compact tracker, collapsed rows, and edit panels. */
  .shell { width: min(100% - 28px, 850px); margin: 0 auto; padding: 28px 0 48px; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .eyebrow { color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin-top: 4px; font-size: clamp(1.35rem, 4vw, 1.85rem); line-height: 1.15; letter-spacing: -.035em; }
  .subtitle { margin-top: 7px; color: var(--muted); font-size: .88rem; }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .button {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 40px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface); color: var(--ink); font-size: .87rem; font-weight: 700;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .button:hover { transform: translateY(-1px); border-color: #b7c5dc; }
  .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  .button.primary:hover { background: var(--accent-dark); }
  .button.small { min-height: 34px; padding: 6px 10px; font-size: .82rem; }
  .button.danger { color: var(--danger); }
  .statusline { display: flex; align-items: center; gap: 8px; min-height: 23px; margin: 0 2px 9px; color: var(--muted); font-size: .8rem; }
  .status-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: #a8b2c1; }
  .status-dot.active { background: var(--green); box-shadow: 0 0 0 3px rgba(21, 148, 92, .12); }
  .list { display: grid; gap: 9px; }
  .site-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 3px 12px rgba(25, 40, 65, .035); }
  .site-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; min-height: 66px; padding: 10px 12px 10px 16px; }
  .site-meta { min-width: 0; }
  .site-name { overflow: hidden; color: var(--ink); font-size: .96rem; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
  .site-date { margin-top: 3px; color: var(--muted); font-size: .76rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .open-link { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 9px; border-radius: 10px; color: var(--accent); font-size: .83rem; font-weight: 750; text-decoration: none; white-space: nowrap; }
  .open-link:hover { background: #f0f4fc; }
  .new-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(21, 148, 92, .12); }
  .new-dot[hidden] { display: none; }
  .expand-button {
    display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 11px;
    background: #fff; color: #536174; font-size: 1.35rem; line-height: 1; transition: background .15s ease, transform .15s ease;
  }
  .expand-button:hover { background: #f1f4f8; }
  .expand-button[aria-expanded="true"] { transform: rotate(45deg); color: var(--accent); }
  .edit-panel { padding: 0 16px 15px; border-top: 1px solid #edf0f5; }
  .field-grid { display: grid; grid-template-columns: minmax(150px, .65fr) minmax(0, 1.6fr); gap: 10px; padding-top: 13px; }
  .field label { display: block; margin-bottom: 5px; color: #596679; font-size: .76rem; font-weight: 750; }
  .field input { width: 100%; height: 40px; padding: 0 11px; border: 1px solid #d7deea; border-radius: 9px; background: #fff; color: var(--ink); }
  .panel-note { margin-top: 9px; color: var(--muted); font-size: .75rem; }
  .panel-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .panel-status { min-width: 0; flex: 1; color: var(--muted); font-size: .77rem; }
  .empty { padding: 28px 18px; border: 1px dashed #c8d2e0; border-radius: var(--radius); background: rgba(255,255,255,.66); text-align: center; }
  .empty strong { display: block; font-size: .97rem; }
  .empty p { margin: 6px 0 14px; color: var(--muted); font-size: .84rem; }
  .footnote { margin: 14px 3px 0; color: #758194; font-size: .75rem; }
  .hidden { display: none; }
}

@layer responsive {
  /* Responsive layer: preserve the one-line collapsed rows on narrow screens. */
  @media (max-width: 620px) {
    .shell { width: min(100% - 20px, 850px); padding-top: 19px; }
    .topbar { align-items: flex-start; flex-direction: column; gap: 12px; }
    .toolbar { width: 100%; justify-content: flex-start; }
    .site-row { grid-template-columns: minmax(0, 1fr) auto 36px; gap: 4px; min-height: 62px; padding: 8px 9px 8px 12px; }
    .site-name { font-size: .89rem; }
    .site-date { font-size: .69rem; }
    .open-link { gap: 5px; min-height: 35px; padding: 0 6px; font-size: .76rem; }
    .expand-button { width: 34px; height: 34px; }
    .field-grid { grid-template-columns: 1fr; gap: 9px; }
    .panel-actions .button { flex: 1 1 auto; }
    .panel-status { order: 5; flex-basis: 100%; }
  }
}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Lightweight site monitor</p>
      <h1>サイト更新チェック</h1>
      <p class="subtitle">登録したページの内容を前回分と比べ、変化を見つけます。</p>
    </div>
    <div class="toolbar">
      <button class="button" id="addButton" type="button">＋ URLを追加</button>
      <button class="button primary" id="checkButton" type="button">確認可能なサイトをチェック</button>
    </div>
  </header>
  <div class="statusline" aria-live="polite"><span class="status-dot" id="globalDot"></span><span id="globalStatus">保存データを読み込んでいます…</span></div>
  <section class="list" id="siteList" aria-label="登録したサイト"></section>
  <p class="footnote">更新日時はページの実際の公開日時ではなく、このツールが内容の変化を検知した時刻です。APIキーなしの利用は1分あたり20件まで。同じサイトは30分間隔で確認します。</p>
</main>
<script>
(() => {
  'use strict';
  const DB_NAME = 'uni928-update-checker-v1';
  const DB_VERSION = 1;
  const RECORDS = 'sites';
  const STATE = 'state';
  const RATE_KEY = 'reader-request-times';
  const MAX_REQUESTS_PER_MINUTE = 20;
  const SITE_COOLDOWN_MS = 30 * 60 * 1000;
  const RATE_WINDOW_MS = 60 * 1000;
  const REQUEST_GAP_MS = 3100;
  const $ = (selector, root = document) => root.querySelector(selector);
  const list = $('#siteList');
  const status = $('#globalStatus');
  const globalDot = $('#globalDot');
  let db;
  let sites = [];
  let rateTimes = [];
  let running = false;

  function openDatabase() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('このブラウザではIndexedDBを利用できません。'));
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains(RECORDS)) database.createObjectStore(RECORDS, { keyPath: 'id' });
        if (!database.objectStoreNames.contains(STATE)) database.createObjectStore(STATE, { keyPath: 'key' });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('IndexedDBを開けませんでした。'));
      request.onblocked = () => reject(new Error('別のタブがデータベースを更新中です。少し待って再読み込みしてください。'));
    });
  }

  function requestResult(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('データベースの読み書きに失敗しました。'));
    });
  }

  function store(name, mode = 'readonly') { return db.transaction(name, mode).objectStore(name); }
  async function allSites() { return requestResult(store(RECORDS).getAll()); }
  async function saveSite(site) { await requestResult(store(RECORDS, 'readwrite').put(site)); }
  async function deleteSite(id) { await requestResult(store(RECORDS, 'readwrite').delete(id)); }
  async function loadRateTimes() {
    const row = await requestResult(store(STATE).get(RATE_KEY));
    return Array.isArray(row?.times) ? row.times : [];
  }
  async function saveRateTimes(times) { await requestResult(store(STATE, 'readwrite').put({ key: RATE_KEY, times })); }

  function makeId() { return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`; }
  function fmtDate(value) {
    if (!value) return '未確認';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '未確認';
    const two = n => String(n).padStart(2, '0');
    return `${two(d.getFullYear() % 100)}:${two(d.getMonth() + 1)}:${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`;
  }
  function siteOrigin(value) {
    try { return new URL(value).origin; } catch { return ''; }
  }
  function safeHttpUrl(value) {
    try {
      const url = new URL(value.trim());
      if (url.protocol !== 'https:' && url.protocol !== 'http:') return null;
      return url.href;
    } catch { return null; }
  }
  function cleanedRateTimes(now = Date.now()) { return rateTimes.filter(time => now - time < RATE_WINDOW_MS); }
  function allowedInMinute(now = Date.now()) { return cleanedRateTimes(now).length < MAX_REQUESTS_PER_MINUTE; }
  function cooldownRemaining(site, now = Date.now()) {
    const origin = siteOrigin(site.url);
    const last = Math.max(0, ...sites.filter(item => (item.lastCheckedOrigin || siteOrigin(item.url)) === origin).map(item => item.lastCheckedAt || 0));
    return Math.max(0, SITE_COOLDOWN_MS - (now - last));
  }
  function durationText(ms) {
    const mins = Math.ceil(ms / 60000);
    return mins <= 1 ? '1分未満' : `${mins}分`;
  }
  function setStatus(message, active = false) {
    status.textContent = message;
    globalDot.classList.toggle('active', active);
  }
  function make(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function render() {
    list.replaceChildren();
    if (!sites.length) {
      const empty = make('div', 'empty');
      empty.append(make('strong', '', '更新を確認するサイトを登録してください'));
      empty.append(make('p', '', 'URLを登録すると、確認時に前回の内容と比べます。'));
      const add = make('button', 'button primary', '＋ URLを追加');
      add.type = 'button';
      add.addEventListener('click', addSite);
      empty.append(add);
      list.append(empty);
      return;
    }
    for (const site of sites) list.append(renderSite(site));
  }

  function renderSite(site) {
    const card = make('article', 'site-card');
    const row = make('div', 'site-row');
    const meta = make('div', 'site-meta');
    let displayName = site.name;
    if (!displayName && site.url) { try { displayName = new URL(site.url).hostname; } catch {} }
    meta.append(make('div', 'site-name', displayName || '新しいサイト'));
    meta.append(make('div', 'site-date', fmtDate(site.updatedAt || site.lastCheckedAt)));
    const open = make('a', 'open-link');
    open.href = safeHttpUrl(site.url) || '#';
    open.target = '_blank';
    open.rel = 'noopener noreferrer';
    open.setAttribute('aria-label', `${site.name || site.url}を開く`);
    open.addEventListener('click', async () => {
      site.lastOpenedAt = Date.now();
      site.hasNewUpdate = false;
      await saveSite(site);
      render();
    });
    const dot = make('span', 'new-dot');
    dot.hidden = !site.hasNewUpdate;
    dot.setAttribute('aria-label', site.hasNewUpdate ? '前回開いてから更新あり' : '');
    open.append(dot, document.createTextNode('開く ↗'));
    const expand = make('button', 'expand-button', '+');
    expand.type = 'button';
    expand.setAttribute('aria-label', `${site.name || 'サイト'}のURLと設定を編集`);
    expand.setAttribute('aria-expanded', 'false');
    expand.setAttribute('aria-controls', `panel-${site.id}`);
    row.append(meta, open, expand);
    card.append(row);

    const panel = make('div', 'edit-panel hidden');
    panel.id = `panel-${site.id}`;
    const fields = make('div', 'field-grid');
    const nameField = make('div', 'field');
    const nameLabel = make('label', '', 'サイト名'); nameLabel.htmlFor = `name-${site.id}`;
    const nameInput = document.createElement('input'); nameInput.id = `name-${site.id}`; nameInput.type = 'text'; nameInput.maxLength = 80; nameInput.value = site.name || '';
    nameInput.placeholder = '例：お知らせ';
    nameField.append(nameLabel, nameInput);
    const urlField = make('div', 'field');
    const urlLabel = make('label', '', 'URL'); urlLabel.htmlFor = `url-${site.id}`;
    const urlInput = document.createElement('input'); urlInput.id = `url-${site.id}`; urlInput.type = 'url'; urlInput.inputMode = 'url'; urlInput.autocomplete = 'url'; urlInput.value = site.url; urlInput.placeholder = 'https://example.com/';
    urlField.append(urlLabel, urlInput);
    fields.append(nameField, urlField);
    panel.append(fields);
    panel.append(make('p', 'panel-note', 'チェック間隔は同じサイト（同一オリジン）ごとに30分です。更新日時は内容の変化を検知した時刻です。'));
    const actions = make('div', 'panel-actions');
    const save = make('button', 'button primary small', '保存'); save.type = 'button';
    const check = make('button', 'button small', 'このサイトを確認'); check.type = 'button';
    const del = make('button', 'button danger small', '削除'); del.type = 'button';
    const panelStatus = make('span', 'panel-status', site.lastCheckedAt ? `最終確認 ${fmtDate(site.lastCheckedAt)}` : 'まだ確認していません');
    save.addEventListener('click', async () => {
      const url = safeHttpUrl(urlInput.value);
      if (!url) { panelStatus.textContent = 'http:// または https:// から始まるURLを入力してください。'; urlInput.focus(); return; }
      site.name = nameInput.value.trim() || new URL(url).hostname;
      site.url = url;
      await saveSite(site);
      sites = await allSites();
      render();
      setStatus('設定を保存しました。');
    });
    check.addEventListener('click', async () => {
      const url = safeHttpUrl(urlInput.value);
      if (!url) { panelStatus.textContent = '有効なURLを入力してください。'; urlInput.focus(); return; }
      site.name = nameInput.value.trim() || new URL(url).hostname;
      site.url = url;
      await saveSite(site);
      sites = await allSites();
      render();
      await checkOne(site.id);
    });
    del.addEventListener('click', async () => {
      if (!window.confirm(`「${site.name || site.url}」を削除しますか？`)) return;
      await deleteSite(site.id);
      sites = await allSites();
      render();
      setStatus('サイトを削除しました。');
    });
    actions.append(save, check, del, panelStatus);
    panel.append(actions);
    expand.addEventListener('click', () => {
      const opening = panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !opening);
      expand.setAttribute('aria-expanded', String(opening));
    });
    card.append(panel);
    return card;
  }

  async function addSite() {
    const site = { id: makeId(), name: '', url: '', updatedAt: null, lastCheckedAt: null, lastOpenedAt: null, hasNewUpdate: false, hash: '' };
    sites.unshift(site);
    render();
    const card = list.firstElementChild;
    const expand = $('.expand-button', card);
    const panel = $('.edit-panel', card);
    panel.classList.remove('hidden');
    expand.setAttribute('aria-expanded', 'true');
    const urlInput = $('input[type="url"]', panel);
    urlInput.focus();
  }

  async function digest(text) {
    if (crypto.subtle) {
      const bytes = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(hash)].map(value => value.toString(16).padStart(2, '0')).join('');
    }
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16);
  }

  async function reserveRequest() {
    const now = Date.now();
    rateTimes = cleanedRateTimes(now);
    if (rateTimes.length >= MAX_REQUESTS_PER_MINUTE) {
      const wait = Math.max(1000, rateTimes[0] + RATE_WINDOW_MS - now);
      return { allowed: false, wait };
    }
    rateTimes.push(now);
    await saveRateTimes(rateTimes);
    return { allowed: true };
  }

  async function checkOne(id) {
    if (running) { setStatus('確認処理が進行中です。'); return; }
    const site = sites.find(item => item.id === id);
    if (!site) return;
    const url = safeHttpUrl(site.url);
    if (!url) { setStatus('編集パネルで有効なURLを保存してください。'); return; }
    const cool = cooldownRemaining(site);
    if (cool > 0) { setStatus(`このサイトはあと${durationText(cool)}で確認できます。`); return; }
    const quota = await reserveRequest();
    if (!quota.allowed) { setStatus(`1分あたり20件の上限に達しました。${durationText(quota.wait)}後に再試行できます。`); return; }
    running = true;
    setStatus(`${site.name || new URL(url).hostname}を確認中…`, true);
    const now = Date.now();
    site.lastCheckedAt = now;
    site.lastCheckedOrigin = siteOrigin(url);
    await saveSite(site);
    try {
      const readerUrl = `https://r.jina.ai/${url}`;
      const response = await fetch(readerUrl, { method: 'GET', cache: 'no-store' });
      if (!response.ok) throw new Error(`Reader APIからHTTP ${response.status}が返りました。`);
      const text = (await response.text()).replace(/\r\n/g, '\n').trim();
      if (!text) throw new Error('取得したページ内容が空でした。');
      const hash = await digest(text);
      const previousHash = site.hash;
      if (previousHash && previousHash !== hash) {
        site.updatedAt = Date.now();
        site.hasNewUpdate = true;
        setStatus(`${site.name || new URL(url).hostname}の内容が変わりました。`, true);
      } else if (!previousHash) {
        site.updatedAt = Date.now();
        setStatus(`${site.name || new URL(url).hostname}の初回内容を記録しました。`);
      } else {
        setStatus(`${site.name || new URL(url).hostname}に内容の変化はありません。`);
      }
      site.hash = hash;
      site.url = url;
      await saveSite(site);
    } catch (error) {
      site.lastError = String(error?.message || error);
      await saveSite(site);
      setStatus(`確認できませんでした：${site.lastError}`);
    } finally {
      running = false;
      sites = await allSites();
      rateTimes = await loadRateTimes();
      render();
    }
  }

  async function checkAvailable() {
    if (running) return setStatus('確認処理が進行中です。');
    let didCheck = false;
    const eligible = sites.filter(site => safeHttpUrl(site.url) && cooldownRemaining(site) <= 0);
    if (!eligible.length) {
      const next = Math.min(...sites.map(site => cooldownRemaining(site)).filter(value => value > 0));
      setStatus(Number.isFinite(next) ? `すべて確認済みです。次は約${durationText(next)}後に確認できます。` : '確認するサイトがありません。');
      return;
    }
    for (let i = 0; i < eligible.length; i++) {
      const site = sites.find(item => item.id === eligible[i].id);
      if (!site || cooldownRemaining(site) > 0) continue;
      const quota = await reserveRequest();
      if (!quota.allowed) {
        setStatus(`1分あたり20件の上限に達しました。${durationText(quota.wait)}後に続きから確認できます。`);
        break;
      }
      running = true;
      didCheck = true;
      setStatus(`確認中 ${i + 1}/${eligible.length}：${site.name || new URL(site.url).hostname}`, true);
      const checkedAt = Date.now();
      site.lastCheckedAt = checkedAt;
      site.lastCheckedOrigin = siteOrigin(site.url);
      await saveSite(site);
      try {
        const response = await fetch(`https://r.jina.ai/${safeHttpUrl(site.url)}`, { method: 'GET', cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = (await response.text()).replace(/\r\n/g, '\n').trim();
        if (!text) throw new Error('空の内容');
        const hash = await digest(text);
        if (site.hash && site.hash !== hash) { site.updatedAt = Date.now(); site.hasNewUpdate = true; }
        else if (!site.hash) site.updatedAt = Date.now();
        site.hash = hash;
        site.lastError = '';
        await saveSite(site);
      } catch (error) {
        site.lastError = String(error?.message || error);
        await saveSite(site);
      }
      running = false;
      sites = await allSites();
      rateTimes = await loadRateTimes();
      render();
      if (i < eligible.length - 1) await new Promise(resolve => setTimeout(resolve, REQUEST_GAP_MS));
    }
    if (didCheck && !status.textContent.startsWith('1分あたり20件')) {
      const changed = sites.filter(site => site.hasNewUpdate).length;
      setStatus(`確認が終わりました。更新あり ${changed}件。`, changed > 0);
    }
  }

  $('#addButton').addEventListener('click', addSite);
  $('#checkButton').addEventListener('click', checkAvailable);

  (async () => {
    try {
      db = await openDatabase();
      sites = await allSites();
      rateTimes = await loadRateTimes();
      render();
      setStatus(sites.length ? `${sites.length}件のサイトを読み込みました。` : '確認するサイトを追加してください。');
    } catch (error) {
      setStatus(error.message || 'データを読み込めませんでした。');
      $('#addButton').disabled = true;
      $('#checkButton').disabled = true;
    }
  })();
})();
</script>
</body>
</html>
