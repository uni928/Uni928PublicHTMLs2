<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>軽量 表入力ツール</title>
<style>
@layer base,layout,components,responsive;
@layer base{
/* 基本色、文字、全要素の寸法を定義。 */
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17212b;background:#f3f6f9;--line:#d6dde5;--blue:#1976d2;--head:#eef2f6}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer} }
@layer layout{
/* 操作バーと表領域を画面内に収める。 */
.app{min-height:100vh;display:flex;flex-direction:column}.top{padding:12px 16px;background:white;border-bottom:1px solid var(--line)}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.grid-wrap{overflow:auto;flex:1;min-height:50vh;background:#fff}.help{padding:7px 14px;color:#586575;font-size:12px;background:#fff;border-top:1px solid var(--line)} }
@layer components{
/* Excel風の操作、セル、選択範囲、編集欄を追加。 */
h1{font-size:18px;margin:0 12px 9px 0;display:inline-block}.bar button{border:1px solid #c7d0da;background:#fff;border-radius:5px;padding:6px 10px}.bar button:hover{background:#edf5ff;border-color:#8ab7e8}.bar label{font-size:13px;display:flex;align-items:center;gap:4px}.sep{height:26px;border-left:1px solid var(--line);margin:0 3px}.namebox{width:76px;text-align:center;padding:5px;border:1px solid #b9c4cf;border-radius:4px}.formula{display:flex;gap:6px;align-items:center;margin-top:9px}.formula strong{color:#637080;font-size:13px}.formula input{min-width:0;flex:1;padding:7px 9px;border:1px solid #c7d0da;border-radius:4px}.sheet{border-collapse:collapse;table-layout:fixed;user-select:none}.sheet th,.sheet td{border:1px solid #d8dee6;height:26px;min-width:96px;width:120px;padding:2px 6px;white-space:pre;overflow:hidden;text-overflow:clip;font-size:14px}.sheet thead th,.row-head,.corner{background:var(--head);text-align:center;font-weight:600;color:#4b5866;min-width:42px;width:42px}.sheet td{outline:none;user-select:text}.sheet td.selected{background:#e5f1ff}.sheet td.active{box-shadow:inset 0 0 0 2px var(--blue);position:relative}.sheet td:focus{outline:none}.sheet.range-mode td.active{box-shadow:none}.sheet td.editing{user-select:text}.status{margin-left:auto;color:#526170;font-size:12px}.hint{padding:7px 10px;color:#5a6673;font-size:12px}
}
@layer responsive{
/* 狭い画面でもツールバーを折り返し、表だけ横スクロール。 */
@media(max-width:650px){.top{padding:10px}.bar button{padding:7px 9px}.status{width:100%;margin:0}.help{line-height:1.6}.grid-wrap{min-height:55vh}}
}
</style>
</head>
<body><main class="app">
<header class="top"><div class="bar"><h1>軽量 表入力ツール</h1>
<button id="newBtn">新規</button><button id="addRow">行＋</button><button id="addCol">列＋</button><button id="delRow">行削除</button><button id="delCol">列削除</button><span class="sep"></span>
<button id="csvBtn">CSV出力</button><button id="htmlBtn">HTML保存</button><button id="importBtn">HTML読込</button><input id="importFile" type="file" accept=".html,text/html" hidden><label><input id="rangeMode" type="checkbox" checked>範囲選択モード</label><label><input id="autosave" type="checkbox" checked>リアルタイムセーブモード</label><label title="選択セルからフォーカスが外れた時に分割します。カンマ区切りは右方向、コロン区切りは下方向へ展開します。"><input id="bulk" type="checkbox" checked title="選択セルからフォーカスが外れた時に分割します。カンマ区切りは右方向、コロン区切りは下方向へ展開します。">一括挿入モード</label>
<span class="status" id="status" aria-live="polite">A1を選択中</span></div>
<div class="formula"><strong>セル</strong><input id="name" class="namebox" value="A1" aria-label="セル番地"><strong>入力</strong><input id="edit" aria-label="選択セルの内容" placeholder="選択中セルの内容"></div></header>
<div class="grid-wrap" id="wrap"><table class="sheet" id="sheet" aria-label="表入力グリッド"></table></div>
<footer class="help">セルをクリックして入力、ドラッグまたは Shift＋矢印で範囲選択。Ctrl/⌘＋C でタブ区切りコピー、Ctrl/⌘＋V で表へ貼り付け。Ctrl/⌘＋S でHTML保存。数式計算・マクロ等はありません。</footer>
</main>
<script>
(()=>{'use strict';
const ROWS=60,COLS=26;let data=Array.from({length:ROWS},()=>Array(COLS).fill('')),active={r:0,c:0},anchor={r:0,c:0},focusCell=null,dragging=false,autosaveDb=null,saveTimer=0,editedSinceLoad=false;
const table=document.querySelector('#sheet'),nameBox=document.querySelector('#name'),editor=document.querySelector('#edit'),status=document.querySelector('#status'),bulk=document.querySelector('#bulk'),rangeMode=document.querySelector('#rangeMode'),autosave=document.querySelector('#autosave'),importFile=document.querySelector('#importFile');
let imported=window.__SHEET_IMPORT__||null;if(imported)applyImportedState(imported,false);
const colName=n=>{let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
const ref=(r,c)=>colName(c)+(r+1);function ensure(r,c){while(data.length<=r)data.push([]);for(let i=0;i<data.length;i++)while(data[i].length<=c)data[i].push('')}
function render(){let nr=Math.max(ROWS,data.length),nc=Math.max(COLS,...data.map(r=>r.length));let out='<thead><tr><th class="corner"></th>';for(let c=0;c<nc;c++)out+='<th>'+colName(c)+'</th>';out+='</tr></thead><tbody>';for(let r=0;r<nr;r++){out+='<tr><th class="row-head">'+(r+1)+'</th>';for(let c=0;c<nc;c++)out+='<td tabindex="0" contenteditable="true" data-r="'+r+'" data-c="'+c+'"></td>';out+='</tr>'}table.innerHTML=out;for(let r=0;r<nr;r++)for(let c=0;c<nc;c++){let el=cell(r,c);el.textContent=data[r]?.[c]||''}mark();}
function cell(r,c){return table.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]')}
function mark(){editor.dataset.dirty='false';table.querySelectorAll('td').forEach(el=>{let r=+el.dataset.r,c=+el.dataset.c;el.classList.toggle('selected',r>=Math.min(anchor.r,active.r)&&r<=Math.max(anchor.r,active.r)&&c>=Math.min(anchor.c,active.c)&&c<=Math.max(anchor.c,active.c));el.classList.toggle('active',r===active.r&&c===active.c)});nameBox.value=ref(active.r,active.c);editor.value=data[active.r]?.[active.c]||'';status.textContent=ref(active.r,active.c)+(anchor.r!==active.r||anchor.c!==active.c?' ～ '+ref(anchor.r,anchor.c):'')}
function select(r,c,extend=false){ensure(r,c);active={r,c};if(!extend)anchor={r,c};mark();focusCell=cell(r,c);focusCell?.focus({preventScroll:true})}
function setVal(r,c,v){ensure(r,c);data[r][c]=String(v);editedSinceLoad=true;let el=cell(r,c);if(el&&el.textContent!==data[r][c])el.textContent=data[r][c];if(r===active.r&&c===active.c&&document.activeElement!==editor)editor.value=data[r][c];scheduleAutosave()}
function commitEdit(){if(editor.dataset.dirty==='true'){setVal(active.r,active.c,editor.value);editor.dataset.dirty='false'}}
function parseRef(s){let m=String(s).trim().toUpperCase().match(/^([A-Z]+)([1-9]\d*)$/);if(!m)return null;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return{r:+m[2]-1,c:c-1}}
function dbName(){let key=location.pathname||'default';let hash=0;for(let i=0;i<key.length;i++)hash=(Math.imul(hash,31)+key.charCodeAt(i))|0;return'table-input-autosave-'+Math.abs(hash)}
function openAutosaveDb(){if(autosaveDb)return Promise.resolve(autosaveDb);if(!('indexedDB'in window))return Promise.reject(new Error('このブラウザではIndexedDBを利用できません。'));return new Promise((resolve,reject)=>{let req=indexedDB.open(dbName(),1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('sheets'))req.result.createObjectStore('sheets')};req.onsuccess=()=>{autosaveDb=req.result;resolve(autosaveDb)};req.onerror=()=>reject(req.error||new Error('IndexedDBを開けませんでした。'))})}
function getCheckStates(){return{range:rangeMode.checked,autosave:autosave.checked,bulk:bulk.checked}}function applyCheckStates(s){if(typeof s.range==='boolean')rangeMode.checked=s.range;if(typeof s.autosave==='boolean')autosave.checked=s.autosave;if(typeof s.bulk==='boolean')bulk.checked=s.bulk;table.classList.toggle('range-mode',rangeMode.checked)}
function writeAutosave(enabled=autosave.checked){return openAutosaveDb().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction('sheets','readwrite');tx.objectStore('sheets').put({enabled,data,checks:getCheckStates()},'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('保存できませんでした。'))}))}
function scheduleAutosave(){if(!autosave.checked)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>writeAutosave(true).then(()=>{status.textContent='自動保存しました（IndexedDB）'}).catch(e=>{status.textContent=e.message}),180)}
async function initAutosave(){if(!imported&&location.hash){try{const incoming=await decodeFragmentState(location.hash,true);if(incoming){imported=incoming;applyImportedState(incoming,true);status.textContent='URLの保存データを読み込みました';return}}catch(e){status.textContent=e.message||'URL内の保存データを読み込めませんでした。'}}if(imported){table.classList.toggle('range-mode',rangeMode.checked);return}try{const db=await openAutosaveDb();const saved=await new Promise((resolve,reject)=>{let req=db.transaction('sheets','readonly').objectStore('sheets').get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(saved?.checks)applyCheckStates(saved.checks);else if(saved&&typeof saved.enabled==='boolean')autosave.checked=saved.enabled;if(saved?.enabled&&autosave.checked&&Array.isArray(saved.data)&&!editedSinceLoad){data=saved.data.map(row=>Array.isArray(row)?row.map(v=>String(v??'')):[]);let width=Math.max(COLS,...data.map(row=>row.length));data=data.map(row=>Array.from({length:width},(_,i)=>row[i]??''));render();select(0,0);status.textContent='IndexedDBから作業内容を復元しました'}else if(!saved){await writeAutosave(autosave.checked)}}catch(e){status.textContent='自動保存を利用できません：'+e.message}}
autosave.addEventListener('change',()=>{if(autosave.checked){writeAutosave(true).then(()=>{status.textContent='リアルタイムセーブを開始しました'}).catch(e=>{autosave.checked=false;status.textContent='自動保存を利用できません：'+e.message})}else{clearTimeout(saveTimer);writeAutosave(false).then(()=>{status.textContent='リアルタイムセーブを停止しました'}).catch(e=>{status.textContent='保存モードを更新できません：'+e.message})}});
function matrixSelection(){let r0=Math.min(anchor.r,active.r),r1=Math.max(anchor.r,active.r),c0=Math.min(anchor.c,active.c),c1=Math.max(anchor.c,active.c),a=[];for(let r=r0;r<=r1;r++){let row=[];for(let c=c0;c<=c1;c++)row.push(data[r]?.[c]||'');a.push(row)}return a}
function csvQuote(s){return '"'+String(s).replace(/"/g,'""')+'"'}function csvText(){return data.map(r=>r.map(csvQuote).join(',')).join('\r\n')}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function bytesToBase64Url(bytes){let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}function base64UrlToBytes(value){let raw=value.replace(/-/g,'+').replace(/_/g,'/');raw+='='.repeat((4-raw.length%4)%4);let bin=atob(raw),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function validateState(value){if(!value||value.v!==1||!Array.isArray(value.data))throw new Error('保存データの形式またはバージョンが正しくありません。');let cells=0;for(const row of value.data){if(!Array.isArray(row))throw new Error('表データの形式が正しくありません。');cells+=row.length;if(cells>500000||row.some(v=>typeof v!=='string'))throw new Error('表データのサイズまたは内容が許容範囲外です。')}if(value.checks&&(!['range','autosave','bulk'].every(k=>typeof value.checks[k]==='boolean')))throw new Error('チェック状態の形式が正しくありません。');return{v:1,data:value.data,checks:value.checks||{range:true,autosave:true,bulk:true}}}
async function encodeState(value){let bytes=new TextEncoder().encode(JSON.stringify(value)),options=[{key:'raw',format:null,bytes}];for(const item of [{key:'gz',format:'gzip'},{key:'dr',format:'deflate-raw'},{key:'br',format:'brotli'}]){try{if(!('CompressionStream'in window)||!('DecompressionStream'in window))continue;let packed=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream(item.format))).arrayBuffer());let restored=new Uint8Array(await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream(item.format))).arrayBuffer());if(restored.length===bytes.length&&restored.every((v,i)=>v===bytes[i]))options.push({...item,bytes:packed})}catch(e){}}options.sort((a,b)=>(a.key.length+bytesToBase64Url(a.bytes).length)-(b.key.length+bytesToBase64Url(b.bytes).length));return options[0]}
async function decodeFragmentState(hash,clearAfter=true){let m=hash.match(/^#(gz|dr|br|raw|sheetdata)=([A-Za-z0-9_-]+)$/);if(!m){if(hash.startsWith('#gz=')||hash.startsWith('#dr=')||hash.startsWith('#br=')||hash.startsWith('#raw=')||hash.startsWith('#sheetdata='))throw new Error('保存データのフラグメント形式が正しくありません。');return null}let key=m[1],bytes=base64UrlToBytes(m[2]);if(key==='gz'||key==='dr'||key==='br'){if(!('DecompressionStream'in window))throw new Error('このブラウザは保存データの解凍に対応していません。');let format=key==='gz'?'gzip':key==='dr'?'deflate-raw':'brotli';bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format))).arrayBuffer())}let parsed=validateState(JSON.parse(new TextDecoder().decode(bytes)));if(clearAfter)history.replaceState(null,'',location.pathname+location.search);return parsed}
function applyImportedState(value,persist=true){let state=validateState(value);data=state.data.map(row=>row.slice());let width=Math.max(COLS,...data.map(row=>row.length));data=data.map(row=>Array.from({length:width},(_,i)=>row[i]??''));applyCheckStates(state.checks);editedSinceLoad=true;render();select(0,0);if(persist)scheduleAutosave()}
function makeRedirectHtml(url){return'<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>location.replace('+JSON.stringify(url)+')</scr'+'ipt>'}
async function exportHtml(){try{commitEdit();const state={v:1,data,checks:getCheckStates()},best=await encodeState(state),target=new URL('https://uni928.github.io/Uni928PublicHTMLs2/index29.html');target.hash=best.key+'='+bytesToBase64Url(best.bytes);download(new Blob([makeRedirectHtml(target.href)],{type:'text/html;charset=utf-8'}),'表データ_'+new Date().toISOString().slice(0,10)+'.html');status.textContent='復元先 '+best.key+' 形式でHTML保存しました'}catch(e){status.textContent=e.message||'HTML保存に失敗しました。'}}
async function importSavedHtml(file){try{let html=await file.text(),m=html.match(/location\.replace\(("(?:[^"\\]|\\.)*")\)/);if(!m)throw new Error('対応する保存HTMLではありません。');let target;try{target=new URL(JSON.parse(m[1]))}catch(e){throw new Error('保存HTMLの復元先URLを読み取れません。')}if(target.origin!=='https://uni928.github.io'||target.pathname!=='/Uni928PublicHTMLs2/index29.html')throw new Error('許可されていない復元先URLです。');let state=await decodeFragmentState(target.hash,false);if(!state)throw new Error('保存データが見つかりません。');imported=state;applyImportedState(state);status.textContent='保存HTMLから表データを読み込みました'}catch(e){status.textContent=e.message||'保存HTMLを読み込めませんでした。'}finally{importFile.value=''}}
function applyMatrixAt(matrix,r0,c0){for(let r=0;r<matrix.length;r++)for(let c=0;c<matrix[r].length;c++)setVal(r0+r,c0+c,matrix[r][c]);active={r:r0+matrix.length-1,c:c0+Math.max(0,...matrix.map(x=>x.length))-1};anchor={...active};mark()}function applyMatrix(matrix){applyMatrixAt(matrix,active.r,active.c)}
function splitBulk(value){if(value.includes(':'))return value.split(':').map(row=>row.split(','));return[value.split(',')]}
table.addEventListener('input',e=>{let td=e.target.closest('td');if(td)setVal(+td.dataset.r,+td.dataset.c,td.textContent)});table.addEventListener('focusout',e=>{let td=e.target.closest('td');if(!td||!bulk.checked)return;let value=td.textContent;if(!value.includes(',')&&!value.includes(':'))return;let next=e.relatedTarget?.closest?.('td');let nextPos=next?{r:+next.dataset.r,c:+next.dataset.c}:null;applyMatrixAt(splitBulk(value),+td.dataset.r,+td.dataset.c);if(nextPos){active=nextPos;anchor={...active};mark()}});
table.addEventListener('pointerdown',e=>{let td=e.target.closest('td');if(!td)return;commitEdit();dragging=true;select(+td.dataset.r,+td.dataset.c);});table.addEventListener('pointerover',e=>{if(!dragging)return;let td=e.target.closest('td');if(td)select(+td.dataset.r,+td.dataset.c,true)});window.addEventListener('pointerup',()=>dragging=false);
table.addEventListener('dblclick',e=>{let td=e.target.closest('td');if(td){select(+td.dataset.r,+td.dataset.c);editor.focus();editor.select()}});
editor.addEventListener('input',()=>{editor.dataset.dirty='true';setVal(active.r,active.c,editor.value)});editor.addEventListener('blur',commitEdit);
nameBox.addEventListener('change',()=>{let p=parseRef(nameBox.value);if(p){commitEdit();select(p.r,p.c);cell(p.r,p.c)?.scrollIntoView({block:'nearest',inline:'nearest'})}else nameBox.value=ref(active.r,active.c)});
table.addEventListener('keydown',e=>{let r=+e.target.dataset.r,c=+e.target.dataset.c;if(e.key==='F2'||e.key==='Enter'){e.preventDefault();select(r,c);editor.focus();editor.select();return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.key)){e.preventDefault();commitEdit();let nr=r,nc=c;if(e.key==='ArrowUp')nr--;if(e.key==='ArrowDown'||e.key==='Enter'||(e.key==='Tab'&&e.shiftKey))nr++;if(e.key==='ArrowLeft')nc--;if(e.key==='ArrowRight'||(e.key==='Tab'&&!e.shiftKey))nc++;if(e.shiftKey&&e.key!=='Tab')select(Math.max(0,nr),Math.max(0,nc),true);else select(Math.max(0,nr),Math.max(0,nc));cell(active.r,active.c)?.scrollIntoView({block:'nearest',inline:'nearest'})}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportHtml()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&document.activeElement!==editor){let tsv=matrixSelection().map(r=>r.join('\t')).join('\r\n');navigator.clipboard?.writeText(tsv).catch(()=>{});e.preventDefault()}});
document.addEventListener('copy',e=>{if(document.activeElement===editor)return;e.preventDefault();e.clipboardData.setData('text/plain',matrixSelection().map(r=>r.join('\t')).join('\r\n'))});
document.addEventListener('paste',e=>{if(document.activeElement===editor||document.activeElement===nameBox)return;let text=e.clipboardData?.getData('text/plain');if(text==null)return;e.preventDefault();commitEdit();applyMatrix(text.replace(/\r/g,'').split('\n').filter((x,i,a)=>!(i===a.length-1&&x==='')).map(line=>line.split('\t')))});
document.querySelector('#csvBtn').onclick=()=>{commitEdit();download(new Blob(['\ufeff'+csvText()],{type:'text/csv;charset=utf-8'}),'表データ.csv');status.textContent='CSVを出力しました'};document.querySelector('#htmlBtn').onclick=exportHtml;document.querySelector('#importBtn').onclick=()=>importFile.click();importFile.addEventListener('change',()=>importSavedHtml(importFile.files?.[0]));
document.querySelector('#addRow').onclick=()=>{data.splice(active.r+1,0,Array(Math.max(COLS,...data.map(x=>x.length))).fill(''));editedSinceLoad=true;scheduleAutosave();render();select(active.r+1,active.c)};document.querySelector('#addCol').onclick=()=>{for(const row of data)row.splice(active.c+1,0,'');editedSinceLoad=true;scheduleAutosave();render();select(active.r,active.c+1)};document.querySelector('#delRow').onclick=()=>{if(data.length>1)data.splice(active.r,1);editedSinceLoad=true;scheduleAutosave();render();select(Math.min(active.r,data.length-1),active.c)};document.querySelector('#delCol').onclick=()=>{for(const row of data)if(row.length>1)row.splice(active.c,1);editedSinceLoad=true;scheduleAutosave();render();select(active.r,Math.min(active.c,Math.max(0,data[0].length-1)))};document.querySelector('#newBtn').onclick=()=>{if(confirm('表の内容を消去しますか？')){data=Array.from({length:ROWS},()=>Array(COLS).fill(''));editedSinceLoad=true;scheduleAutosave();render();select(0,0)}};
rangeMode.addEventListener('change',()=>{table.classList.toggle('range-mode',rangeMode.checked);writeAutosave().catch(e=>status.textContent=e.message)});bulk.addEventListener('change',()=>writeAutosave().catch(e=>status.textContent=e.message));table.classList.toggle('range-mode',rangeMode.checked);
render();select(0,0);initAutosave();
})();
</script></body></html>
