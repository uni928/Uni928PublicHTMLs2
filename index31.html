<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f7fb">
<title>画像文字起こしプロンプト作成</title>
<style>
@layer base, layout, components, responsive;
@layer base {
  :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #192338; background: #f4f7fb; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; }
  button, select, textarea { font: inherit; }
  button { cursor: pointer; }
}
/* layout layer: centered, phone-first page structure */
@layer layout {
  main { width: min(100% - 24px, 860px); margin: 24px auto 48px; }
  header { margin-bottom: 18px; }
  h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 5vw, 2rem); }
  header p { margin: 0; color: #526078; line-height: 1.65; }
  .stack { display: grid; gap: 14px; }
  .row { display: grid; gap: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
}
/* components layer: cards, controls, drop target and output */
@layer components {
  .card { background: #fff; border: 1px solid #dce4ef; border-radius: 16px; padding: 16px; box-shadow: 0 4px 18px #2437540a; }
  label { display: block; font-weight: 650; margin-bottom: 7px; }
  select, textarea { width: 100%; border: 1px solid #c8d3e2; border-radius: 10px; padding: 11px 12px; background: #fff; color: inherit; }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .drop { display: grid; place-items: center; min-height: 160px; padding: 18px; border: 2px dashed #98abc4; border-radius: 14px; background: #f8faff; text-align: center; color: #50627d; transition: .15s ease; }
  .drop strong { display: block; color: #203553; font-size: 1.05rem; margin-bottom: 6px; }
  .drop.drag { border-color: #2874d0; background: #edf5ff; }
  .button { border: 0; border-radius: 10px; padding: 10px 15px; background: #1769c2; color: white; font-weight: 650; }
  .button.secondary { color: #23415f; background: #e9f0f8; }
  .button:disabled { opacity: .5; cursor: not-allowed; }
  .muted, .status { color: #5a687d; font-size: .92rem; line-height: 1.55; }
  .status { min-height: 1.5em; margin: 10px 0 0; }
  .preview { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .preview img { width: 82px; height: 82px; object-fit: contain; background: #f1f4f8; border-radius: 10px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #e8f4ed; color: #176b3c; font-size: .84rem; font-weight: 650; }
  .hint { margin: 8px 0 0; color: #65748a; font-size: .86rem; }
  .section-title { margin: 0 0 12px; font-size: 1.05rem; }
}
@layer responsive {
  @media (min-width: 640px) {
    main { margin-top: 36px; }
    .card { padding: 20px; }
    .row { grid-template-columns: 1fr 1fr; }
    .drop { min-height: 190px; }
  }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>画像文字起こしプロンプト作成</h1>
    <p>画像をWebPに圧縮し、用途に合わせた指示文と一緒にコピーできます。画像はこのブラウザー内で処理します。</p>
  </header>
  <div class="stack">
    <section class="card" aria-labelledby="imageTitle">
      <h2 class="section-title" id="imageTitle">1. 画像を選ぶ</h2>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="画像を選択またはドラッグ＆ドロップ">
        <div><strong>画像をここにドラッグ＆ドロップ</strong><span>またはタップして画像を選択</span></div>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
      <div id="preview" class="preview" hidden><img id="thumb" alt="選択画像のプレビュー"><div><div id="fileName"></div><div id="compression" class="muted"></div></div></div>
      <p class="hint">最大28,000文字のBase64に収まるまで、画質を下げた後に画像サイズも調整します。</p>
    </section>
    <section class="card">
      <h2 class="section-title">2. 文字起こしの種類を選ぶ</h2>
      <div class="row">
        <div><label for="task">用途</label><select id="task"></select></div>
        <div><label for="detail">出力の詳しさ</label><select id="detail"><option value="faithful">原文に忠実</option><option value="structured">読みやすく整理</option><option value="compact">簡潔に要点も整理</option></select></div>
      </div>
      <label for="extra" style="margin-top:14px">追加の希望（任意）</label>
      <textarea id="extra" placeholder="例：表はMarkdown表にする。読めない文字は推測せず［判読不能］とする。"></textarea>
      <p class="hint">用途や追加の希望は次回もこのブラウザーに保存されます。</p>
    </section>
    <section class="card">
      <h2 class="section-title">3. プロンプトを作成</h2>
      <div class="actions"><button class="button" id="make" disabled>画像を圧縮して作成</button><button class="button secondary" id="makeDownload" disabled>画像を圧縮して作成（圧縮した画像をダウンロードする版）</button><button class="button secondary" id="copy" disabled>プロンプトをコピー</button></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <label for="output">生成されたプロンプト</label>
      <textarea id="output" readonly placeholder="画像を選び、「画像を圧縮して作成」を押してください。"></textarea>
    </section>
  </div>
</main>
<script>
(() => {
  const MAX_B64 = 28000;
  const tasks = [
    ['general','一般的な文字起こし','画像内の文字を読み取り、見たままの内容を文字起こししてください。'],
    ['document','書類・文書','書類全体を上から順に文字起こししてください。見出し、段落、箇条書きの構造を保ってください。'],
    ['form','申込書・記入用紙','項目名と記入内容の対応が分かる形で文字起こししてください。空欄は空欄と分かるようにしてください。'],
    ['table','表・一覧表','表の行と列の対応を保って文字起こししてください。可能ならMarkdown表で出力してください。'],
    ['receipt','レシート・領収書','店名、日時、品目、数量、金額、合計、支払方法などを読み取れる範囲で整理して文字起こししてください。'],
    ['business-card','名刺・連絡先','氏名、会社・団体名、部署・役職、住所、電話、メール、URLを項目ごとに整理してください。'],
    ['handwriting','手書き文字','手書き文字をできるだけ忠実に読み取ってください。判読できない箇所は推測せず［判読不能］としてください。'],
    ['notes','手書きメモ・ノート','メモの文字を読み取り、箇条書きや見出しの関係を保って文字起こししてください。'],
    ['screenshot','画面・スクリーンショット','画面内の文字を上から順に読み取り、ボタン名やラベルも含めて文字起こししてください。'],
    ['chat','チャット・会話画面','発言者と発言内容を分け、表示順に文字起こししてください。時刻が読める場合は含めてください。'],
    ['subtitle','字幕・テロップ','字幕やテロップを表示順に文字起こししてください。タイムコードが読める場合は併記してください。'],
    ['sign','看板・掲示・案内','看板や掲示の文字を読み取り、行や見出しのまとまりを保ってください。'],
    ['menu','メニュー・料金表','品名・説明・価格の対応が分かるように文字起こししてください。カテゴリ見出しも含めてください。'],
    ['math','数式・数値','数値、記号、単位、数式を正確に読み取ってください。曖昧な文字は候補を示し、断定しないでください。'],
    ['code','コード・設定画面','コードや設定値を見たまま文字起こしし、可能ならコードブロックに入れてください。空白や記号を勝手に補正しないでください。'],
    ['chart','グラフ・図表のラベル','タイトル、軸、凡例、データラベルなど画像内の文字を読み取ってください。判別できる範囲で対応関係も示してください。'],
    ['multi','複数ページ・複数画像の一部','画像に写っている範囲の文字を順に文字起こししてください。ページ番号や章見出しがあれば含めてください。'],
    ['translation','文字起こし＋翻訳','まず画像の原文を文字起こしし、その後に日本語訳を分けて出力してください。'],
    ['proofread','文字起こし＋誤記確認','まず画像の文字を原文どおりに文字起こしし、明らかな誤記の可能性がある箇所は別途指摘してください。'],
    ['description','画像内テキスト＋配置説明','文字起こしに加えて、見出し・本文・注記などの配置やまとまりを簡潔に説明してください。'],
    ['extract','指定情報の抽出','画像内の情報を読み取り、重要な項目を整理してください。項目が見つからない場合はその旨を示してください。'],
    ['language','外国語・多言語','画像内の文字を言語ごとに分けて文字起こししてください。判別できる場合は言語名も付けてください。'],
    ['low-quality','ぼやけた・低画質の画像','読める文字だけを慎重に文字起こししてください。不確かな箇所は［不明］とし、文脈だけで補わないでください。']
  ];
  const el = id => document.getElementById(id);
  const task = el('task'), fileInput = el('file'), drop = el('drop');
  let sourceFile = null, promptText = '', thumbUrl = '';
  for (const [value, title] of tasks) { const o = document.createElement('option'); o.value = value; o.textContent = title; task.append(o); }
  const dbOpen = () => new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return resolve(null);
    const req = indexedDB.open('transcription-prompt-maker', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('settings');
    req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
  });
  async function saveSettings() {
    try { const db = await dbOpen(); if (!db) return; const tx = db.transaction('settings','readwrite'); tx.objectStore('settings').put({task:task.value,detail:el('detail').value,extra:el('extra').value},'current'); } catch (_) {}
  }
  async function loadSettings() {
    try { const db = await dbOpen(); if (!db) return; const req = db.transaction('settings').objectStore('settings').get('current'); req.onsuccess = () => { const s=req.result; if(s){ if(tasks.some(t=>t[0]===s.task)) task.value=s.task; if(s.detail) el('detail').value=s.detail; el('extra').value=s.extra||''; } }; } catch (_) {}
  }
  void loadSettings();
  [task,el('detail'),el('extra')].forEach(node => node.addEventListener('change', saveSettings));
  el('extra').addEventListener('input', saveSettings);
  function setImage(file) {
    if (!file || !file.type.startsWith('image/')) { el('status').textContent='画像ファイルを選択してください。'; return; }
    sourceFile=file; el('make').disabled=false; el('makeDownload').disabled=false; el('copy').disabled=true; promptText=''; el('output').value='';
    if(thumbUrl) URL.revokeObjectURL(thumbUrl); thumbUrl=URL.createObjectURL(file);
    el('thumb').src=thumbUrl; el('fileName').textContent=file.name; el('compression').textContent=`元画像 ${(file.size/1024).toFixed(0)} KB`; el('preview').hidden=false;
    el('status').textContent='画像を選択しました。用途を確認して作成してください。';
  }
  drop.addEventListener('click',()=>fileInput.click());
  drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click();}});
  fileInput.addEventListener('change',()=>setImage(fileInput.files[0]));
  for(const ev of ['dragenter','dragover']) drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');});
  for(const ev of ['dragleave','drop']) drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');});
  drop.addEventListener('drop',e=>setImage(e.dataTransfer.files[0]));
  function loadBitmap(file) { return new Promise((resolve,reject)=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('画像を読み込めませんでした。')); img.src=URL.createObjectURL(file); }); }
  function canvasBlob(canvas,q) { return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('WebP変換に失敗しました。')),'image/webp',q)); }
  function base64(blob) { return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(new Error('Base64変換に失敗しました。'));r.readAsDataURL(blob);}); }
  async function compress(file) {
    const img=await loadBitmap(file); let scale=Math.min(1,2600/Math.max(img.naturalWidth,img.naturalHeight));
    for(let sizeTry=0;sizeTry<12;sizeTry++) {
      const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
      const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      for(const q of [.78,.62,.48,.36,.27,.19,.12,.08]) { const blob=await canvasBlob(c,q);const b64=await base64(blob);if(b64.length<=MAX_B64){return {b64,w,h,q,bytes:blob.size};} }
      scale*=.78;
    }
    throw new Error('この画像は上限内に圧縮できませんでした。別の画像をお試しください。');
  }
  async function createPrompt(downloadImage) {
    if(!sourceFile)return;el('make').disabled=true;el('makeDownload').disabled=true;el('copy').disabled=true;el('status').textContent='WebPに変換して圧縮しています…';
    try {
      const c=await compress(sourceFile), selected=tasks.find(t=>t[0]===task.value), detail=el('detail').value;
      const detailText=detail==='structured'?'出力は見やすく整えてください。ただし、原文にない情報は加えないでください。':detail==='compact'?'文字起こしの後に、必要なら要点を短くまとめてください。原文の文字起こしと要約を区別してください。':'改行や配置は必要に応じて保ち、原文にない内容は加えず、読めない箇所は推測しないでください。';
      const extra=el('extra').value.trim();
      if(downloadImage) {
        promptText=`添付画像を確認し、指定した内容に対応してください。\n\n【依頼】\n${selected[2]}\n${detailText}${extra?`\n追加の希望：${extra}`:''}\n\n文字が判読できない箇所は、文脈だけで断定せず［判読不能］としてください。`;
        const blob=await canvasBlobFromBase64(c.b64);
        const href=URL.createObjectURL(blob), a=document.createElement('a'); a.href=href; a.download=(sourceFile.name.replace(/\.[^.]+$/,'')||'image')+'.webp'; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(href),1000);
      } else {
        promptText=`次の画像を確認し、指定した内容に対応してください。\n\n【依頼】\n${selected[2]}\n${detailText}${extra?`\n追加の希望：${extra}`:''}\n\n文字が判読できない箇所は、文脈だけで断定せず［判読不能］としてください。\n\n【画像】\ndata:image/webp;base64,${c.b64}`;
      }
      el('output').value=promptText;el('copy').disabled=false;el('status').textContent=`${downloadImage?'圧縮画像をダウンロードし、添付用プロンプトを作成しました。':'作成しました。'} Base64 ${c.b64.length.toLocaleString()} / ${MAX_B64.toLocaleString()}文字、WebP ${(c.bytes/1024).toFixed(1)} KB、${c.w}×${c.h}px、画質目安 ${Math.round(c.q*100)}%。`;
      el('compression').textContent=`WebP ${(c.bytes/1024).toFixed(1)} KB・${c.w}×${c.h}px`;
    } catch(e) { el('status').textContent=e.message||'処理に失敗しました。'; }
    finally { el('make').disabled=false;el('makeDownload').disabled=false; }
  }
  function canvasBlobFromBase64(b64) { const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)); return Promise.resolve(new Blob([bytes],{type:'image/webp'})); }
  el('make').addEventListener('click',()=>createPrompt(false));
  el('makeDownload').addEventListener('click',()=>createPrompt(true));
  el('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(promptText);el('status').textContent='プロンプトをコピーしました。';}catch(_){el('output').focus();el('output').select();el('status').textContent='自動コピーできませんでした。選択した内容をコピーしてください。';}});
})();
</script>
</body>
</html>
