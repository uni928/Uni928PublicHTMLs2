<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブックマーク用HTML作成</title>
<style>
/* Layer changes: base contains all page and form styles. */
@layer base {
  :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f6fb; color: #172033; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 24px 16px; display: grid; place-items: center; }
  main { width: min(100%, 620px); padding: clamp(22px, 5vw, 38px); background: #fff; border: 1px solid #e0e6ef; border-radius: 18px; box-shadow: 0 14px 40px #24324a12; }
  h1 { margin: 0 0 10px; font-size: clamp(1.35rem, 4vw, 1.8rem); }
  p { line-height: 1.65; color: #526078; }
  label { display: block; margin: 24px 0 8px; font-weight: 650; }
  input { width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid #b8c3d3; border-radius: 9px; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 3px solid #84b5ff; outline-offset: 2px; }
  button { width: 100%; min-height: 48px; margin-top: 14px; padding: 11px 16px; border: 0; border-radius: 9px; background: #245fd1; color: white; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #194eaf; }
  #status { min-height: 1.6em; margin: 12px 0 0; font-size: .95rem; }
  .hint { margin-top: 18px; padding: 12px 14px; border-radius: 9px; background: #f2f6fc; font-size: .92rem; }
  @media (max-width: 480px) { body { padding: 14px 12px; } main { border-radius: 14px; } }
}
</style>
</head>
<body>
<main>
  <h1>ブックマーク用HTMLを作成</h1>
  <p>URLを入力すると、そのURLを開くための小さなHTMLファイルをダウンロードできます。</p>
  <form id="form">
    <label for="url">開きたいURL</label>
    <input id="url" name="url" type="url" inputmode="url" placeholder="https://example.com/" autocomplete="url" required>
    <button type="submit">HTMLファイルをダウンロード</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <p class="hint">ダウンロードしたHTMLを開くと、入力したWebページへ移動します。http:// または https:// から始まるURLを入力してください。</p>
</main>
<script>
/* Unusual spec: restrict generated redirects to HTTP(S), and escape script-closing text. */
const form = document.querySelector('#form');
const input = document.querySelector('#url');
const status = document.querySelector('#status');
form.addEventListener('submit', (event) => {
  event.preventDefault();
  const value = input.value.trim();
  let target;
  try { target = new URL(value); } catch { status.textContent = '有効なURLを入力してください。'; return; }
  if (!['http:', 'https:'].includes(target.protocol)) {
    status.textContent = 'http:// または https:// から始まるURLを入力してください。';
    return;
  }
  const safeUrl = JSON.stringify(value).replaceAll('<', '\\u003c').replaceAll('\u2028', '\\u2028').replaceAll('\u2029', '\\u2029');
  const html = `<!doctype html><meta charset="utf-8"><script>location.replace(${safeUrl})<\/script>`;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const href = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = href;
  link.download = 'bookmark-redirect.html';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(href), 1000);
  status.textContent = 'HTMLファイルをダウンロードしました。';
});
</script>
</body>
</html>
