<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6fa"><title>Web履歴書</title>
<style>
@layer base, layout, components, resume, uni-photo-dropbox, responsive;
/* base: reset browser defaults and provide consistent controls. */
@layer base {
*{box-sizing:border-box} body{margin:0;background:#f4f6fa;color:#202838;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif} button,input,textarea,select{font:inherit} button{cursor:pointer} :focus-visible{outline:3px solid #8d83e8;outline-offset:2px}
}
/* layout: editor and preview share one responsive workspace. */
@layer layout {
.app{max-width:1440px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand h1{font-size:24px;margin:0}.brand p{margin:5px 0;color:#667085;font-size:13px}.workspace{display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);gap:22px;align-items:start}.panel,.preview-shell{background:#fff;border:1px solid #e6e9f0;border-radius:18px;box-shadow:0 10px 30px #26324d0b}.panel{padding:20px}.preview-shell{padding:20px;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-title{font-size:15px;margin:20px 0 10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#596579;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #dce1ea;border-radius:9px;padding:10px 11px;background:white;color:#202838}.field textarea{min-height:76px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750}.btn-primary{background:#6559c7;color:white}.btn-light{background:#f1f2f8;color:#394154}.notice{font-size:12px;color:#657084;line-height:1.6}.status{min-height:1.4em;color:#a33;font-size:12px}.resume{margin:auto;width:min(100%,794px);min-width:640px;background:white;color:#111;padding:28px;border:1px solid #d5d8de;box-shadow:0 5px 24px #17213a12;font-family:"Yu Gothic","Noto Sans JP",sans-serif}.resume h2{text-align:center;letter-spacing:.35em;font-size:26px;margin:0 0 16px}.resume-head{display:grid;grid-template-columns:1fr 120px;gap:16px}.resume-meta{display:flex;justify-content:space-between;align-items:start;font-size:12px;margin:0 0 8px}.portrait{width:112px;height:144px;border:1px solid #999;object-fit:cover;background:#fafafa}.identity{border-collapse:collapse;width:100%;font-size:13px}.identity td,.identity th,.history td,.history th{border:1px solid #555;padding:7px 8px;vertical-align:middle}.identity th{font-weight:500;background:#f7f7f7;width:72px}.history{border-collapse:collapse;width:100%;font-size:12px;margin-top:14px;table-layout:fixed}.history th{background:#f7f7f7;font-weight:500}.history td{height:32px;white-space:pre-wrap;overflow-wrap:anywhere}.history .date{width:82px;text-align:center}.resume-lower{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.resume-box{border:1px solid #555;min-height:100px;padding:8px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.resume-box strong{display:block;border-bottom:1px solid #aaa;padding-bottom:5px;margin-bottom:6px;font-weight:600}.signature{font-size:11px;margin-top:12px;text-align:right}
}
@layer uni-photo-dropbox {
  .uni-photo-dropbox {padding:20px;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 8px 24px rgba(41,50,75,.07)}
  .uni-photo-dropbox__zone {position:relative;display:grid;place-items:center;width:100%;height:220px;overflow:hidden;border:1.5px dashed rgba(117,103,220,.28);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,247,253,.98));cursor:pointer;box-sizing:border-box;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
  .uni-photo-dropbox__zone:hover,.uni-photo-dropbox__zone.is-dragging{border-color:rgba(117,103,220,.58);box-shadow:0 12px 28px rgba(117,103,220,.10);transform:translateY(-1px)}
  .uni-photo-dropbox__inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center;pointer-events:none}.uni-photo-dropbox__icon{display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,rgba(117,103,220,.12),rgba(217,137,180,.16))}.uni-photo-dropbox__icon svg{width:25px;height:25px;stroke:#6e65ad}.uni-photo-dropbox__copy{display:grid;gap:5px;text-align:center}.uni-photo-dropbox__title{color:#182033;font-size:16px;font-weight:800;line-height:1.35;letter-spacing:.01em}.uni-photo-dropbox__guide{color:#667085;font-size:13px;font-weight:600;line-height:1.55}.uni-photo-dropbox__meta{color:#98a2b3;font-size:11px;font-weight:500;line-height:1.4}.uni-photo-dropbox__input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.uni-photo-dropbox__preview-wrap{position:relative;display:none}.uni-photo-dropbox__preview-wrap.is-visible{display:block}.uni-photo-dropbox__preview{display:block;width:100%;max-height:420px;object-fit:contain;border:1px solid rgba(110,145,210,.16);border-radius:18px;box-shadow:0 8px 20px rgba(15,23,42,.08)}.uni-photo-dropbox__change{position:absolute;right:12px;bottom:12px;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:linear-gradient(180deg,rgba(34,46,66,.84),rgba(56,69,92,.90));color:#fff;font:700 12px/1 system-ui,sans-serif;box-shadow:0 6px 16px rgba(15,23,42,.18);pointer-events:none}
}
/* responsive: stack editor and preview on narrow screens; retain the paper proportions. */
@layer responsive {@media(max-width:900px){.app{padding:14px}.workspace{grid-template-columns:1fr}.panel{padding:16px}.preview-shell{padding:10px}.resume{transform-origin:top left;min-width:640px}.topbar{align-items:flex-start;flex-direction:column}}@media(max-width:540px){.uni-photo-dropbox{padding:16px}.uni-photo-dropbox__zone{height:190px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions .btn{flex:1}.preview-shell{overflow:auto}.resume{margin-left:0}}}
</style></head>
<body><main id="editor" class="app"><header class="topbar"><div class="brand"><h1>Web履歴書</h1><p>入力内容を確認して、作業を再開できるHTMLを保存します。</p></div><div class="actions"><button class="btn btn-primary" id="export">作業継続用HTMLを保存</button><button class="btn btn-light" id="sendExport">送付用HTMLを保存</button><button class="btn btn-light" id="importBtn">作業データを読み込み</button><input id="importFile" type="file" accept=".html,text/html" hidden><button class="btn btn-light" id="clear">入力を消去</button></div></header><div class="workspace"><section class="panel"><h2 class="section-title" style="margin-top:0">基本情報</h2><div class="form-grid">
<div class="field"><label for="name">氏名</label><input id="name" autocomplete="name" placeholder="例：山田 花子"></div><div class="field"><label for="furigana">ふりがな</label><input id="furigana" placeholder="やまだ はなこ"></div><div class="field"><label for="birth">生年月日</label><input id="birth" placeholder="例：1995年4月1日"></div><div class="field"><label for="gender">性別（任意）</label><input id="gender" placeholder=""></div><div class="field full"><label for="address">現住所</label><input id="address" autocomplete="street-address" placeholder="〒000-0000 東京都..."></div><div class="field"><label for="phone">電話番号</label><input id="phone" type="tel" autocomplete="tel"></div><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email"></div></div>
<h2 class="section-title">顔写真</h2><div class="uni-photo-dropbox" id="photoBox"><label class="uni-photo-dropbox__zone"><span class="uni-photo-dropbox__inner"><span class="uni-photo-dropbox__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="12" cy="12" r="3"></circle></svg></span><span class="uni-photo-dropbox__copy"><span class="uni-photo-dropbox__title">写真をアップロード</span><span class="uni-photo-dropbox__guide">クリックして選択、またはここへドラッグ</span><span class="uni-photo-dropbox__meta">JPG・PNG・WebPに対応</span></span></span><input class="uni-photo-dropbox__input" type="file" accept="image/*"></label><div class="uni-photo-dropbox__preview-wrap"><img class="uni-photo-dropbox__preview" alt="アップロードした写真のプレビュー"><span class="uni-photo-dropbox__change">写真を入れ替える</span></div></div>
<h2 class="section-title">学歴・職歴</h2><div class="field"><label for="history">年月と内容を1行ずつ入力</label><textarea id="history" placeholder="2014年 4月　〇〇高等学校 入学&#10;2017年 3月　〇〇高等学校 卒業&#10;2017年 4月　株式会社〇〇 入社"></textarea></div>
<div class="form-grid" style="margin-top:12px"><div class="field full"><label for="license">免許・資格</label><textarea id="license" placeholder="2020年 6月　普通自動車第一種運転免許"></textarea></div><div class="field full"><label for="motivation">志望動機・自己PR</label><textarea id="motivation" placeholder="志望動機や自己PRを入力"></textarea></div><div class="field full"><label for="希望">本人希望記入欄</label><textarea id="希望" placeholder="勤務条件など希望があれば入力"></textarea></div></div>
<p class="notice">入力内容と写真はこの端末内で処理します。作業を続ける場合は「作業継続用HTMLを保存」を使い、保存したHTMLを開くと入力内容を復元できます。写真はWebPに圧縮して保存データを小さくします。</p><div class="status" id="status" role="status"></div></section><section class="preview-shell"><div id="paper" class="resume"></div></section></div></main>
<script>
(()=>{
const $=id=>document.getElementById(id);const keys=['name','furigana','birth','gender','address','phone','email','history','license','motivation','希望'];let photo='';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const collect=()=>Object.fromEntries([...keys.map(k=>[k,$(k).value]),['photo',photo]]);
function render(d=collect()){const lines=(d.history||'').split('\n').filter(x=>x.trim());const licenses=(d.license||'').split('\n').filter(x=>x.trim());const historyRows=Array.from({length:Math.max(7,lines.length+1)},(_,i)=>{const line=lines[i]||'';const m=line.match(/^\s*(\d{4}年?\s*\d{1,2}月?)\s*[　\s]*(.*)$/);return `<tr><td class="date">${escapeHtml(m?m[1]:'')}</td><td>${escapeHtml(m?m[2]:line)}</td></tr>`}).join('');const licenseRows=Array.from({length:Math.max(3,licenses.length)},(_,i)=>`<tr><td class="date">${escapeHtml(licenses[i]?.match(/^\s*(\d{4}年?\s*\d{1,2}月?)/)?.[1]||'')}</td><td>${escapeHtml(licenses[i]||'')}</td></tr>`).join('');$('paper').innerHTML=`<div class="resume-meta"><span>履歴書</span><span>作成日：${new Intl.DateTimeFormat('ja-JP').format(new Date())}</span></div><h2>履　歴　書</h2><div class="resume-head"><table class="identity"><tr><th>ふりがな</th><td colspan="3">${escapeHtml(d.furigana)}</td></tr><tr><th>氏名</th><td colspan="3" style="font-size:19px;height:48px">${escapeHtml(d.name)}</td></tr><tr><th>生年月日</th><td>${escapeHtml(d.birth)}</td><th>性別</th><td>${escapeHtml(d.gender)}</td></tr><tr><th>現住所</th><td colspan="3" style="height:52px">${escapeHtml(d.address)}</td></tr><tr><th>電話</th><td colspan="3">${escapeHtml(d.phone)}</td></tr><tr><th>メール</th><td colspan="3">${escapeHtml(d.email)}</td></tr></table><img class="portrait" src="${escapeHtml(d.photo||'')}" alt="顔写真"></div><table class="history"><thead><tr><th class="date">年　月</th><th>学歴・職歴</th></tr></thead><tbody>${historyRows}<tr><td></td><td style="text-align:right">以上</td></tr></tbody></table><table class="history"><thead><tr><th class="date">年　月</th><th>免許・資格</th></tr></thead><tbody>${licenseRows}</tbody></table><div class="resume-lower"><div class="resume-box"><strong>志望動機・自己PR</strong>${escapeHtml(d.motivation)}</div><div class="resume-box"><strong>本人希望記入欄</strong>${escapeHtml(d['希望'])}</div></div><p class="signature">記載内容に相違ありません。</p>`;}
function transform(bytes,format,decompress=false){const Ctor=decompress?window.DecompressionStream:window.CompressionStream;if(!Ctor)throw Error('圧縮機能に対応していません。');const stream=new Blob([bytes]).stream().pipeThrough(new Ctor(format));return new Response(stream).arrayBuffer().then(b=>new Uint8Array(b))}function b64url(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const formats=[['gz','gzip'],['df','deflate'],['dr','deflate-raw']];async function payload(d){const raw=new TextEncoder().encode(JSON.stringify({v:1,state:d}));const out=await Promise.all(formats.map(async([key,format])=>{try{return{key,data:b64url(await transform(raw,format))}}catch{return null}}));const best=out.filter(Boolean).sort((a,b)=>(a.key.length+a.data.length)-(b.key.length+b.data.length))[0];if(!best)throw Error('このブラウザーでは利用できる圧縮形式がありません。');return best.key+'='+best.data}
function redirectHtml(target){const safe=JSON.stringify(target).replace(/</g,'\\u003c');return `<!doctype html><meta charset="utf-8"><title>履歴書を開いています</title><script>location.replace(${safe})<\/script>`}
function setPhoto(data){photo=data;$('photoBox').querySelector('.uni-photo-dropbox__zone').style.display=data?'none':'grid';const w=$('photoBox').querySelector('.uni-photo-dropbox__preview-wrap'),im=$('photoBox').querySelector('img');im.src=data;w.classList.toggle('is-visible',!!data)}
const box=$('photoBox'),zone=box.querySelector('.uni-photo-dropbox__zone'),input=box.querySelector('input');async function choose(file){if(!file||!file.type.startsWith('image/'))return;try{const img=new Image(),url=URL.createObjectURL(file);await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});let w=img.naturalWidth,h=img.naturalHeight,max=900,scale=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let q=.82;photo=c.toDataURL('image/webp',q);while(photo.length>180000&&q>.4){q-=.1;photo=c.toDataURL('image/webp',q)}setPhoto(photo);render()}catch{$('status').textContent='画像を読み込めませんでした。別の画像をお試しください。'}}input.addEventListener('change',()=>choose(input.files[0]));box.querySelector('.uni-photo-dropbox__preview-wrap').addEventListener('click',()=>input.click());for(const ev of ['dragenter','dragover'])zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('is-dragging')});for(const ev of ['dragleave','drop'])zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('is-dragging')});zone.addEventListener('drop',e=>choose(e.dataTransfer.files[0]));
async function decodeHash(hash){const m=hash.match(/^#(gz|df|dr)=([A-Za-z0-9_-]+)$/);if(!m)throw Error('保存データが見つからないか、形式が不正です。');const [,kind,encoded]=m;if(encoded.length>1400000||encoded.length%4===1)throw Error('保存データが破損しています。');const b=atob(encoded.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((encoded.length+3)%4));const raw=Uint8Array.from(b,c=>c.charCodeAt(0));const saved=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(await transform(raw,({gz:'gzip',df:'deflate',dr:'deflate-raw'})[kind],true)));if(saved?.v!==1||!saved.state||typeof saved.state!=='object'||Array.isArray(saved.state))throw Error('未対応または破損した保存データです。');for(const k of keys)if(typeof saved.state[k]!=='string')throw Error('保存データの項目が不正です。');if(typeof saved.state.photo!=='string'||(saved.state.photo&&!/^data:image\/(?:webp|png|jpeg);base64,[A-Za-z0-9+/]+=*$/.test(saved.state.photo)))throw Error('写真データが不正です。');return saved.state}
function applyState(state){keys.forEach(k=>$(k).value=state[k]);setPhoto(state.photo);render()}
async function restoreHash(){if(!location.hash)return false;try{const state=await decodeHash(location.hash);applyState(state);history.replaceState(null,'',location.pathname+location.search);return true}catch{$('status').textContent='保存データを復元できませんでした。既存の入力は変更していません。';return true}}
async function init(){await restoreHash();render()}
keys.forEach(k=>$(k).addEventListener('input',()=>render()));$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{const source=await f.text();const found=source.match(String.raw`^<!doctype html><meta charset="utf-8"><title>履歴書を開いています</title><script>location\.replace\(("(?:[^"\\]|\\.)*")\)<\/script>$`);if(!found)throw Error('対応する作業継続用HTMLではありません。');const target=new URL(JSON.parse(found[1]));if(!/^https?:$/.test(target.protocol)||target.origin!==location.origin||target.pathname!==location.pathname)throw Error('保存ファイルの遷移先が許可されていません。');const state=await decodeHash(target.hash);applyState(state);$('status').textContent='作業データを読み込みました。'}catch(err){$('status').textContent='読み込みできませんでした。現在の入力は保持されています。 '+err.message}});
$('clear').addEventListener('click',()=>{if(!confirm('入力内容と写真を消去しますか？'))return;keys.forEach(k=>$(k).value='');setPhoto('');render()});
$('export').addEventListener('click',async()=>{const btn=$('export');btn.disabled=true;$('status').textContent='作業継続用HTMLを作成しています…';try{const encoded=await payload(collect());const target=new URL(location.href);if(!/^https?:$/.test(target.protocol))throw Error('作業継続用HTMLの保存にはWeb公開URLでこのページを開いてください。');target.hash=encoded;if(target.href.length>1000000)throw Error('保存URLが100万文字を超えました。写真を小さくするか、入力内容を短くしてください。');const html=redirectHtml(target.href);if(html.length>1000000)throw Error('保存HTMLが100万文字を超えました。写真を小さくするか、入力内容を短くしてください。');const blob=new Blob([html],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='履歴書_作業継続.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);$('status').textContent=`履歴書_作業継続.html を保存しました（約${Math.ceil(html.length/1000)}千文字）。`}catch(e){$('status').textContent=e.message||'保存に失敗しました。'}finally{btn.disabled=false}});
function sendDocument(){return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>履歴書</title><style>@layer base, resume;/* base: set readable page defaults. */@layer base{*{box-sizing:border-box}body{margin:0;padding:24px;background:#f4f6fa;color:#111;font-family:"Yu Gothic","Noto Sans JP",sans-serif}}/* resume: preserve the preview layout in a standalone recipient copy. */@layer resume{.resume{margin:auto;width:min(100%,794px);min-width:640px;background:#fff;padding:28px;border:1px solid #d5d8de}.resume h2{text-align:center;letter-spacing:.35em;font-size:26px;margin:0 0 16px}.resume-meta{display:flex;justify-content:space-between;align-items:start;font-size:12px;margin:0 0 8px}.resume-head{display:grid;grid-template-columns:1fr 120px;gap:16px}.portrait{width:112px;height:144px;border:1px solid #999;object-fit:cover;background:#fafafa}.identity,.history{border-collapse:collapse;width:100%;font-size:13px}.identity td,.identity th,.history td,.history th{border:1px solid #555;padding:7px 8px;vertical-align:middle}.identity th,.history th{font-weight:500;background:#f7f7f7}.identity th{width:72px}.history{font-size:12px;margin-top:14px;table-layout:fixed}.history td{height:32px;white-space:pre-wrap;overflow-wrap:anywhere}.history .date{width:82px;text-align:center}.resume-lower{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.resume-box{border:1px solid #555;min-height:100px;padding:8px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.resume-box strong{display:block;border-bottom:1px solid #aaa;padding-bottom:5px;margin-bottom:6px;font-weight:600}.signature{font-size:11px;margin-top:12px;text-align:right}@media(max-width:700px){body{padding:8px}.resume{margin-left:0}}@media print{body{padding:0;background:#fff}.resume{border:0;width:100%;max-width:none}}}</style></head><body>${$('paper').innerHTML}</body></html>`}
$('sendExport').addEventListener('click',()=>{try{render();const html=sendDocument(),blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='履歴書_送付用.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);$('status').textContent='履歴書_送付用.html を保存しました。'}catch{$('status').textContent='送付用HTMLの保存に失敗しました。'}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('export').click()}});init();
})();
</script></body></html>
