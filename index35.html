<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6fa"><title>自己紹介サイト作成</title>
<style>
@layer base, layout, components, profile, responsive;
/* base: set readable defaults and consistent controls. */
@layer base{*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202838;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid #8d83e8;outline-offset:2px}}
/* layout: keep editing and preview in one workspace. */
@layer layout{.app{max-width:1440px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand h1{font-size:24px;margin:0}.brand p{margin:5px 0;color:#667085;font-size:13px}.workspace{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:22px;align-items:start}.panel,.preview-shell{background:#fff;border:1px solid #e6e9f0;border-radius:18px;box-shadow:0 10px 30px #26324d0b}.panel{padding:20px}.preview-shell{padding:20px;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.section-title{font-size:15px;margin:20px 0 10px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:12px;color:#596579;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #dce1ea;border-radius:9px;padding:10px 11px;background:white;color:#202838}.field textarea{min-height:82px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750}.btn-primary{background:#6559c7;color:white}.btn-light{background:#f1f2f8;color:#394154}.notice{font-size:12px;color:#657084;line-height:1.6}.status{min-height:1.4em;color:#a33;font-size:12px}}
/* components: provide a simple image picker with a visible preview. */
@layer components{.photo-box{display:grid;gap:10px}.photo-zone{display:grid;place-items:center;min-height:130px;padding:18px;border:1.5px dashed #b9b1e7;border-radius:16px;background:#faf9ff;text-align:center;cursor:pointer;color:#665ca3}.photo-zone input{display:block;max-width:100%;margin:8px auto 0}.photo-preview{display:none;position:relative}.photo-preview.visible{display:block}.photo-preview img{display:block;width:100%;max-height:380px;object-fit:contain;border-radius:12px;background:#f3f4f7}.photo-preview button{margin-top:7px}}
/* profile: style the public introduction page preview. */
@layer profile{.profile{--accent:#6b5bd2;max-width:820px;min-width:0;margin:auto;overflow:hidden;background:#fff;border:1px solid #e4e7ee;border-radius:24px;box-shadow:0 16px 44px #20283812}.cover{height:130px;background:linear-gradient(120deg,#e7e3ff,#f5e8f0 55%,#dff2f0)}.profile-main{padding:0 32px 32px}.avatar{width:128px;height:128px;margin-top:-64px;border:5px solid white;border-radius:50%;object-fit:cover;background:#f3f4f7}.avatar.empty{display:grid;place-items:center;color:#8c91a0;font-size:12px}.name{font-size:30px;line-height:1.25;margin:14px 0 4px;overflow-wrap:anywhere}.tagline{color:#6c7280;margin:0 0 18px;white-space:pre-wrap;overflow-wrap:anywhere}.intro{font-size:15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{padding:7px 12px;border-radius:999px;background:#f1effb;color:#51478f;font-size:13px}.section{border-top:1px solid #edf0f4;padding:20px 0 0;margin-top:22px}.section h3{font-size:14px;color:#555c6a;margin:0 0 8px}.section p{margin:0;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.link{color:#5b51ad;overflow-wrap:anywhere}.empty-text{color:#9aa1ad}}
/* responsive: stack controls and keep the preview comfortable on phones. */
@layer responsive{@media(max-width:900px){.app{padding:14px}.workspace{grid-template-columns:1fr}.panel{padding:16px}.preview-shell{padding:10px}.topbar{align-items:flex-start;flex-direction:column}}@media(max-width:540px){.actions .btn{flex:1}.profile-main{padding:0 19px 24px}.cover{height:100px}.avatar{width:104px;height:104px;margin-top:-52px}.name{font-size:25px}.preview-shell{overflow:visible}}}
</style></head>
<body><main id="editor" class="app"><header class="topbar"><div class="brand"><h1>自己紹介サイト作成</h1><p>入力内容と画像を確認し、共有用または作業再開用HTMLを保存できます。</p></div><div class="actions"><button class="btn btn-primary" id="share">閲覧用HTMLを保存</button><button class="btn btn-light" id="save">作業再開用HTMLを保存（Ctrl+S）</button><button class="btn btn-light" id="clear">入力を消去</button></div></header><div class="workspace"><section class="panel"><h2 class="section-title" style="margin-top:0">プロフィール</h2>
<div class="field"><label for="name">名前・ニックネーム</label><input id="name" placeholder="例：花子"></div><div class="field"><label for="tagline">ひとこと</label><input id="tagline" placeholder="例：休日はカフェ巡りをしています"></div>
<h2 class="section-title">プロフィール画像</h2><div class="photo-box"><label class="photo-zone">画像を選択、またはここへドロップ<input id="photoInput" type="file" accept="image/*"></label><div id="photoPreview" class="photo-preview"><img id="photoImg" alt="選択した画像"><button class="btn btn-light" id="removePhoto" type="button">画像を削除</button></div></div>
<div class="field"><label for="about">自己紹介</label><textarea id="about" placeholder="自分のことや、伝えたいことを書いてください"></textarea></div><div class="field"><label for="interests">趣味・好きなこと</label><textarea id="interests" placeholder="例：旅行、映画、料理"></textarea></div><div class="field"><label for="values">大切にしていること</label><textarea id="values" placeholder="考え方や、相手と大切にしたいこと"></textarea></div><div class="field"><label for="message">相手へのメッセージ</label><textarea id="message" placeholder="気軽に話しかけてもらえるとうれしいです"></textarea></div><div class="field"><label for="link">リンク（任意）</label><input id="link" type="url" placeholder="https://example.com"></div>
<p class="notice">画像と入力内容はこのページ内で処理します。共有用HTMLは指定の閲覧ページへ移動し、データを読み込んだ後はURLのフラグメントを表示上消す仕組みです。Ctrl+Sで作業再開用HTMLを保存できます。</p><div class="status" id="status" role="status"></div></section><section class="preview-shell"><article class="profile" id="preview"></article></section></div></main>
<script>
(()=>{
const $=id=>document.getElementById(id),keys=['name','tagline','about','interests','values','message','link'];let photo='';const viewer='https://uni928.github.io/Uni928PublicHTMLs2/index35.html';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const collect=()=>Object.fromEntries([...keys.map(k=>[k,$(k).value]),['photo',photo]]);
function render(d=collect()){const tags=(d.interests||'').split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean);let link='';try{const u=new URL(d.link);if(['http:','https:'].includes(u.protocol))link=`<a class="link" href="${esc(u.href)}" rel="noopener noreferrer">${esc(u.href)}</a>`}catch{};$('preview').innerHTML=`<div class="cover"></div><div class="profile-main">${d.photo?`<img class="avatar" src="${esc(d.photo)}" alt="プロフィール画像">`:'<div class="avatar empty">画像なし</div>'}<h2 class="name">${esc(d.name)||'<span class="empty-text">名前・ニックネーム</span>'}</h2><p class="tagline">${esc(d.tagline)||'<span class="empty-text">ひとこと</span>'}</p><div class="intro">${esc(d.about)||'<span class="empty-text">自己紹介</span>'}</div>${tags.length?`<div class="chips">${tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}${[['大切にしていること',d.values],['相手へのメッセージ',d.message],['リンク',link]].filter(x=>x[1]).map(x=>`<section class="section"><h3>${x[0]}</h3><p>${x[0]==='リンク'?x[1]:esc(x[1])}</p></section>`).join('')}</div>`}
async function compress(bytes,format){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream(format))).arrayBuffer())}function b64url(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function pack(){const raw=new TextEncoder().encode(JSON.stringify({v:1,state:collect()}));const a=await compress(raw,'deflate-raw');return 'dr='+b64url(a)}
function download(content,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'text/html;charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function redirectHtml(url){return `<!doctype html><meta charset="utf-8"><title>自己紹介を開いています</title><script>location.replace(${JSON.stringify(url).replace(/</g,'\\u003c')})<\/script>`}
async function share(){const b=$('share');b.disabled=true;$('status').textContent='閲覧用HTMLを作成しています…';try{const hash=await pack();const url=viewer+'?'+Date.now()+'#'+hash;download(redirectHtml(url),'自己紹介_閲覧用.html');$('status').textContent='閲覧用HTMLを保存しました。'}catch(e){$('status').textContent='保存に失敗しました。'+e.message}finally{b.disabled=false}}
function saveWork(){try{const state=JSON.stringify(collect()).replace(/</g,'\\u003c');const source='<!doctype html>\n'+document.documentElement.outerHTML.replace('<body>','<body><script>window.__WORK_STATE='+state+';<\/script>');download(source,'自己紹介_作業再開.html');$('status').textContent='自己紹介_作業再開.html を保存しました。'}catch(e){$('status').textContent='保存に失敗しました。'+e.message}}
async function readHash(){if(window.__WORK_STATE&&typeof window.__WORK_STATE==='object'){const obj=window.__WORK_STATE;keys.forEach(k=>$(k).value=typeof obj[k]==='string'?obj[k]:'');photo=typeof obj.photo==='string'?obj.photo:'';return}const m=location.hash.match(/^#gz=([A-Za-z0-9_-]+)$/);if(!m)return;try{let s=m[1].replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const raw=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();const obj=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(raw));if(obj.v!==1||!obj.state)throw Error();keys.forEach(k=>$(k).value=typeof obj.state[k]==='string'?obj.state[k]:'');photo=typeof obj.state.photo==='string'?obj.state.photo:'';setPhoto();history.replaceState(null,'',location.pathname+location.search)}catch{$('status').textContent='保存データを読み込めませんでした。'}}
function setPhoto(){const p=$('photoPreview');p.classList.toggle('visible',!!photo);$('photoImg').src=photo}
$('photoInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const im=new Image(),u=URL.createObjectURL(f);await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=u});const scale=Math.min(1,1200/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*scale);c.height=Math.round(im.naturalHeight*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);photo=c.toDataURL('image/webp',.82);setPhoto();render()}catch{$('status').textContent='画像を読み込めませんでした。'}});
const photoZone=document.querySelector('.photo-zone');for(const ev of ['dragenter','dragover'])photoZone.addEventListener(ev,e=>{e.preventDefault();photoZone.style.background='#f0edff'});for(const ev of ['dragleave','drop'])photoZone.addEventListener(ev,e=>{e.preventDefault();photoZone.style.background=''});photoZone.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f){const dt=new DataTransfer();dt.items.add(f);$('photoInput').files=dt.files;$('photoInput').dispatchEvent(new Event('change'))}});$('photoPreview').addEventListener('dragover',e=>e.preventDefault());$('photoPreview').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])$('photoInput').files=e.dataTransfer.files;$('photoInput').dispatchEvent(new Event('change'))});$('removePhoto').addEventListener('click',()=>{photo='';$('photoInput').value='';setPhoto();render()});keys.forEach(k=>$(k).addEventListener('input',()=>render()));$('share').addEventListener('click',share);$('save').addEventListener('click',saveWork);$('clear').addEventListener('click',()=>{if(!confirm('入力内容と画像を消去しますか？'))return;keys.forEach(k=>$(k).value='');photo='';setPhoto();render()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveWork()}});readHash().then(()=>{setPhoto();render()});
})();
</script></body></html>
