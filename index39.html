<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSVテーブルビューア</title>
<style>
@layer reset, base, layout, components, responsive;
@layer reset { *,*::before,*::after{box-sizing:border-box} }
@layer base { :root{color-scheme:light;--ink:#17212b;--muted:#627181;--line:#dce4eb;--blue:#1769aa;--wash:#f3f7fa} body{margin:0;background:#f5f8fb;color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif} button,input,select{font:inherit} }
@layer layout { .wrap{max-width:1200px;margin:auto;padding:28px 20px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:18px 0}.tablebox{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:12px;background:white} }
@layer components { h1{font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:-.03em}.sub{color:var(--muted);margin:6px 0 0}.drop{min-height:220px;border:2px dashed #a9bfd0;border-radius:18px;background:white;display:grid;place-items:center;text-align:center;padding:24px;transition:.15s}.drop.over{border-color:var(--blue);background:#edf7ff}.drop strong{display:block;font-size:19px;margin-bottom:6px}.drop p{color:var(--muted);margin:0 0 16px}.btn{border:1px solid #c8d5df;border-radius:9px;padding:9px 14px;background:#fff;color:var(--ink);cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:hover{filter:brightness(.96)}.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:14px}.settings select,.search{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;color:var(--ink)}.search{width:min(320px,55vw)}.status{color:var(--muted);font-size:14px}.tablebox table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px}.tablebox th,.tablebox td{padding:10px 12px;border-bottom:1px solid #e8edf1;border-right:1px solid #eef1f4;text-align:left;white-space:pre-wrap;min-width:100px;max-width:480px;overflow-wrap:anywhere}.tablebox th{position:sticky;top:0;background:#edf3f7;font-weight:650;cursor:pointer;z-index:1}.tablebox tr:nth-child(even) td{background:#fafcfd}.tablebox tr:hover td{background:#f0f7fc}.empty{padding:28px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--muted)}.hidden{display:none!important}.note{color:var(--muted);font-size:13px;margin-top:14px} }
@layer responsive { @media(max-width:640px){.wrap{padding:20px 13px 40px}.top{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.tablebox{max-height:62vh}.drop{min-height:190px}} }
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div><h1>CSVテーブルビューア</h1><p class="sub">CSVを開いて、表形式で閲覧・検索できます。</p></div><button class="btn hidden" id="resetBtn">別のCSVを開く</button></header>
  <section id="drop" class="drop" aria-label="CSVドロップエリア"><div><strong>CSVファイルをここにドロップ</strong><p>またはファイルを選択してください。ファイルはブラウザ内で処理します。</p><button class="btn primary" id="pickBtn">CSVを選択</button><input id="fileInput" type="file" accept=".csv,text/csv,text/plain" hidden></div></section>
  <div class="settings" id="settings"><label>文字コード <select id="encoding"><option value="auto">自動判定</option><option value="utf-8">UTF-8</option><option value="shift_jis">Shift_JIS</option><option value="euc-jp">EUC-JP</option></select></label><label>区切り文字 <select id="delimiter"><option value="auto">自動判定</option><option value=",">カンマ</option><option value="\t">タブ</option><option value=";">セミコロン</option></select></label><label>改行 <select id="bodyNewlines"><option value="off">改行しない</option><option value="on">改行する</option></select></label><span id="fileName"></span></div>
  <section id="result" class="hidden"><div class="toolbar"><input class="search" id="filter" type="search" placeholder="表を検索"><div class="controls"><span class="status" id="count"></span><button class="btn" id="downloadBtn">CSVを保存</button></div></div><div class="tablebox" id="tablebox"></div></section>
  <p class="note">大きなファイルは、端末のメモリに応じて表示に時間がかかることがあります。</p>
</main>
<script>
const $=s=>document.querySelector(s), drop=$('#drop'), input=$('#fileInput');let raw='', filename='', rows=[], sortCol=-1, sortDir=1;
$('#pickBtn').onclick=()=>input.click();input.onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};
for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')});for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')});drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadFile(f)});
$('#resetBtn').onclick=()=>{raw='';rows=[];$('#result').classList.add('hidden');drop.classList.remove('hidden');$('#resetBtn').classList.add('hidden');$('#fileName').textContent='';input.value=''};
$('#encoding').onchange=()=>{if(raw)renderFile()};$('#delimiter').onchange=()=>{if(raw)renderFile()};$('#bodyNewlines').onchange=renderTable;$('#filter').oninput=renderTable;$('#downloadBtn').onclick=()=>{const blob=new Blob([raw],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename||'data.csv';a.click();URL.revokeObjectURL(a.href)};
async function loadFile(file){filename=file.name;raw=await file.arrayBuffer();$('#fileName').textContent=filename;drop.classList.add('hidden');$('#resetBtn').classList.remove('hidden');renderFile()}
function decode(){const b=new Uint8Array(raw),sel=$('#encoding').value;if(sel!=='auto')return new TextDecoder(sel).decode(b);if(b[0]===0xef&&b[1]===0xbb&&b[2]===0xbf)return new TextDecoder('utf-8').decode(b);try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch{return new TextDecoder('shift_jis').decode(b)}}
function detect(text){const selected=$('#delimiter').value;if(selected!=='auto')return selected;const sample=text.slice(0,12000),opts=[',','\t',';'];let best=',',score=-1;for(const d of opts){let q=false,n=0,counts=[];for(let i=0;i<sample.length;i++){const c=sample[i];if(c==='"'){if(q&&sample[i+1]==='"')i++;else q=!q}else if(!q&&c===d)n++;else if(!q&&c==='\n'){counts.push(n+1);n=0}}counts.push(n+1);const avg=counts.reduce((a,x)=>a+x,0)/counts.length,variance=counts.reduce((a,x)=>a+(x-avg)**2,0)/counts.length;const s=avg>1?avg-variance*.15:0;if(s>score){score=s;best=d}}return best}
function parseCSV(text,d){const out=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"'&&cell==='')q=true;else if(c===d){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));out.push(row);row=[];cell=''}else cell+=c}if(cell!==''||row.length){row.push(cell.replace(/\r$/,''));out.push(row)}while(out.length&&out[out.length-1].every(v=>v===''))out.pop();return out}
function renderFile(){try{const t=decode(),d=detect(t);rows=parseCSV(t,d);sortCol=-1;$('#filter').value='';$('#result').classList.remove('hidden');renderTable()}catch(e){$('#result').classList.remove('hidden');$('#tablebox').innerHTML='<div class="empty">CSVを読み込めませんでした。文字コードや区切り文字を切り替えてください。</div>'}}
function renderTable(){if(!rows.length){$('#tablebox').innerHTML='<div class="empty">データがありません。</div>';$('#count').textContent='0行';return}const width=Math.max(...rows.map(r=>r.length)),head=rows[0].map((v,i)=>v||`列 ${i+1}`),body=rows.slice(1),query=$('#filter').value.trim().toLocaleLowerCase();let data=body.map((r,i)=>({r,i})).filter(x=>!query||x.r.join(' ').toLocaleLowerCase().includes(query));if(sortCol>=0)data.sort((a,b)=>String(a.r[sortCol]||'').localeCompare(String(b.r[sortCol]||''),'ja',{numeric:true,sensitivity:'base'})*sortDir);let html='<table><thead><tr>';for(let i=0;i<width;i++)html+=`<th data-col="${i}">${esc(head[i]||`列 ${i+1}`)}${sortCol===i?(sortDir===1?' ▲':' ▼'):''}</th>`;html+='</tr></thead><tbody>';for(const x of data){html+='<tr>';for(let i=0;i<width;i++)html+=`<td>${esc(x.r[i]||'')}</td>`;html+='</tr>'}html+='</tbody></table>';$('#tablebox').innerHTML=html;$('#tablebox').querySelectorAll('th').forEach(th=>th.onclick=()=>{const c=+th.dataset.col;sortDir=sortCol===c?-sortDir:1;sortCol=c;renderTable()});$('#count').textContent=`${body.length.toLocaleString()}行中 ${data.length.toLocaleString()}行を表示`}
function esc(s){s=String(s);if($('#bodyNewlines').value==='on')s=s.replace(/\\r\\n|\\n|\\r/g,'\n');return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
