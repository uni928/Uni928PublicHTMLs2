<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>検索</title>
<style>
@layer reset, base, scenery, components, states, responsive;

@layer reset {
  /* 基本リセット */
  *, *::before, *::after { box-sizing: border-box; }
  button, input { font: inherit; }
}

@layer base {
  /* 草原テーマの基本色と可読性 */
  :root {
    color-scheme: light;
    --sky-top: #dff3ff;
    --sky-bottom: #f5fbff;
    --grass-near: #b8d98a;
    --grass-far: #d9e9ad;
    --fg: #203025;
    --muted: #607064;
    --accent: #3e7d4d;
    --accent-strong: #2f633c;
    --accent-soft: #e6f1df;
    --card: rgba(255, 255, 255, .94);
    --tile: rgba(255, 255, 255, .91);
    --tile-hover: #ffffff;
    --ring: rgba(52, 91, 60, .16);
    --danger: #d65353;
    --shadow-sm: 0 8px 22px rgba(45, 74, 49, .10);
    --shadow-md: 0 18px 44px rgba(45, 74, 49, .14);
  }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    overflow-x: hidden;
    font-family: Inter, "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--fg);
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 54%, #eef7da 54%, var(--grass-far) 72%, var(--grass-near) 100%);
  }

  button { color: inherit; }
}

@layer scenery {
  /* 写真を使わず、CSSだけで空・丘・草原を表現 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    left: -10vw;
    width: 120vw;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    bottom: 22vh;
    height: 29vh;
    background:
      radial-gradient(70% 130% at 15% 100%, #cce39c 0 50%, transparent 51%),
      radial-gradient(75% 125% at 56% 100%, #d7e9aa 0 52%, transparent 53%),
      radial-gradient(62% 120% at 92% 100%, #c4df94 0 50%, transparent 51%);
    opacity: .95;
  }

  body::after {
    bottom: 0;
    height: 28vh;
    background:
      linear-gradient(178deg, transparent 0 8%, rgba(119, 164, 82, .18) 8% 10%, transparent 10%),
      repeating-linear-gradient(100deg, rgba(75, 125, 56, .10) 0 2px, transparent 2px 16px),
      linear-gradient(to bottom, #b8d98a, #9dc875);
    clip-path: polygon(0 16%, 10% 11%, 23% 15%, 37% 8%, 52% 14%, 66% 7%, 80% 13%, 100% 6%, 100% 100%, 0 100%);
  }
}

@layer components {
  /* メインレイアウト */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 20px;
  }

  .stack {
    width: min(840px, 94vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 34px;
  }

  /* 検索バー */
  .search {
    width: min(760px, 94vw);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px 10px 18px;
    border: 1px solid rgba(46, 92, 55, .13);
    border-radius: 24px;
    background: var(--card);
    box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, .7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .search:focus-within {
    transform: translateY(-1px);
    border-color: rgba(62, 125, 77, .42);
    box-shadow: 0 20px 50px rgba(44, 82, 50, .18), 0 0 0 4px rgba(62, 125, 77, .11);
  }

  .search svg { flex: 0 0 auto; opacity: .78; }
  .search svg path,
  .search svg circle { stroke: #55705d; }

  .search input {
    min-width: 0;
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--fg);
    font-size: 18px;
    padding: 10px 2px;
  }

  .search input::placeholder { color: #849189; }

  .search button {
    border: 0;
    padding: 10px 18px;
    border-radius: 15px;
    background: linear-gradient(135deg, #4c925d, var(--accent-strong));
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(47, 99, 60, .22);
    transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
  }

  .search button:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(47, 99, 60, .29);
    filter: saturate(1.06);
  }

  .search button:active { transform: translateY(0) scale(.98); }

  /* ショートカット */
  .grid {
    width: min(760px, 94vw);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap: 18px 14px;
    padding: 18px 10px;
    border: 1px solid rgba(63, 103, 70, .10);
    border-radius: 30px;
    background: rgba(255, 255, 255, .22);
    box-shadow: 0 18px 46px rgba(65, 96, 56, .07);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 12px 6px 10px;
    border-radius: 22px;
    user-select: none;
    transition: transform .18s ease, background .18s ease;
  }

  .tile:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, .48);
  }

  .tile .dot {
    width: 72px;
    height: 72px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 1px solid rgba(65, 105, 71, .14);
    border-radius: 22px;
    background: var(--tile);
    box-shadow: var(--shadow-sm), inset 0 0 0 1px rgba(255,255,255,.52);
    cursor: pointer;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: .03em;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }

  .tile .dot:hover {
    transform: scale(1.045);
    background: var(--tile-hover);
    box-shadow: 0 14px 30px rgba(46, 80, 50, .16), inset 0 0 0 1px var(--ring);
  }

  .tile .dot img {
    width: 44%;
    height: 44%;
    object-fit: contain;
  }

  .tile .cap {
    max-width: 100px;
    overflow: hidden;
    color: #263b2b;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255,255,255,.75);
  }

  .add .dot {
    border: 1px dashed rgba(62, 125, 77, .48);
    background: rgba(239, 248, 231, .94);
    color: var(--accent-strong);
    box-shadow: none;
    font-size: 31px;
    font-weight: 500;
  }

  /* 編集ボタン */
  .btnmini {
    position: absolute;
    top: 2px;
    right: 8px;
    display: flex;
    gap: 6px;
    z-index: 2;
  }

  .btnmini button {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, .94);
    border-radius: 50%;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(31, 55, 37, .20);
    transition: transform .15s ease, filter .15s ease;
  }

  .btnmini button:hover { transform: scale(1.08); filter: brightness(1.04); }
  .btnmini .rename { background: var(--accent); }
  .btnmini .remove { background: var(--danger); }

  /* モーダル */
  .modalWrap {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 20px;
    background: rgba(24, 42, 29, .38);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
  }

  .modal {
    width: min(500px, 92vw);
    padding: 24px;
    border: 1px solid rgba(52, 95, 60, .13);
    border-radius: 24px;
    background: rgba(255, 255, 255, .97);
    box-shadow: 0 28px 80px rgba(28, 54, 34, .26);
  }

  .modal h3 {
    margin: 0 0 18px;
    color: #233b29;
    font-size: 19px;
    letter-spacing: .01em;
  }

  .modal .row {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 14px;
  }

  .modal .row[hidden] {
    display: none;
  }

  .modal label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .modal input {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid rgba(54, 91, 60, .18);
    border-radius: 13px;
    outline: 0;
    background: #fbfdf9;
    color: var(--fg);
    font-size: 14px;
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }

  .modal input:focus {
    border-color: rgba(62, 125, 77, .52);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(62, 125, 77, .10);
  }

  .modal .actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 20px;
  }

  .modal .actions button {
    border: 0;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    transition: transform .15s ease, background .15s ease;
  }

  #cancelBtn, #operationCloseBtn { background: #edf2eb; color: #56635a; }
  #okBtn { background: var(--accent); color: #fff; }
  .modal .actions button:hover { transform: translateY(-1px); }

  /* ドラッグ中 */
  .placeholder {
    width: 72px;
    height: 72px;
    border: 2px dashed rgba(62, 125, 77, .42);
    border-radius: 22px;
    background: rgba(62, 125, 77, .08);
  }

  /* トースト */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 2000;
    transform: translate(-50%, 10px);
    padding: 10px 15px;
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 999px;
    background: rgba(30, 54, 36, .92);
    color: #fff;
    box-shadow: 0 10px 28px rgba(22, 45, 27, .23);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* フォルダナビゲーションとフォルダタイル */
  .folderBar {
    width: min(760px, 94vw);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 48px;
    padding: 8px 14px;
    border: 1px solid rgba(63, 103, 70, .11);
    border-radius: 18px;
    background: rgba(255, 255, 255, .72);
    box-shadow: 0 10px 28px rgba(65, 96, 56, .07);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .folderBar[hidden] { display: none; }

  .folderHeading {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .folderHeading strong {
    overflow: hidden;
    color: #294431;
    font-size: 14px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }


  .backButton {
    flex: 0 0 auto;
    border: 1px solid rgba(62, 125, 77, .18);
    border-radius: 12px;
    padding: 8px 12px;
    background: #f4f8f1;
    color: var(--accent-strong);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }

  .backButton:hover { transform: translateY(-1px); background: #fff; }

  /* 操作タイルと操作メニュー */
  .operations .dot {
    border: 1px dashed rgba(62, 125, 77, .48);
    background: rgba(239, 248, 231, .96);
    color: var(--accent-strong);
    box-shadow: none;
    font-size: 28px;
  }

  .operationMenu {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .operationButton {
    min-height: 78px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid rgba(62, 125, 77, .15);
    border-radius: 16px;
    background: #f7fbf4;
    color: #2f5938;
    cursor: pointer;
    font-weight: 800;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }

  .operationButton:hover {
    transform: translateY(-1px);
    border-color: rgba(62, 125, 77, .34);
    background: #fff;
  }

  .operationButton span:first-child { font-size: 24px; line-height: 1; }
  .operationButton span:last-child { font-size: 13px; }

  .folder .dot {
    background: linear-gradient(145deg, #fffdf0, #eef3c8);
    color: #7d8736;
    font-size: 32px;
  }

  .folder .cap { color: #3f4e25; }

}

@layer states {
  /* 編集状態の視認性 */
  .edit .tile .dot { cursor: grab; }
  .edit .tile,
  .edit .tile .dot { touch-action: none; }
  .edit .tile:not(.add) { background: rgba(255, 255, 255, .48); }

  .ghost {
    opacity: .74;
    filter: drop-shadow(0 16px 24px rgba(37, 72, 43, .20));
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

@layer responsive {
  /* スマホ向け調整 */
  @media (max-width: 600px) {
    .page { place-items: start center; padding: 34px 14px; }
    .stack { gap: 26px; }
    .search { width: 100%; border-radius: 20px; padding-left: 14px; }
    .search input { font-size: 16px; }
    .search button { padding-inline: 14px; }
    .grid { width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 6px; padding: 14px 4px; }
    .tile { padding-inline: 2px; }
    .tile .dot { width: 64px; height: 64px; border-radius: 20px; }
    .tile .cap { max-width: 76px; font-size: 12px; }
    .btnmini { right: 0; }
    .operationMenu { grid-template-columns: 1fr; }
    .operationButton { min-height: 62px; flex-direction: row; justify-content: flex-start; padding: 0 18px; }
    body::before { bottom: 18vh; }
    body::after { height: 24vh; }
  }

  @media (max-width: 390px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto; }
    .search,
    .search button,
    .tile,
    .tile .dot,
    .btnmini button,
    .modal input,
    .modal .actions button,
    .toast { transition: none; }
  }
}
</style>
</head>
<body>
  <div class="page">
    <div class="stack">
      <form class="search" id="searchForm" action="https://www.google.com/search" method="GET">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 21l-4.3-4.3" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="7" stroke="#9aa0a6" stroke-width="2"/></svg>
        <input id="q" name="q" type="text" placeholder="検索またはURLを入力" autocomplete="off" />
        <button type="submit">検索</button>
      </form>
      <div class="folderBar" id="folderBar" hidden>
        <button class="backButton" id="backButton" type="button">← 戻る</button>
        <div class="folderHeading">
          <strong id="folderTitle">ホーム</strong>
        </div>
      </div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </div>
  </div>

  <div class="modalWrap" id="modalWrap" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 id="modalTitle">ショートカットを追加</h3>
      <div class="row"><label>名前</label><input id="nameInput" type="text" placeholder="例：YouTube" /></div>
      <div class="row" id="urlRow"><label>URL</label><input id="urlInput" type="text" placeholder="https://example.com" /></div>
      <div class="actions">
        <button id="cancelBtn" type="button">キャンセル</button>
        <button id="okBtn" type="button">完了</button>
      </div>
    </div>
  </div>

  <div class="modalWrap" id="operationWrap" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>操作</h3>
      <div class="operationMenu">
        <button class="operationButton" id="addShortcutAction" type="button"><span>＋</span><span>ショートカットを追加</span></button>
        <button class="operationButton" id="addFolderAction" type="button"><span>📁</span><span>フォルダを追加</span></button>
        <button class="operationButton" id="importAction" type="button"><span>⇧</span><span>インポート</span></button>
        <button class="operationButton" id="exportAction" type="button"><span>⇩</span><span>エクスポート</span></button>
      </div>
      <div class="actions">
        <button id="operationCloseBtn" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <input id="importFile" type="file" accept="application/json,.json" hidden />
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const DB_NAME = 'shortcut-db';
const STORE = 'shortcuts';
const ROOT_FOLDER = 'root';
let dbPromise;
let modalMode = 'shortcut';
let nameWasEdited = false;

function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 2);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        let store;

        if (!db.objectStoreNames.contains(STORE)) {
          store = db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        } else {
          store = event.target.transaction.objectStore(STORE);
        }

        if (!store.indexNames.contains('by_order')) store.createIndex('by_order', 'order');
        if (store.indexNames.contains('by_url')) store.deleteIndex('by_url');
        store.createIndex('by_url', 'url', { unique: false });
        if (!store.indexNames.contains('by_parent')) store.createIndex('by_parent', 'parentFolder', { unique: false });
        if (!store.indexNames.contains('by_folder_key')) store.createIndex('by_folder_key', 'folderKey', { unique: false });

        // 旧版データはすべてルート直下のショートカットとして引き継ぐ。
        store.openCursor().onsuccess = (e) => {
          const cursor = e.target.result;
          if (!cursor) return;
          const value = cursor.value;
          let changed = false;
          if (!value.type) { value.type = 'shortcut'; changed = true; }
          if (!value.parentFolder) { value.parentFolder = ROOT_FOLDER; changed = true; }
          if (changed) cursor.update(value);
          cursor.continue();
        };
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }
  return dbPromise;
}

async function txStore(mode = 'readonly') {
  const db = await openDB();
  const tx = db.transaction(STORE, mode);
  return { tx, st: tx.objectStore(STORE) };
}

async function getAll() {
  const { st } = await txStore();
  return new Promise((resolve, reject) => {
    const request = st.getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  });
}

function currentFolderKey() {
  return new URL(location.href).searchParams.get('folder') || ROOT_FOLDER;
}

function folderUrl(folderKey) {
  const url = new URL(location.href);
  if (!folderKey || folderKey === ROOT_FOLDER) url.searchParams.delete('folder');
  else url.searchParams.set('folder', folderKey);
  return url.href;
}

function normUrl(value) {
  if (!value) return '';
  let v = value.trim();
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try {
    const url = new URL(v);
    // パラメータ順だけが違うURLは同一扱いにし、値が違う場合は別サイトとして保持する。
    const sorted = [...url.searchParams.entries()].sort(([ak, av], [bk, bv]) =>
      ak.localeCompare(bk) || av.localeCompare(bv)
    );
    url.search = '';
    sorted.forEach(([key, val]) => url.searchParams.append(key, val));
    return url.href;
  } catch {
    return '';
  }
}

function hostTitle(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch { return url; }
}

function suggestedTitle(url) {
  try {
    const parsed = new URL(normUrl(url));
    const host = parsed.hostname.replace(/^www\./, '');
    const params = [...parsed.searchParams.entries()];
    if (params.length) {
      const suffix = params.slice(0, 2).map(([k, v]) => `${k}=${v}`.slice(0, 28)).join(' · ');
      return `${host} · ${suffix}`;
    }
    const path = parsed.pathname.split('/').filter(Boolean).pop();
    return path ? `${host} · ${decodeURIComponent(path).slice(0, 28)}` : host;
  } catch {
    return '';
  }
}

function faviconUrl(url) {
  try {
    const parsed = new URL(url);
    return `https://www.google.com/s2/favicons?domain=${parsed.hostname}&sz=64`;
  } catch {
    return '';
  }
}

async function generateFolderKey(name) {
  const all = await getAll();
  const used = new Set(all.filter(x => x.type === 'folder').map(x => x.folderKey));

  for (let attempt = 0; attempt < 8; attempt += 1) {
    const random = new Uint8Array(24);
    crypto.getRandomValues(random);
    const seed = `${name}|${Date.now()}|${performance.now()}|${Array.from(random).join(',')}`;
    let key;

    if (crypto.subtle) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(seed));
      key = Array.from(new Uint8Array(digest)).map(v => v.toString(16).padStart(2, '0')).join('').slice(0, 32);
    } else {
      key = Array.from(random).map(v => v.toString(16).padStart(2, '0')).join('').slice(0, 32);
    }

    if (!used.has(key)) return key;
  }
  throw new Error('folder-key-collision');
}

async function addShortcut(url, title) {
  const normalized = normUrl(url);
  if (!normalized) throw new Error('invalid');
  const parentFolder = currentFolderKey();
  const all = await getAll();
  if (all.some(x => x.type === 'shortcut' && x.parentFolder === parentFolder && normUrl(x.url) === normalized)) return null;

  const siblings = all.filter(x => x.parentFolder === parentFolder);
  const order = (siblings.reduce((max, x) => Math.max(max, x.order || 0), 0) || 0) + 1;
  const finalTitle = title && title.trim() ? title.trim() : suggestedTitle(normalized) || hostTitle(normalized);
  const { st, tx } = await txStore('readwrite');
  st.add({ type: 'shortcut', parentFolder, url: normalized, title: finalTitle, order });
  return new Promise(resolve => tx.oncomplete = () => resolve(true));
}

async function addFolder(title) {
  const name = title.trim() || '新しいフォルダ';
  const parentFolder = currentFolderKey();
  const all = await getAll();
  const siblings = all.filter(x => x.parentFolder === parentFolder);
  const order = (siblings.reduce((max, x) => Math.max(max, x.order || 0), 0) || 0) + 1;
  const folderKey = await generateFolderKey(name);
  const { st, tx } = await txStore('readwrite');
  st.add({ type: 'folder', parentFolder, folderKey, title: name, order });
  return new Promise(resolve => tx.oncomplete = () => resolve(folderKey));
}

async function renameEntry(id, title) {
  const { st, tx } = await txStore('readwrite');
  const current = window._cache.get(Number(id));
  if (!current) return;
  st.put({ ...current, title: title.trim() || current.title });
  return new Promise(resolve => tx.oncomplete = () => resolve(true));
}

async function removeEntry(id) {
  const all = await getAll();
  const target = all.find(x => x.id === Number(id));
  if (!target) return;
  const ids = new Set([target.id]);

  if (target.type === 'folder') {
    const folderQueue = [target.folderKey];
    while (folderQueue.length) {
      const parent = folderQueue.shift();
      for (const item of all.filter(x => x.parentFolder === parent)) {
        ids.add(item.id);
        if (item.type === 'folder') folderQueue.push(item.folderKey);
      }
    }
  }

  const { st, tx } = await txStore('readwrite');
  ids.forEach(entryId => st.delete(entryId));
  return new Promise(resolve => tx.oncomplete = () => resolve(true));
}

async function saveOrder(ids) {
  const { st, tx } = await txStore('readwrite');
  ids.forEach((id, i) => {
    const numericId = Number(id);
    const current = window._cache?.get(numericId);
    if (current) st.put({ ...current, order: i + 1 });
  });
  return new Promise(resolve => tx.oncomplete = () => resolve(true));
}

const grid = document.getElementById('grid');
const modalWrap = document.getElementById('modalWrap');
const modalTitle = document.getElementById('modalTitle');
const nameInput = document.getElementById('nameInput');
const urlInput = document.getElementById('urlInput');
const urlRow = document.getElementById('urlRow');
const okBtn = document.getElementById('okBtn');
const cancelBtn = document.getElementById('cancelBtn');
const toastEl = document.getElementById('toast');
const folderBar = document.getElementById('folderBar');
const folderTitle = document.getElementById('folderTitle');
const backButton = document.getElementById('backButton');
const operationWrap = document.getElementById('operationWrap');
const operationCloseBtn = document.getElementById('operationCloseBtn');
const addShortcutAction = document.getElementById('addShortcutAction');
const addFolderAction = document.getElementById('addFolderAction');
const importAction = document.getElementById('importAction');
const exportAction = document.getElementById('exportAction');
const importFile = document.getElementById('importFile');

window.editMode = false;
window.editingId = null;
window.editTimer = null;
window._cache = window._cache || new Map();

let draggingGhost = null;
let draggingId = null;
let dragPlaceholder = null;
let dragStartY = 0;
let draggingNode = null;

function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

function enterEditMode() {
  if (editMode) return;
  editMode = true;
  render();
  toast('編集モード');
  resetEditTimer();
}

function exitEditMode() {
  if (!editMode) return;
  editMode = false;
  clearTimeout(editTimer);
  render();
  toast('編集モード終了');
}

function resetEditTimer() {
  clearTimeout(editTimer);
  editTimer = setTimeout(() => exitEditMode(), 8000);
}

function openModal(mode, item = null) {
  modalMode = mode;
  editingId = item?.id ?? null;
  nameWasEdited = Boolean(item);
  const isFolder = mode === 'folder';
  const isEdit = Boolean(item);
  modalTitle.textContent = isEdit
    ? (isFolder ? 'フォルダ名を変更' : 'ショートカットを編集')
    : (isFolder ? 'フォルダを追加' : 'ショートカットを追加');
  urlRow.hidden = isFolder;
  nameInput.value = item?.title || '';
  urlInput.value = item?.url || '';
  modalWrap.style.display = 'grid';
  setTimeout(() => nameInput.focus(), 50);
}

function closeModal() {
  modalWrap.style.display = 'none';
  editingId = null;
  modalMode = 'shortcut';
}

function onDragMove(e) {
  if (!draggingGhost) return;
  e.preventDefault();
  const dy = e.clientY - dragStartY;
  draggingGhost.style.transform = `translateY(${dy}px)`;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tile = el && el.closest('.tile[data-id]');
  if (tile === draggingGhost || tile === dragPlaceholder) return;
  if (tile && tile.parentElement === grid) {
    const rect = tile.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    grid.insertBefore(dragPlaceholder, before ? tile : tile.nextSibling);
  }
}

async function onDragUp() {
  if (draggingGhost) { draggingGhost.remove(); draggingGhost = null; }
  if (draggingNode && dragPlaceholder) grid.insertBefore(draggingNode, dragPlaceholder);
  if (dragPlaceholder) { dragPlaceholder.remove(); dragPlaceholder = null; }
  const ids = [...grid.querySelectorAll('.tile[data-id]')].map(node => node.dataset.id);
  await saveOrder(ids);
  toast('順序を保存しました');
  draggingId = null;
  draggingNode = null;
  window.removeEventListener('pointermove', onDragMove);
}

async function renderFolderBar(all, folderKey) {
  if (folderKey === ROOT_FOLDER) {
    folderBar.hidden = true;
    document.title = '検索';
    return;
  }

  const folder = all.find(x => x.type === 'folder' && x.folderKey === folderKey);
  if (!folder) {
    const url = new URL(location.href);
    url.searchParams.delete('folder');
    history.replaceState(null, '', url.href);
    folderBar.hidden = true;
    document.title = '検索';
    toast('フォルダが見つからないためホームに戻りました');
    return ROOT_FOLDER;
  }

  folderBar.hidden = false;
  folderTitle.textContent = folder.title;
  document.title = `${folder.title} - 検索`;
  backButton.onclick = () => { location.href = folderUrl(folder.parentFolder || ROOT_FOLDER); };
  return folderKey;
}

function openOperationMenu() {
  operationWrap.style.display = 'grid';
}

function closeOperationMenu() {
  operationWrap.style.display = 'none';
}

function createOperationTile() {
  const tile = document.createElement('div');
  tile.className = 'tile operations';
  tile.innerHTML = '<div class="dot" aria-hidden="true">☰</div><div class="cap">操作</div>';
  tile.addEventListener('click', openOperationMenu);
  tile.addEventListener('pointerdown', () => {});
  return tile;
}

async function render() {
  const all = await getAll();
  let folderKey = currentFolderKey();
  const resolved = await renderFolderBar(all, folderKey);
  if (resolved === ROOT_FOLDER && folderKey !== ROOT_FOLDER) folderKey = ROOT_FOLDER;

  const items = all
    .filter(x => (x.parentFolder || ROOT_FOLDER) === folderKey)
    .sort((a, b) => (a.order || 0) - (b.order || 0) || a.id - b.id);

  window._cache.clear();
  items.forEach(x => window._cache.set(x.id, x));
  document.body.classList.toggle('edit', editMode);
  grid.innerHTML = '';

  // 追加・入出力は「操作」に集約する。
  grid.append(createOperationTile());

  items.forEach(item => {
    const tile = document.createElement('div');
    tile.className = item.type === 'folder' ? 'tile folder' : 'tile';
    tile.dataset.id = item.id;

    const icon = item.type === 'folder'
      ? '📁'
      : (faviconUrl(item.url)
          ? `<img src="${faviconUrl(item.url)}" alt="" onerror="this.style.display='none'">`
          : (item.title || hostTitle(item.url)).charAt(0).toUpperCase());

    tile.innerHTML = `<div class="dot" title="${escapeHtml(item.title)}">${icon}</div><div class="cap">${escapeHtml(item.title)}</div>`;
    const dot = tile.querySelector('.dot');

    dot.addEventListener('click', () => {
      if (editMode) return;
      location.href = item.type === 'folder' ? folderUrl(item.folderKey) : item.url;
    });

    let longPressTimer = null;
    tile.addEventListener('pointerdown', () => {
      if (editMode) return;
      longPressTimer = setTimeout(() => enterEditMode(), 500);
    });
    tile.addEventListener('pointerup', () => clearTimeout(longPressTimer));
    tile.addEventListener('pointerleave', () => clearTimeout(longPressTimer));
    tile.addEventListener('contextmenu', (e) => { e.preventDefault(); enterEditMode(); });

    if (editMode) {
      const buttons = document.createElement('div');
      buttons.className = 'btnmini';
      const rename = document.createElement('button');
      rename.className = 'rename';
      rename.type = 'button';
      rename.textContent = '✎';
      rename.setAttribute('aria-label', '名前を変更');
      rename.onclick = () => openModal(item.type === 'folder' ? 'folder' : 'shortcut', item);

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.type = 'button';
      remove.textContent = '×';
      remove.setAttribute('aria-label', '削除');
      remove.onclick = async () => {
        if (item.type === 'folder') {
          const ok = confirm(`「${item.title}」と、その中身をすべて削除しますか？`);
          if (!ok) return;
        }
        await removeEntry(item.id);
        await render();
        toast(item.type === 'folder' ? 'フォルダを削除しました' : '削除しました');
      };
      buttons.append(rename, remove);
      tile.appendChild(buttons);

      tile.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.btnmini')) return;
        draggingId = tile.dataset.id;
        dragStartY = e.clientY;
        dragPlaceholder = document.createElement('div');
        dragPlaceholder.className = 'placeholder';
        dragPlaceholder.style.width = `${tile.offsetWidth}px`;
        dragPlaceholder.style.height = `${tile.offsetHeight}px`;
        grid.insertBefore(dragPlaceholder, tile);
        draggingNode = tile;
        grid.removeChild(tile);
        const rect = dragPlaceholder.getBoundingClientRect();
        draggingGhost = draggingNode.cloneNode(true);
        draggingGhost.classList.add('ghost');
        Object.assign(draggingGhost.style, {
          position: 'fixed', left: rect.left + 'px', top: rect.top + 'px',
          width: rect.width + 'px', zIndex: 999, pointerEvents: 'none'
        });
        document.body.appendChild(draggingGhost);
        window.addEventListener('pointermove', onDragMove, { passive: false });
        window.addEventListener('pointerup', onDragUp, { once: true });
      });
    }

    grid.appendChild(tile);
  });
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[ch]);
}

async function exportData() {
  const all = await getAll();
  const payload = {
    format: 'meadow-shortcuts',
    version: 1,
    exportedAt: new Date().toISOString(),
    entries: all.map(({ id, ...entry }) => entry)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  a.href = url;
  a.download = `meadow-shortcuts-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
  toast('エクスポートしました');
}

function validateImportEntries(entries) {
  if (!Array.isArray(entries)) throw new Error('invalid-entries');
  const folderKeys = new Set([ROOT_FOLDER]);
  const normalized = entries.map((entry, index) => {
    if (!entry || (entry.type !== 'shortcut' && entry.type !== 'folder')) throw new Error('invalid-entry');
    const title = String(entry.title || '').trim() || (entry.type === 'folder' ? '新しいフォルダ' : '名称未設定');
    const parentFolder = String(entry.parentFolder || ROOT_FOLDER);
    const order = Number.isFinite(Number(entry.order)) ? Number(entry.order) : index + 1;

    if (entry.type === 'folder') {
      const folderKey = String(entry.folderKey || '').trim();
      if (!/^[a-f0-9]{16,64}$/i.test(folderKey) || folderKeys.has(folderKey)) throw new Error('invalid-folder-key');
      folderKeys.add(folderKey);
      return { type: 'folder', parentFolder, folderKey, title, order };
    }

    const url = normUrl(String(entry.url || ''));
    if (!url) throw new Error('invalid-url');
    return { type: 'shortcut', parentFolder, url, title, order };
  });

  for (const entry of normalized) {
    if (entry.parentFolder !== ROOT_FOLDER && !folderKeys.has(entry.parentFolder)) throw new Error('missing-parent');
  }
  return normalized;
}

async function importData(file) {
  const text = await file.text();
  const parsed = JSON.parse(text);
  if (parsed?.format !== 'meadow-shortcuts' || parsed?.version !== 1) throw new Error('unsupported-format');
  const entries = validateImportEntries(parsed.entries);
  if (!confirm(`現在の登録内容を置き換えて、${entries.length}件をインポートしますか？`)) return;

  const { st, tx } = await txStore('readwrite');
  st.clear();
  entries.forEach(entry => st.add(entry));
  await new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });

  const url = new URL(location.href);
  url.searchParams.delete('folder');
  history.replaceState(null, '', url.href);
  closeOperationMenu();
  await render();
  toast('インポートしました');
}

addShortcutAction.onclick = () => { closeOperationMenu(); openModal('shortcut'); };
addFolderAction.onclick = () => { closeOperationMenu(); openModal('folder'); };
exportAction.onclick = async () => { closeOperationMenu(); await exportData(); };
importAction.onclick = () => importFile.click();
operationCloseBtn.onclick = closeOperationMenu;
operationWrap.onclick = e => { if (e.target === operationWrap) closeOperationMenu(); };
importFile.addEventListener('change', async () => {
  const file = importFile.files?.[0];
  importFile.value = '';
  if (!file) return;
  try {
    await importData(file);
  } catch (error) {
    console.error(error);
    toast('インポートに失敗しました');
  }
});

nameInput.addEventListener('input', () => { nameWasEdited = true; });
urlInput.addEventListener('input', () => {
  if (!nameWasEdited || !nameInput.value.trim()) {
    const title = suggestedTitle(urlInput.value);
    if (title) nameInput.value = title;
  }
});
urlInput.addEventListener('blur', () => {
  if (!nameInput.value.trim()) nameInput.value = suggestedTitle(urlInput.value);
});

okBtn.onclick = async () => {
  const name = nameInput.value.trim();

  if (editingId) {
    const editedMode = modalMode;
    await renameEntry(editingId, name || '名称未設定');
    closeModal();
    await render();
    toast(editedMode === 'folder' ? 'フォルダ名を更新しました' : 'タイトルを更新しました');
    return;
  }

  if (modalMode === 'folder') {
    await addFolder(name);
    closeModal();
    await render();
    toast('フォルダを追加しました');
    return;
  }

  const url = urlInput.value.trim();
  if (!url) { urlInput.focus(); return; }
  try {
    const added = await addShortcut(url, name);
    if (added === null) {
      toast('同じURLがこのフォルダにあります');
      return;
    }
    closeModal();
    await render();
    toast('ショートカットを追加しました');
  } catch {
    toast('追加に失敗しました');
  }
};

cancelBtn.onclick = () => closeModal();
modalWrap.onclick = e => { if (e.target === modalWrap) closeModal(); };
document.addEventListener('click', e => {
  if (!editMode) return;
  if (!e.target.closest('.tile') && !e.target.closest('.modalWrap')) exitEditMode();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (operationWrap.style.display === 'grid') closeOperationMenu();
    else if (modalWrap.style.display === 'grid') closeModal();
    else exitEditMode();
  }
});
document.addEventListener('pointerdown', () => { if (editMode) resetEditTimer(); });

const searchForm = document.getElementById('searchForm');
const qInput = document.getElementById('q');

function isLikelyUrl(value) {
  if (!value) return false;
  const v = value.trim();
  if (/^https?:\/\//i.test(v)) return true;
  return /^([a-z0-9-]+\.)+[a-z]{2,}(?:[\/?#].*)?$/i.test(v)
    || /^(\d{1,3}\.){3}\d{1,3}(?:[:\/?#].*)?$/.test(v)
    || /^localhost(?:[:\/?#].*)?$/i.test(v);
}

searchForm.addEventListener('submit', async e => {
  e.preventDefault();
  const raw = qInput.value.trim();
  if (!raw) return;

  if (isLikelyUrl(raw)) {
    const target = normUrl(raw);
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3000);
      await fetch(target, { mode: 'no-cors', method: 'GET', signal: ctrl.signal });
      clearTimeout(timer);
      location.href = target;
    } catch {
      location.href = `https://www.google.com/search?q=${encodeURIComponent(raw)}`;
    }
  } else {
    location.href = `https://www.google.com/search?q=${encodeURIComponent(raw)}`;
  }
});

(async () => {
  await openDB();
  await render();
})();

window.addEventListener('load', () => qInput.focus());
</script>
