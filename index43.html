<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リンクを開く</title>
<style>
@layer base, layout;
@layer base {
  html, body { margin: 0; min-height: 100%; background: #fff; color: #222; font-family: system-ui, sans-serif; }
  button, input { font: inherit; }
}
@layer layout {
  main { max-width: 680px; margin: 12vh auto 0; padding: 24px; }
  label { display: block; margin-bottom: 12px; }
  input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #aaa; border-radius: 6px; }
  button { margin-top: 12px; padding: 10px 18px; border: 1px solid #888; border-radius: 6px; background: #f5f5f5; cursor: pointer; }
  #status { font-size: .9rem; }
  [hidden] { display: none; }
}
</style>
</head>
<body>
<main id="editor" hidden>
  <label for="target">URLを入力</label>
  <input id="target" type="text" autocomplete="off" spellcheck="false" placeholder="file://">
  <button id="copy" type="button">共有リンクをコピー</button>
  <p id="status" aria-live="polite"></p>
</main>
<script>
(() => {
  const prefix = '#wanted=';
  if (location.hash.startsWith(prefix)) {
    // 指定先を別タブで開くことを試みます。ブラウザのローカルリソース制限は解除できません。
    const target = decodeURIComponent(location.hash.slice(prefix.length));
    if (target.startsWith('file://')) {
      window.open(target, '_blank', 'noopener,noreferrer');
    }
    return;
  }
  const editor = document.getElementById('editor');
  editor.hidden = false;
  document.getElementById('copy').addEventListener('click', async () => {
    const value = document.getElementById('target').value.trim();
    const status = document.getElementById('status');
    if (!value.startsWith('file://')) {
      status.textContent = 'file:// で始まるURLを入力してください。';
      return;
    }
    const url = `${location.origin}${location.pathname}${prefix}${encodeURI(value)}`;
    try {
      await navigator.clipboard.writeText(url);
      status.textContent = '共有リンクをコピーしました。';
    } catch {
      status.textContent = 'コピーできませんでした。';
    }
  });
})();
</script>
</body>
</html>
