<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d6b5b"><title>ニュース</title><style>
@layer reset,base,components,responsive;@layer reset{*,*::before,*::after{box-sizing:border-box}button{font:inherit}}@layer base{:root{color-scheme:light;--ink:#18332e;--muted:#6c817c;--brand:#0d6b5b;--line:#e5eeeb;--bg:#f3f8f6}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(145deg,#e9f5f1,var(--bg) 48%,#eef4f8);line-height:1.5}button{color:inherit}}@layer components{.page{width:min(760px,100%);min-height:100svh;margin:auto;padding:clamp(20px,5vw,48px) 14px}.header{margin-bottom:20px}.eyebrow{margin:0 0 4px;color:var(--brand);font-size:12px;font-weight:800;letter-spacing:.12em}h1{margin:0;font-size:clamp(26px,6vw,38px);letter-spacing:-.04em}.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid #d5e4df;border-radius:999px;padding:8px 14px;background:#fff;color:#45655e;font-size:13px;font-weight:750;cursor:pointer}.tab[aria-selected=true]{border-color:var(--brand);background:var(--brand);color:#fff}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(26,75,65,.08)}.status{padding:24px;color:var(--muted);text-align:center;font-size:14px}.article{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--line);text-decoration:none}.article:last-child{border-bottom:0}.article:hover{background:#f7fbfa}.article-title{display:-webkit-box;overflow:hidden;color:var(--ink);font-size:15px;font-weight:750;line-height:1.55;-webkit-box-orient:vertical;-webkit-line-clamp:2}.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;color:var(--muted);font-size:11px}.arrow{color:#8ba69e;font-size:22px}.footer{margin:14px 2px 0;color:var(--muted);font-size:11px;text-align:right}}@layer responsive{@media(max-width:480px){.page{padding-top:26px}.header{margin-bottom:15px}.article{padding:14px 12px}.article-title{font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}}
</style></head><body><main class="page"><header class="header"><p class="eyebrow">TODAY'S HEADLINES</p><h1>ニュース</h1></header><nav class="tabs" id="tabs" aria-label="ニュースカテゴリ"></nav><section class="card" id="list" aria-live="polite"><p class="status">ニュースを読み込んでいます…</p></section><p class="footer">Google ニュースの見出しを表示しています</p></main><script>
const categories={top:['トップ',''],nation:['国内','NATION'],world:['国際','WORLD'],business:['経済','BUSINESS'],technology:['テクノロジー','TECHNOLOGY'],entertainment:['エンタメ','ENTERTAINMENT'],sports:['スポーツ','SPORTS']},DB_NAME='news-lite',STORE='by-category',TTL=300000,requests=new Map();let db,current=localStorage.getItem('news-category')||'top';const tabs=document.getElementById('tabs'),list=document.getElementById('list');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){if(db)return db;db=new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'category'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return db}
async function readCache(category){try{return await new Promise(async(resolve,reject)=>{const r=(await openDB()).transaction(STORE).objectStore(STORE).get(category);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch{return null}}
async function writeCache(category,items){try{const t=(await openDB()).transaction(STORE,'readwrite');t.objectStore(STORE).put({category,savedAt:Date.now(),items});await new Promise((resolve,reject)=>{t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}catch{}}
function drawTabs(){tabs.innerHTML=Object.entries(categories).map(([key,[label]])=>`<button class="tab" type="button" data-key="${key}" aria-selected="${key===current}">${label}</button>`).join('')}
function dateText(value){const d=new Date(value);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}
function titleParts(title){const m=String(title||'').match(/^(.*)\s+-\s+([^\-]+)$/);return m?[m[1].trim(),m[2].trim()]:[String(title||'タイトルなし'),'']}
function draw(items){if(!items.length){list.innerHTML='<p class="status">現在表示できる記事がありません。</p>';return}list.innerHTML=items.map(item=>{const [title,source]=titleParts(item.title),date=dateText(item.pubDate);return `<a class="article" href="${esc(item.link||'#')}" target="_blank" rel="noopener noreferrer"><span><span class="article-title">${esc(title)}</span><span class="meta">${source?`<span>${esc(source)}</span>`:''}${date?`<time>${date}</time>`:''}</span></span><span class="arrow" aria-hidden="true">›</span></a>`}).join('')}
async function load(){const key=current;if(requests.has(key))return requests.get(key);const task=(async()=>{const cached=await readCache(key);if(cached?.items?.length){draw(cached.items);if(Date.now()-cached.savedAt<TTL)return}else list.innerHTML='<p class="status">ニュースを読み込んでいます…</p>';try{const code=categories[key][1],rss=`https://news.google.com/rss${code?`/headlines/section/topic/${code}`:''}?hl=ja&gl=JP&ceid=JP:ja`,response=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rss)}`,{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();if(data.status!=='ok'||!Array.isArray(data.items))throw Error();const items=data.items.slice(0,12);await writeCache(key,items);if(key===current)draw(items)}catch{if(!cached?.items?.length)list.innerHTML='<p class="status">ニュースを読み込めませんでした。</p>'}})();requests.set(key,task);try{return await task}finally{requests.delete(key)}}
tabs.onclick=e=>{const button=e.target.closest('[data-key]');if(!button)return;current=button.dataset.key;localStorage.setItem('news-category',current);drawTabs();load()};drawTabs();load();
</script></body></html>
