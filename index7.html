<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML整理専用ツール</title>
<style>
@layer base, components, utilities;
@layer base {
  :root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--soft:#667085;--line:#dbe3ee;--accent:#5b67d8;--accent2:#b56fa7;--ok:#16794f;--warn:#a66319;--danger:#b42318;--shadow:0 18px 48px rgba(16,24,40,.10);--radius:22px}
  *{box-sizing:border-box}
  html{min-height:100%;background:linear-gradient(180deg,#f7f9ff,#f3f6fb 55%,#f8f5fb)}
  body{margin:0;min-width:320px;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;background:transparent}
  button,input{font:inherit}
  button{cursor:pointer}
}
@layer components {
  .shell{width:min(900px,calc(100% - 28px));margin:0 auto;padding:34px 0 56px}
  .header{padding:8px 4px 24px}
  .header-mark{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#6877e8,#be79ad);color:#fff;font-weight:900;box-shadow:0 10px 24px rgba(91,103,216,.20)}
  h1{margin:16px 0 8px;font-size:clamp(28px,6vw,46px);letter-spacing:-.04em}
  .lead{margin:0;max-width:700px;color:var(--soft);font-size:14px;line-height:1.8}
  .card{padding:22px;border:1px solid rgba(148,163,184,.22);border-radius:var(--radius);background:rgba(255,255,255,.96);box-shadow:var(--shadow)}
  .drop-zone{position:relative;display:grid;place-items:center;min-height:260px;padding:28px;border:2px dashed #c8d2e1;border-radius:20px;background:linear-gradient(180deg,#fbfdff,#f7f9fd);text-align:center;transition:border-color .16s ease,transform .16s ease,background .16s ease}
  .drop-zone.is-dragging{border-color:#6f79df;background:#f4f3ff;transform:translateY(-1px)}
  .drop-zone input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .drop-icon{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,#eef0ff,#f9edf5);font-size:28px;color:#5b67d8}
  .drop-title{font-size:18px;font-weight:900}
  .drop-sub{margin-top:7px;color:var(--soft);font-size:12px;line-height:1.7}
  .options{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .option{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#475467;font-size:12px;font-weight:800}
  .option input{accent-color:#5b67d8}
  .notice{margin:14px 2px 0;color:#667085;font-size:11px;line-height:1.65}
  .notice strong{color:#344054}
  .results{display:grid;gap:12px;margin-top:18px}
  .result{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
  .result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .result-name{min-width:0;font-size:13px;font-weight:900;word-break:break-all}
  .result-meta{margin-top:5px;color:var(--soft);font-size:11px;line-height:1.6}
  .badge{flex:0 0 auto;padding:5px 8px;border-radius:999px;background:#ecfdf3;color:var(--ok);font-size:10px;font-weight:900}
  .badge.warn{background:#fff7ed;color:var(--warn)}
  .badge.error{background:#fef3f2;color:var(--danger)}
  .result-actions{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}
  .download-btn,.retry-btn,.clear-btn{min-height:42px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-weight:900}
  .download-btn{background:linear-gradient(90deg,#6674e5,#b976a9);color:#fff;border-color:transparent}
  .retry-btn,.clear-btn{background:#fff;color:#344054}
  .toolbar{display:flex;justify-content:flex-end;margin-top:14px}
  .status{min-height:22px;margin-top:14px;color:#475467;font-size:12px;font-weight:700;line-height:1.6;white-space:pre-wrap}
  .status.error{color:var(--danger)}
  @media(max-width:600px){.shell{width:min(100% - 20px,900px);padding-top:18px}.card{padding:14px;border-radius:18px}.drop-zone{min-height:230px;padding:22px 16px}.result-actions{grid-template-columns:1fr}.retry-btn{width:100%}}
}
@layer utilities {
  .hidden{display:none}
}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div class="header-mark" aria-hidden="true">H</div>
    <h1>HTML整理専用</h1>
    <p class="lead">HTMLファイルをドラッグ＆ドロップすると、元の整理サイトと同じHTML/CSS/JavaScript整理アルゴリズムで処理し、自動ダウンロードを試みます。自動保存が止められた場合は、結果欄のダウンロードボタンから保存できます。</p>
  </header>

  <section class="card" aria-label="HTML整理">
    <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="HTMLファイルを追加">
      <input id="fileInput" type="file" accept=".html,.htm,text/html" multiple>
      <div>
        <div class="drop-icon" aria-hidden="true">⇩</div>
        <div class="drop-title">HTMLをここへドロップ</div>
        <div class="drop-sub">クリックして選択もできます<br>.html / .htm・複数ファイル対応</div>
      </div>
    </div>

    <div class="options" aria-label="整理設定">
      <label class="option"><input id="whitespaceToggle" type="checkbox" checked> 空白を整理</label>
      <label class="option"><input id="commentToggle" type="checkbox" checked> HTML / CSSコメントを削除</label>
      <label class="option"><input id="autoDownloadToggle" type="checkbox" checked> 整理後に自動ダウンロード</label>
    </div>
    <p class="notice"><strong>安全対策:</strong> JavaScriptの <code>//</code> 行コメントは後続コードと同じ行へ連結しません。ブラウザが複数ダウンロードや自動ダウンロードを制限した場合でも、結果はページ内に保持され、手動ダウンロードできます。</p>
    <div class="toolbar"><button id="clearBtn" class="clear-btn hidden" type="button">結果を消去</button></div>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="results" class="results"></div>
  </section>
</main>
<script>
"use strict";
(() => {
  const state = { compactWhitespace: true, removeMarkupComments: true, autoDownload: true, results: [] };
  const VOID_HTML_TAGS = new Set(["area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"]);
  const $ = (selector) => document.querySelector(selector);
  const dropZone = $("#dropZone");
  const fileInput = $("#fileInput");
  const resultsEl = $("#results");
  const statusEl = $("#status");
  const clearBtn = $("#clearBtn");

  function extensionOf(name) {
    const parts = String(name || "").toLowerCase().split(".");
    return parts.length > 1 ? parts[parts.length - 1] : "";
  }

  function normalizeText(value) {
    return String(value || "").replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  }

  function trimLines(value, removeEmptyLines) {
    const lines = normalizeText(value).split("\n").map((line) => line.trim());
    return (removeEmptyLines ? lines.filter(Boolean) : lines).join("\n");
  }

  function compactCss(value, removeComments, compactWhitespace) {
    let compacted = trimLines(value, compactWhitespace);
    if (removeComments) compacted = compacted.replace(/\/\*[\s\S]*?\*\//g, "");
    if (compactWhitespace) {
      compacted = compacted.replace(/[ \t]+/g, " ").replace(/\s*([{}:;,])\s*/g, "$1").trim();
    }
    return compacted;
  }

  function compactCssOneRule(value) {
    const css = compactCss(value, state.removeMarkupComments, state.compactWhitespace);
    if (!state.compactWhitespace || !css) return css;
    const containerAtRules = /^(?:@media|@supports|@layer|@container|@document|@scope|@keyframes|-webkit-keyframes|-moz-keyframes)\b/i;

    const findMatchingBrace = (source, openIndex) => {
      let depth = 0, quote = "", escaped = false;
      for (let index = openIndex; index < source.length; index += 1) {
        const character = source[index];
        if (quote) {
          if (escaped) escaped = false;
          else if (character === "\\") escaped = true;
          else if (character === quote) quote = "";
          continue;
        }
        if (character === "'" || character === '"') { quote = character; escaped = false; continue; }
        if (character === "{") depth += 1;
        else if (character === "}") { depth -= 1; if (depth === 0) return index; }
      }
      return -1;
    };

    const formatBlock = (source) => {
      const lines = [];
      let index = 0;
      while (index < source.length) {
        while (index < source.length && /\s/.test(source[index])) index += 1;
        if (index >= source.length) break;
        let quote = "", escaped = false, delimiterIndex = -1, delimiter = "";
        for (let cursor = index; cursor < source.length; cursor += 1) {
          const character = source[cursor];
          if (quote) {
            if (escaped) escaped = false;
            else if (character === "\\") escaped = true;
            else if (character === quote) quote = "";
            continue;
          }
          if (character === "'" || character === '"') { quote = character; escaped = false; continue; }
          if (character === "{" || character === ";") { delimiterIndex = cursor; delimiter = character; break; }
        }
        if (delimiterIndex < 0) { const tail = source.slice(index).trim(); if (tail) lines.push(tail); break; }
        if (delimiter === ";") { const statement = source.slice(index, delimiterIndex + 1).trim(); if (statement) lines.push(statement); index = delimiterIndex + 1; continue; }
        const header = source.slice(index, delimiterIndex).trim();
        const closeIndex = findMatchingBrace(source, delimiterIndex);
        if (closeIndex < 0) { const tail = source.slice(index).trim(); if (tail) lines.push(tail); break; }
        const body = source.slice(delimiterIndex + 1, closeIndex).trim();
        if (containerAtRules.test(header)) {
          lines.push(header + "{");
          const nested = formatBlock(body);
          if (nested) lines.push(nested);
          lines.push("}");
        } else {
          lines.push(header + "{" + body + "}");
        }
        index = closeIndex + 1;
      }
      return lines.join("\n");
    };
    return formatBlock(css);
  }

  function nestBraceCode(value, splitSemicolons = false) {
    const normalized = normalizeText(value).trim();
    if (!normalized) return "";
    const lines = [];
    let buffer = "", depth = 0, quote = "", escaped = false, lineComment = false, blockComment = false;
    const pushLine = (text, lineDepth = depth) => { const trimmed = text.trim(); if (trimmed) lines.push("  ".repeat(Math.max(0, lineDepth)) + trimmed); };
    const flush = () => { pushLine(buffer, depth); buffer = ""; };

    for (let index = 0; index < normalized.length; index += 1) {
      const character = normalized[index];
      const next = normalized[index + 1] || "";
      if (lineComment) {
        buffer += character;
        if (character === "\n") { lineComment = false; flush(); }
        continue;
      }
      if (blockComment) {
        buffer += character;
        if (character === "*" && next === "/") { buffer += "/"; index += 1; blockComment = false; }
        continue;
      }
      if (quote) {
        buffer += character;
        if (escaped) escaped = false;
        else if (character === "\\") escaped = true;
        else if (character === quote) quote = "";
        if (character === "\n" && quote !== "`") flush();
        continue;
      }
      if (character === "/" && next === "/") { buffer += "//"; index += 1; lineComment = true; continue; }
      if (character === "/" && next === "*") { buffer += "/*"; index += 1; blockComment = true; continue; }
      if (["'", '"', "`"].includes(character)) { quote = character; escaped = false; buffer += character; continue; }
      if (/^}[,;,)\]]*$/.test(buffer.trim()) && !/[\s;,)\]]/.test(character)) flush();
      if (character === "{") { pushLine(buffer + "{", depth); buffer = ""; depth += 1; continue; }
      if (character === "}") { flush(); depth = Math.max(0, depth - 1); buffer = "}"; continue; }
      if (splitSemicolons && character === ";") { pushLine(buffer + ";", depth); buffer = ""; continue; }
      if (character === "\n") { flush(); continue; }
      buffer += character;
    }
    flush();
    return lines.join("\n");
  }

  function compactFunctionCode(value) {
    const nested = nestBraceCode(value);
    const sourceLines = nested.split("\n").map((line) => line.trim()).filter(Boolean);
    if (!sourceLines.length) return "";
    const output = [];
    let current = "", inNamedFunction = false, functionDepth = 0, quote = "", escaped = false, blockComment = false;
    const append = (line) => { current += (current ? " " : "") + line; };
    const flush = () => { const trimmed = current.trim(); if (trimmed) output.push(trimmed); current = ""; };
    const startsNamedFunction = (line) => /^(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(/.test(line);
    const hasLineComment = (line) => {
      let localQuote = "", localEscaped = false, localBlock = false;
      for (let index = 0; index < line.length; index += 1) {
        const ch = line[index], next = line[index + 1] || "";
        if (localBlock) { if (ch === "*" && next === "/") { localBlock = false; index += 1; } continue; }
        if (localQuote) { if (localEscaped) localEscaped = false; else if (ch === "\\") localEscaped = true; else if (ch === localQuote) localQuote = ""; continue; }
        if (ch === "/" && next === "*") { localBlock = true; index += 1; continue; }
        if (ch === "/" && next === "/") return true;
        if (["'", '"', "`"].includes(ch)) localQuote = ch;
      }
      return false;
    };
    const braceDelta = (line) => {
      let delta = 0, lineComment = false;
      for (let index = 0; index < line.length; index += 1) {
        const character = line[index], next = line[index + 1] || "";
        if (lineComment) break;
        if (blockComment) { if (character === "*" && next === "/") { blockComment = false; index += 1; } continue; }
        if (quote) { if (escaped) escaped = false; else if (character === "\\") escaped = true; else if (character === quote) quote = ""; continue; }
        if (character === "/" && next === "/") { lineComment = true; break; }
        if (character === "/" && next === "*") { blockComment = true; index += 1; continue; }
        if (["'", '"', "`"].includes(character)) { quote = character; escaped = false; continue; }
        if (character === "{") delta += 1; else if (character === "}") delta -= 1;
      }
      return delta;
    };

    for (const line of sourceLines) {
      const namedFunctionStart = startsNamedFunction(line);
      if (namedFunctionStart && !inNamedFunction) { flush(); inNamedFunction = true; functionDepth = 0; }
      append(line);
      const delta = braceDelta(line);
      if (inNamedFunction) {
        functionDepth += delta;
        if (hasLineComment(line)) flush();
        if (functionDepth <= 0 && /}/.test(line)) { flush(); inNamedFunction = false; functionDepth = 0; }
      } else if (hasLineComment(line)) {
        flush();
      }
    }
    flush();
    return output.join("\n");
  }

  function nestMarkup(value) {
    let normalized = normalizeText(value).trim();
    if (!normalized) return "";
    const specialBlocks = [];
    normalized = normalized.replace(/<(script|style)\b([^>]*)>([\s\S]*?)<\/\1\s*>/gi, (all, tagName, attrs, body) => {
      const name = tagName.toLowerCase();
      const formattedBody = name === "script" ? compactFunctionCode(body) : compactCssOneRule(body);
      const marker = "\u0005" + specialBlocks.length + "\u0006";
      specialBlocks.push("<" + tagName + attrs + ">\n" + formattedBody + "\n</" + tagName + ">");
      return marker;
    });
    const tokens = [];
    let text = "";
    const pushText = () => { if (text) tokens.push({ type: "text", value: text }); text = ""; };
    for (let index = 0; index < normalized.length;) {
      if (normalized[index] !== "<") { text += normalized[index]; index += 1; continue; }
      const next = normalized[index + 1] || "";
      if (!/[A-Za-z/!?]/.test(next)) { text += "<"; index += 1; continue; }
      if (normalized.startsWith("<!--", index)) {
        const commentEnd = normalized.indexOf("-->", index + 4);
        if (commentEnd < 0) { text += normalized.slice(index); break; }
        pushText(); tokens.push({ type: "tag", value: normalized.slice(index, commentEnd + 3) }); index = commentEnd + 3; continue;
      }
      let quote = "", end = index + 1;
      for (; end < normalized.length; end += 1) {
        const character = normalized[end];
        if (quote) { if (character === quote && normalized[end - 1] !== "\\") quote = ""; }
        else if (["'", '"'].includes(character)) quote = character;
        else if (character === ">") break;
      }
      if (end >= normalized.length) { text += normalized.slice(index); break; }
      pushText(); tokens.push({ type: "tag", value: normalized.slice(index, end + 1) }); index = end + 1;
    }
    pushText();
    const lines = [];
    let depth = 0;
    const push = (value, lineDepth = depth) => { const trimmed = value.trim(); if (trimmed) lines.push("  ".repeat(Math.max(0, lineDepth)) + trimmed); };
    for (const token of tokens) {
      if (token.type === "text") { push(token.value.replace(/\s+/g, " "), depth); continue; }
      const tag = token.value.trim();
      const closing = /^<\//.test(tag), commentOrDeclaration = /^<!--|^<!|^<\?/.test(tag), selfClosing = /\/\s*>$/.test(tag);
      const nameMatch = /^<\/?([A-Za-z][\w:-]*)/.exec(tag);
      const tagName = nameMatch ? nameMatch[1].toLowerCase() : "";
      if (closing) depth = Math.max(0, depth - 1);
      push(tag, depth);
      if (!closing && !commentOrDeclaration && !selfClosing && !VOID_HTML_TAGS.has(tagName)) depth += 1;
    }
    return lines.join("\n").replace(/\u0005(\d+)\u0006/g, (_, index) => specialBlocks[Number(index)] || "");
  }

  function protectBlocks(value) {
    const protectedBlocks = [];
    const protectedText = value.replace(/<(pre|textarea|script|style)\b[^>]*>[\s\S]*?<\/\1>/gi, (block) => {
      const marker = "\u0001" + protectedBlocks.length + "\u0002";
      protectedBlocks.push(block);
      return marker;
    });
    return { protectedBlocks, protectedText };
  }

  function restoreBlocks(value, protectedBlocks) {
    return value.replace(/\u0001(\d+)\u0002/g, (_, index) => protectedBlocks[Number(index)] || "");
  }

  function compactMarkup(value, removeComments) {
    const blocks = protectBlocks(normalizeText(value));
    let compacted = blocks.protectedText.split("\n").map((line) => line.trim()).filter(Boolean).join("");
    if (removeComments) compacted = compacted.replace(/<!--[\s\S]*?-->/g, "");
    return restoreBlocks(compacted.replace(/>\s+</g, "><").replace(/[ \t]{2,}/g, " ").trim(), blocks.protectedBlocks);
  }

  function compactHtml(value) {
    const compacted = compactMarkup(value, state.removeMarkupComments);
    return state.compactWhitespace ? nestMarkup(compacted) : compacted;
  }

  function safeOutputName(name) {
    const base = String(name || "output.html").replace(/\.(?:html?|HTML?)$/, "");
    return base + "_compressed.html";
  }

  function formatBytes(bytes) {
    if (bytes < 1000) return bytes + " B";
    if (bytes < 1000000) return (bytes / 1000).toFixed(bytes < 10000 ? 1 : 0) + " KB";
    return (bytes / 1000000).toFixed(1) + " MB";
  }

  function downloadText(content, fileName) {
    const blob = new Blob([content], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = fileName;
    anchor.style.display = "none";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function renderResults() {
    resultsEl.innerHTML = "";
    state.results.forEach((item, index) => {
      const card = document.createElement("article");
      card.className = "result";
      const top = document.createElement("div"); top.className = "result-top";
      const copy = document.createElement("div");
      const name = document.createElement("div"); name.className = "result-name"; name.textContent = item.outputName;
      const meta = document.createElement("div"); meta.className = "result-meta";
      const reduction = item.beforeBytes > 0 ? Math.max(0, Math.round((1 - item.afterBytes / item.beforeBytes) * 100)) : 0;
      meta.textContent = `${formatBytes(item.beforeBytes)} → ${formatBytes(item.afterBytes)} / 約${reduction}%削減`;
      copy.append(name, meta);
      const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = "整理済み";
      top.append(copy, badge);
      const actions = document.createElement("div"); actions.className = "result-actions";
      const download = document.createElement("button"); download.type = "button"; download.className = "download-btn"; download.textContent = "ダウンロード";
      download.addEventListener("click", () => downloadText(item.content, item.outputName));
      const retry = document.createElement("button"); retry.type = "button"; retry.className = "retry-btn"; retry.textContent = "再ダウンロード";
      retry.addEventListener("click", () => downloadText(item.content, item.outputName));
      actions.append(download, retry);
      card.append(top, actions);
      resultsEl.appendChild(card);
    });
    clearBtn.classList.toggle("hidden", state.results.length === 0);
  }

  async function processFiles(fileList) {
    const files = Array.from(fileList || []);
    const htmlFiles = files.filter((file) => ["html", "htm"].includes(extensionOf(file.name)) || file.type === "text/html");
    const rejected = files.length - htmlFiles.length;
    if (!htmlFiles.length) {
      statusEl.className = "status error";
      statusEl.textContent = "HTMLファイル（.html / .htm）を選択してください。";
      return;
    }
    statusEl.className = "status";
    statusEl.textContent = "整理中...";
    const newResults = [];
    for (const file of htmlFiles) {
      try {
        const source = await file.text();
        const compressed = compactHtml(source);
        newResults.push({
          sourceName: file.name,
          outputName: safeOutputName(file.name),
          content: compressed,
          beforeBytes: new Blob([source]).size,
          afterBytes: new Blob([compressed]).size
        });
      } catch (error) {
        console.error(error);
      }
    }
    state.results = newResults;
    renderResults();
    const suffix = rejected ? `\nHTML以外の${rejected}件は無視しました。` : "";
    statusEl.textContent = `${newResults.length}件を整理しました。${state.autoDownload ? "自動ダウンロードを試みます。" : "結果欄からダウンロードできます。"}${suffix}`;
    if (state.autoDownload) {
      newResults.forEach((item, index) => {
        window.setTimeout(() => downloadText(item.content, item.outputName), index * 180);
      });
    }
  }

  function pickFiles() { fileInput.click(); }
  dropZone.addEventListener("click", (event) => { if (event.target === fileInput) return; pickFiles(); });
  dropZone.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); pickFiles(); } });
  dropZone.addEventListener("dragenter", (event) => { event.preventDefault(); dropZone.classList.add("is-dragging"); });
  dropZone.addEventListener("dragover", (event) => { event.preventDefault(); dropZone.classList.add("is-dragging"); });
  dropZone.addEventListener("dragleave", (event) => { if (event.currentTarget === event.target) dropZone.classList.remove("is-dragging"); });
  dropZone.addEventListener("drop", (event) => { event.preventDefault(); dropZone.classList.remove("is-dragging"); processFiles(event.dataTransfer.files); });
  fileInput.addEventListener("change", () => { processFiles(fileInput.files); fileInput.value = ""; });
  $("#whitespaceToggle").addEventListener("change", (event) => { state.compactWhitespace = event.currentTarget.checked; });
  $("#commentToggle").addEventListener("change", (event) => { state.removeMarkupComments = event.currentTarget.checked; });
  $("#autoDownloadToggle").addEventListener("change", (event) => { state.autoDownload = event.currentTarget.checked; });
  clearBtn.addEventListener("click", () => { state.results = []; renderResults(); statusEl.textContent = ""; });
})();
</script>
