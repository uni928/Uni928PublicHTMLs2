<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>シンプル円グラフメーカー</title>
<style>
@layer reset, base, layout, components, responsive;

@layer reset {
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  button, input { font: inherit; }
}

@layer base {
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #16181d;
    --muted: #737984;
    --line: #e2e5e9;
    --line-strong: #cfd4da;
    --soft: #f8f9fa;
    --accent: #25282e;
    --danger: #9f3b3b;
    --radius: 16px;
    --shadow: 0 8px 28px rgba(24, 28, 35, .07);
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }

  button {
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--text);
    border-radius: 10px;
    padding: 9px 13px;
    cursor: pointer;
  }

  button:hover { background: var(--soft); }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    background: #fff;
    color: var(--text);
    padding: 9px 10px;
    outline: none;
  }

  input:focus {
    border-color: #8d949e;
    box-shadow: 0 0 0 3px rgba(70, 78, 90, .09);
  }
}

@layer layout {
  .app {
    width: min(1280px, calc(100% - 32px));
    margin: 0 auto;
    padding: 26px 0 36px;
  }

  .header {
    margin-bottom: 18px;
  }

  .header h1 {
    margin: 0 0 4px;
    font-size: clamp(22px, 3vw, 30px);
    letter-spacing: -.03em;
  }

  .header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .workspace {
    display: grid;
    grid-template-columns: minmax(390px, .9fr) minmax(520px, 1.35fr);
    gap: 18px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .editor {
    padding: 16px;
  }

  .preview {
    position: sticky;
    top: 18px;
    padding: 14px;
  }
}

@layer components {
  .chart-copy {
    display: grid;
    gap: 9px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .chart-copy label {
    display: grid;
    gap: 5px;
  }

  .chart-copy span {
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .04em;
  }

  .chart-copy input {
    font-weight: 600;
    letter-spacing: .01em;
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .section-title h2 {
    margin: 0;
    font-size: 16px;
  }

  .small {
    color: var(--muted);
    font-size: 12px;
  }

  .rows {
    display: grid;
    gap: 9px;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(140px, 1.6fr) 82px auto auto;
    gap: 7px;
    align-items: center;
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
  }

  .row-head {
    display: grid;
    grid-template-columns: minmax(140px, 1.6fr) 82px auto auto;
    gap: 7px;
    padding: 0 9px 5px;
    color: var(--muted);
    font-size: 11px;
  }

  .explode {
    display: grid;
    place-items: center;
    min-width: 54px;
    gap: 2px;
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
  }

  .explode input {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
  }

  .remove {
    width: 34px;
    height: 34px;
    padding: 0;
    border-color: transparent;
    color: var(--muted);
    font-size: 18px;
  }

  .remove:hover {
    color: var(--danger);
    background: #fff4f4;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .primary:hover { background: #353941; }

  .total-value-wrap {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-width: min(260px, 100%);
    color: var(--muted);
    font-size: 12px;
  }

  .total-value-wrap input {
    width: 170px;
    min-width: 120px;
  }

  .summary {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 11px;
    background: var(--soft);
    color: var(--muted);
    font-size: 13px;
  }

  .summary strong { color: var(--text); }

  .summary.warning {
    background: #fff6e7;
    color: #7d5b21;
  }

  .chart-wrap {
    width: 100%;
    aspect-ratio: 1.18 / 1;
    min-height: 520px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 12px;
    background:
      radial-gradient(circle at 50% 48%, #fff 0, #fff 47%, #fbfbfc 100%);
  }

  #chart {
    width: 100%;
    height: 100%;
    display: block;
  }

  .preview-tools {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .svg-title {
    font-size: 26px;
    font-weight: 760;
    letter-spacing: -.025em;
    fill: #15171b;
  }

  .svg-subtitle {
    font-size: 13px;
    font-weight: 520;
    letter-spacing: .015em;
    fill: #747a83;
  }

  .slice-label {
    font-size: 14px;
    font-weight: 720;
    letter-spacing: -.01em;
    fill: #16181c;
    paint-order: stroke;
    stroke: rgba(255,255,255,.94);
    stroke-width: 3.4px;
    stroke-linejoin: round;
  }

  .slice-sub {
    font-size: 11.5px;
    font-weight: 590;
    letter-spacing: .01em;
    fill: #555b64;
    paint-order: stroke;
    stroke: rgba(255,255,255,.95);
    stroke-width: 3.2px;
    stroke-linejoin: round;
  }

  .leader {
    fill: none;
    stroke: #555b64;
    stroke-width: 1.15;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .8;
  }

  .empty-text {
    fill: #8b919a;
    font-size: 15px;
  }
}

@layer responsive {
  @media (max-width: 920px) {
    .workspace { grid-template-columns: 1fr; }
    .preview { position: static; }
    .chart-wrap { min-height: 460px; }
  }

  @media (max-width: 610px) {
    .app {
      width: min(100% - 18px, 1280px);
      padding-top: 16px;
    }

    .editor { padding: 12px; }

    .row-head { display: none; }

    .row {
      grid-template-columns: 1fr 70px;
      gap: 7px;
    }

    .row .name { grid-column: 1 / -1; }
    .row .value { grid-column: 1 / 2; }
    .row .explode {
      grid-column: 2;
      grid-row: 2;
      align-self: stretch;
    }
    .row .remove {
      grid-column: 2;
      grid-row: 1;
      justify-self: end;
    }

    .chart-wrap {
      min-height: 410px;
      aspect-ratio: 1 / 1;
    }
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <h1>円グラフメーカー</h1>
    <p>内容と割合を入力するだけ。狭い項目は自動で外側に表示します。</p>
  </header>

  <div class="workspace">
    <section class="panel editor" aria-label="円グラフ設定">
      <div class="chart-copy">
        <label>
          <span>タイトル</span>
          <input id="chartTitleInput" type="text" value="売上構成" placeholder="例: 売上構成">
        </label>
        <label>
          <span>サブタイトル</span>
          <input id="chartSubtitleInput" type="text" value="2026年度" placeholder="例: 2026年度 / 回答者120人">
        </label>
      </div>

      <div class="section-title">
        <h2>項目</h2>
        <span class="small">％の合計は100推奨</span>
      </div>

      <div class="row-head" aria-hidden="true">
        <span>内容</span>
        <span>％</span>
        <span>切り出し</span>
        <span></span>
      </div>

      <div id="rows" class="rows"></div>

      <div class="toolbar">
        <button id="addBtn" type="button">＋ 項目を追加</button>
        <button id="normalizeBtn" type="button">100％に調整</button>
        <label class="total-value-wrap">
          <span>合計</span>
          <input id="totalValueInput" type="text" value="800円" placeholder="例: 800円 / 120人">
        </label>
      </div>

      <div id="summary" class="summary"></div>
    </section>

    <section class="panel preview" aria-label="円グラフプレビュー">
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 760 640" role="img" aria-label="円グラフ"></svg>
      </div>
      <div class="preview-tools">
        <button id="pngBtn" type="button">PNG保存</button>
        <button id="svgBtn" type="button">SVG保存</button>
      </div>
    </section>
  </div>
</main>

<script>
(() => {
  "use strict";

  const rowsEl = document.getElementById("rows");
  const chart = document.getElementById("chart");
  const summaryEl = document.getElementById("summary");
  const addBtn = document.getElementById("addBtn");
  const normalizeBtn = document.getElementById("normalizeBtn");
  const chartTitleInput = document.getElementById("chartTitleInput");
  const chartSubtitleInput = document.getElementById("chartSubtitleInput");
  const totalValueInput = document.getElementById("totalValueInput");
  const pngBtn = document.getElementById("pngBtn");
  const svgBtn = document.getElementById("svgBtn");

  const palette = [
    "#52677f", "#8d6f64", "#6f8371", "#9a8254",
    "#6e7188", "#8c6674", "#647e82", "#8a8a73",
    "#71849b", "#967a68", "#728c7f", "#8f7590"
  ];

  let items = [
    { name: "項目A", percent: 45, explode: false },
    { name: "項目B", percent: 30, explode: false },
    { name: "項目C", percent: 15, explode: true },
    { name: "項目D", percent: 10, explode: false }
  ];

  function el(name, attrs = {}) {
    const node = document.createElement(name);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    return node;
  }

  function renderRows() {
    rowsEl.innerHTML = "";

    items.forEach((item, index) => {
      const row = el("div", { class: "row" });

      const name = el("input", {
        class: "name",
        type: "text",
        value: item.name,
        placeholder: "内容"
      });

      const percent = el("input", {
        class: "value",
        type: "number",
        min: "0",
        step: "0.1",
        value: item.percent,
        placeholder: "%"
      });

      const explodeLabel = el("label", { class: "explode" });
      const explode = el("input", { type: "checkbox", "aria-label": "円グラフから切り出す" });
      explode.checked = item.explode;
      explodeLabel.append(explode, el("span", { text: "飛び出す" }));

      const remove = el("button", {
        class: "remove",
        type: "button",
        "aria-label": "項目を削除",
        text: "×"
      });

      name.addEventListener("input", () => {
        items[index].name = name.value;
        draw();
      });

      percent.addEventListener("input", () => {
        items[index].percent = Math.max(0, Number(percent.value) || 0);
        draw();
      });

      explode.addEventListener("change", () => {
        items[index].explode = explode.checked;
        draw();
      });

      remove.addEventListener("click", () => {
        items.splice(index, 1);
        renderRows();
        draw();
      });

      row.append(name, percent, explodeLabel, remove);
      rowsEl.append(row);
    });
  }

  function svgNode(tag, attrs = {}, text = "") {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, String(value));
    }
    if (text) node.textContent = text;
    return node;
  }

  function polar(cx, cy, r, angle) {
    const rad = (angle - 90) * Math.PI / 180;
    return {
      x: cx + r * Math.cos(rad),
      y: cy + r * Math.sin(rad)
    };
  }

  function wedgePath(cx, cy, r, start, end) {
    const a = polar(cx, cy, r, start);
    const b = polar(cx, cy, r, end);
    const large = end - start > 180 ? 1 : 0;
    return `M ${cx} ${cy} L ${a.x} ${a.y} A ${r} ${r} 0 ${large} 1 ${b.x} ${b.y} Z`;
  }

  function textBlock(group, x, y, item, anchor = "middle", outside = false) {
    const title = svgNode("text", {
      x, y,
      "text-anchor": anchor,
      class: "slice-label"
    }, item.name.trim() || "名称なし");

    const detailParts = [`${formatPercent(item.percent)}%`];
    const computed = computedValueText(item.percent);
    if (computed) detailParts.push(computed);

    const sub = svgNode("text", {
      x,
      y: y + 18,
      "text-anchor": anchor,
      class: "slice-sub"
    }, detailParts.join("  /  "));

    if (outside) {
      title.setAttribute("stroke-width", "4");
      sub.setAttribute("stroke-width", "4");
    }

    group.append(title, sub);
  }

  function formatPercent(value) {
    return Number.isInteger(value) ? String(value) : String(Math.round(value * 10) / 10);
  }

  function parseTotalValue() {
    const raw = totalValueInput.value.trim();
    if (!raw) return null;

    const match = raw.match(/^\s*([+-]?(?:\d+(?:,\d{3})*|\d*\.\d+))\s*(.*)$/);
    if (!match) return null;

    const number = Number(match[1].replaceAll(",", ""));
    if (!Number.isFinite(number)) return null;

    return { number, suffix: match[2] || "" };
  }

  function computedValueText(percent) {
    const parsed = parseTotalValue();
    if (!parsed) return "";

    const value = parsed.number * percent / 100;
    const rounded = Math.abs(value - Math.round(value)) < 1e-9
      ? String(Math.round(value))
      : String(Math.round(value * 100) / 100);

    return `${rounded}${parsed.suffix}`;
  }

  function draw() {
    chart.innerHTML = "";

    const valid = items.filter(item => item.percent > 0);
    const total = valid.reduce((sum, item) => sum + item.percent, 0);

    summaryEl.classList.toggle("warning", Math.abs(total - 100) > 0.05);
    summaryEl.innerHTML = total
      ? `合計 <strong>${formatPercent(total)}%</strong>${Math.abs(total - 100) > 0.05 ? "　※100％ではありません" : ""}`
      : "割合を入力してください。";

    const chartTitle = chartTitleInput.value.trim();
    const chartSubtitle = chartSubtitleInput.value.trim();

    if (chartTitle) {
      chart.append(svgNode("text", {
        x: 380, y: 38,
        "text-anchor": "middle",
        class: "svg-title"
      }, chartTitle));
    }

    if (chartSubtitle) {
      chart.append(svgNode("text", {
        x: 380, y: chartTitle ? 62 : 44,
        "text-anchor": "middle",
        class: "svg-subtitle"
      }, chartSubtitle));
    }

    if (!total) {
      chart.append(svgNode("text", {
        x: 380, y: 342,
        "text-anchor": "middle",
        class: "empty-text"
      }, "割合を入力すると、ここに円グラフが表示されます"));
      return;
    }

    const cx = 380;
    const cy = 350;
    const radius = 196;
    const explodeDistance = 20;
    let angle = 0;
    const outsideLabels = [];

    valid.forEach((item, visibleIndex) => {
      const sweep = item.percent / total * 360;
      const start = angle;
      const end = angle + sweep;
      const mid = start + sweep / 2;
      const midRad = (mid - 90) * Math.PI / 180;

      const shift = item.explode ? explodeDistance : 0;
      const dx = Math.cos(midRad) * shift;
      const dy = Math.sin(midRad) * shift;
      const localCx = cx + dx;
      const localCy = cy + dy;

      const group = svgNode("g");
      group.append(svgNode("path", {
        d: wedgePath(localCx, localCy, radius, start, end),
        fill: palette[visibleIndex % palette.length],
        stroke: "#ffffff",
        "stroke-width": "3",
        "stroke-linejoin": "round"
      }));

      const arcLength = radius * (sweep * Math.PI / 180);
      const inside = sweep >= 34 && arcLength >= 118;

      if (inside) {
        const labelRadius = sweep > 80 ? radius * .56 : radius * .61;
        const p = polar(localCx, localCy, labelRadius, mid);
        textBlock(group, p.x, p.y - 5, item, "middle", false);
      } else {
        const p1 = polar(localCx, localCy, radius + 2, mid);
        const p2 = polar(localCx, localCy, radius + 28, mid);
        outsideLabels.push({
          item,
          group,
          p1,
          p2,
          right: Math.cos(midRad) >= 0,
          desiredY: p2.y
        });
      }

      chart.append(group);
      angle = end;
    });

    layoutOutsideLabels(outsideLabels, 105, 602, 44).forEach(label => {
      const x3 = label.right ? 692 : 68;
      const elbowX = label.right ? 656 : 104;

      label.group.append(svgNode("polyline", {
        points: `${label.p1.x},${label.p1.y} ${label.p2.x},${label.p2.y} ${elbowX},${label.y} ${x3},${label.y}`,
        class: "leader"
      }));

      textBlock(
        label.group,
        x3 + (label.right ? 5 : -5),
        label.y - 4,
        label.item,
        label.right ? "start" : "end",
        true
      );
    });
  }

  function layoutOutsideLabels(labels, minY, maxY, gap) {
    const result = [];

    for (const side of [false, true]) {
      const sideLabels = labels
        .filter(label => label.right === side)
        .sort((a, b) => a.desiredY - b.desiredY);

      if (!sideLabels.length) continue;

      let cursor = minY;
      sideLabels.forEach(label => {
        label.y = Math.max(label.desiredY, cursor);
        cursor = label.y + gap;
      });

      const overflow = sideLabels[sideLabels.length - 1].y - maxY;
      if (overflow > 0) {
        sideLabels.forEach(label => { label.y -= overflow; });
      }

      for (let i = sideLabels.length - 2; i >= 0; i--) {
        const maxAllowed = sideLabels[i + 1].y - gap;
        if (sideLabels[i].y > maxAllowed) sideLabels[i].y = maxAllowed;
      }

      const underflow = minY - sideLabels[0].y;
      if (underflow > 0) {
        sideLabels.forEach(label => { label.y += underflow; });
      }

      result.push(...sideLabels);
    }

    return result;
  }

  function normalize() {
    const total = items.reduce((sum, item) => sum + Math.max(0, Number(item.percent) || 0), 0);
    if (!total) return;

    let used = 0;
    items.forEach((item, i) => {
      if (i === items.length - 1) {
        item.percent = Math.max(0, Math.round((100 - used) * 10) / 10);
      } else {
        item.percent = Math.round((item.percent / total * 100) * 10) / 10;
        used += item.percent;
      }
    });

    renderRows();
    draw();
  }

  function serializedSvg() {
    const clone = chart.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("width", "1520");
    clone.setAttribute("height", "1280");

    const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
    style.textContent = `
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .svg-title { font-size:26px; font-weight:760; letter-spacing:-.025em; fill:#15171b; }
      .svg-subtitle { font-size:13px; font-weight:520; letter-spacing:.015em; fill:#747a83; }
      .slice-label { font-size:14px; font-weight:720; letter-spacing:-.01em; fill:#16181c; paint-order:stroke; stroke:rgba(255,255,255,.94); stroke-width:3.4px; stroke-linejoin:round; }
      .slice-sub { font-size:11.5px; font-weight:590; letter-spacing:.01em; fill:#555b64; paint-order:stroke; stroke:rgba(255,255,255,.95); stroke-width:3.2px; stroke-linejoin:round; }
      .leader { fill:none; stroke:#555b64; stroke-width:1.15; stroke-linecap:round; stroke-linejoin:round; opacity:.8; }
      .empty-text { fill:#8b919a; font-size:15px; }
    `;
    clone.prepend(style);
    return new XMLSerializer().serializeToString(clone);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  addBtn.addEventListener("click", () => {
    items.push({
      name: `項目${String.fromCharCode(65 + items.length)}`,
      percent: 0,
      explode: false
    });
    renderRows();
    draw();
  });

  normalizeBtn.addEventListener("click", normalize);
  chartTitleInput.addEventListener("input", draw);
  chartSubtitleInput.addEventListener("input", draw);
  totalValueInput.addEventListener("input", draw);

  svgBtn.addEventListener("click", () => {
    const data = serializedSvg();
    downloadBlob(
      new Blob([data], { type: "image/svg+xml;charset=utf-8" }),
      "pie-chart.svg"
    );
  });

  pngBtn.addEventListener("click", () => {
    const data = serializedSvg();
    const blob = new Blob([data], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const img = new Image();

    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 1520;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);

      canvas.toBlob(png => {
        if (png) downloadBlob(png, "pie-chart.png");
      }, "image/png");
    };

    img.src = url;
  });

  renderRows();
  draw();
})();
</script>
